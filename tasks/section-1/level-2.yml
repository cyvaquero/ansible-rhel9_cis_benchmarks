---
# Section 1, Level 2 controls, one file per control in level-2/.
#
# import_tasks, not include_tasks: imports are resolved when the playbook is parsed, so
# --list-tasks shows these tasks and --tags / --skip-tags match the tags set inside each
# control file (an include would need its own tags and could not be skipped by an inner
# tag). The when below is copied onto every imported task.

- name: "1.1.1.6 - Ensure the overlay kernel module is not available"
  ansible.builtin.import_tasks: level-2/1.1.1.6.yml
  when: "'1.1.1.6' in cis_selected_controls"

- name: "1.1.1.7 - Ensure the squashfs kernel module is not available"
  ansible.builtin.import_tasks: level-2/1.1.1.7.yml
  when: "'1.1.1.7' in cis_selected_controls"

- name: "1.1.1.8 - Ensure the udf kernel module is not available"
  ansible.builtin.import_tasks: level-2/1.1.1.8.yml
  when: "'1.1.1.8' in cis_selected_controls"

- name: "1.1.2.3.1 - Ensure /home is a separate mount"
  ansible.builtin.import_tasks: level-2/1.1.2.3.1.yml
  when: "'1.1.2.3.1' in cis_selected_controls"

- name: "1.1.2.4.1 - Ensure /var is a separate mount"
  ansible.builtin.import_tasks: level-2/1.1.2.4.1.yml
  when: "'1.1.2.4.1' in cis_selected_controls"

- name: "1.1.2.5.1 - Ensure /var/tmp is a separate mount"
  ansible.builtin.import_tasks: level-2/1.1.2.5.1.yml
  when: "'1.1.2.5.1' in cis_selected_controls"

- name: "1.1.2.6.1 - Ensure /var/log is a separate mount"
  ansible.builtin.import_tasks: level-2/1.1.2.6.1.yml
  when: "'1.1.2.6.1' in cis_selected_controls"

- name: "1.1.2.7.1 - Ensure /var/log/audit is a separate mount"
  ansible.builtin.import_tasks: level-2/1.1.2.7.1.yml
  when: "'1.1.2.7.1' in cis_selected_controls"

- name: "1.2.1.3 - Report the repo_gpgcheck settings"
  ansible.builtin.import_tasks: level-2/1.2.1.3.yml
  when: "'1.2.1.3' in cis_selected_controls"

- name: "1.2.1.5 - Ensure weak dependencies are configured"
  ansible.builtin.import_tasks: level-2/1.2.1.5.yml
  when: "'1.2.1.5' in cis_selected_controls"

- name: "1.3.1.5 - Ensure the SELinux mode is enforcing"
  ansible.builtin.import_tasks: level-2/1.3.1.5.yml
  when: "'1.3.1.5' in cis_selected_controls"

- name: "1.3.1.6 - Review the unconfined service processes"
  ansible.builtin.import_tasks: level-2/1.3.1.6.yml
  when: "'1.3.1.6' in cis_selected_controls"

- name: "1.4.3 - Ensure authentication is required in rescue mode"
  ansible.builtin.import_tasks: level-2/1.4.3.yml
  when: "'1.4.3' in cis_selected_controls"

- name: "1.4.4 - Ensure authentication is required in emergency mode"
  ansible.builtin.import_tasks: level-2/1.4.4.yml
  when: "'1.4.4' in cis_selected_controls"

- name: "1.5.2 - Ensure fs.protected_symlinks is configured"
  ansible.builtin.import_tasks: level-2/1.5.2.yml
  when: "'1.5.2' in cis_selected_controls"
...
