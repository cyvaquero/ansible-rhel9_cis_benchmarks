---
# 1.6.7 - The effective policy must offer ML-KEM groups. Appends the shipped PQ module
# when this RHEL 9 minor release has it; otherwise nothing can be changed and it is a
# finding. The logic is shared in tasks/lib/crypto_policy.yml.

- name: "1.6.7 - Ensure the crypto policy enables post-quantum algorithms"
  ansible.builtin.import_tasks: ../../lib/crypto_policy.yml
  vars:
    cis_cp_id: "1.6.7"
    cis_cp_kind: "pq"
    cis_cp_enforce: true
    cis_cp_module: "{{ cis_crypto_policy_module_pq }}"
  tags:
    - "1.6.7"
    - section-1
    - level-2
    - server
    - workstation
...
