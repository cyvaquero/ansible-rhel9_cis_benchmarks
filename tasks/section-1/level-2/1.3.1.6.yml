---
# 1.3.1.6 (manual) - lists the processes running in the unconfined_service_t SELinux
# domain for review. It only reads, in both modes, and records no finding: summary.yml
# lists manual controls. Nothing is listed when SELinux is disabled.

- name: "1.3.1.6 - List the processes in the unconfined_service_t domain"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - |
        set -eu
        ps -eZ | awk '$1 ~ /unconfined_service_t/ { print $2 " " $NF }'
  register: cis_check_1_3_1_6
  changed_when: false
  check_mode: false
  failed_when: false
  tags: &cis_tags_1_3_1_6
    - "1.3.1.6"
    - section-1
    - level-2
    - server
    - workstation

- name: "1.3.1.6 - Report the unconfined service processes for review"
  ansible.builtin.debug:
    msg: >-
      Processes (PID and name) in unconfined_service_t to review:
      {{ cis_check_1_3_1_6.stdout_lines | join(', ') if cis_check_1_3_1_6.stdout_lines | default([]) else 'none' }}
  tags: *cis_tags_1_3_1_6
...
