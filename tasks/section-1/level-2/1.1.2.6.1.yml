---
# 1.1.2.6.1 (audit-only) - reports whether /var/log is a mount point. The logic is shared in
# tasks/lib/mount_separate.yml. It never changes the host.

- name: "1.1.2.6.1 - Ensure /var/log is a separate mount"
  ansible.builtin.import_tasks: ../../lib/mount_separate.yml
  vars:
    cis_ms_id: "1.1.2.6.1"
    cis_ms_path: "/var/log"
  tags:
    - "1.1.2.6.1"
    - section-1
    - level-2
    - server
    - workstation
...
