---
# 1.7.3 - /etc/issue.net holds a login banner without escape sequences or the operating system name.
# The logic, including how a missing, empty or symlinked file is treated, is shared in
# tasks/lib/banner.yml.

- name: "1.7.3 - Ensure /etc/issue.net is configured"
  ansible.builtin.import_tasks: ../../lib/banner.yml
  vars:
    cis_bn_id: "1.7.3"
    cis_bn_path: "{{ cis_issue_net_path }}"
    cis_bn_emptyok: "no"
  tags:
    - "1.7.3"
    - section-1
    - level-1
    - server
    - workstation
...
