# 1.5.1 - fs.protected_hardlinks is set to an accepted value, both running and in the configuration.
# Accepted: 1. The logic is shared in tasks/lib/sysctl.yml.

- name: "1.5.1 - Ensure fs.protected_hardlinks is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "1.5.1"
    cis_sc_key: "fs.protected_hardlinks"
    cis_sc_ok: ["1"]
    cis_sc_set: "1"
  tags:
    - "1.5.1"
    - section-1
    - level-1
    - server
    - workstation
...
