---
# 1.5.5 - kernel.kptr_restrict is set to an accepted value, both running and in the
# configuration. Accepted: 1 or 2; a wrong value is set to 1 (cis_expect_sysctl). The fix
# writes cis_sysctl_kernel_kptr_restrict. The logic is shared in tasks/lib/sysctl.yml.

- name: "1.5.5 - Ensure kernel.kptr_restrict is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "1.5.5"
    cis_sc_key: "kernel.kptr_restrict"
    cis_sc_ok: "{{ cis_expect_sysctl['kernel.kptr_restrict'] }}"
    cis_sc_set: "{{ cis_sysctl_kernel_kptr_restrict }}"
  tags:
    - "1.5.5"
    - section-1
    - level-1
    - server
    - workstation
...
