---
# 1.1.2.1.3 - nosuid on /tmp. The logic is shared in tasks/lib/mount_option.yml.

- name: "1.1.2.1.3 - Ensure the nosuid option is set on /tmp"
  ansible.builtin.import_tasks: ../../lib/mount_option.yml
  vars:
    cis_mo_id: "1.1.2.1.3"
    cis_mo_path: "/tmp"
    cis_mo_option: "nosuid"
    cis_mo_unit: "tmp.mount"
  tags:
    - "1.1.2.1.3"
    - section-1
    - level-1
    - server
    - workstation
...
