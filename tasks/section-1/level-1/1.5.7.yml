---
# 1.5.7 - kernel.yama.ptrace_scope is set to an accepted value, both running and in the configuration.
# Accepted: 1, 2 or 3; a lower value is set to 1. The logic is shared in tasks/lib/sysctl.yml.

- name: "1.5.7 - Ensure kernel.yama.ptrace_scope is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "1.5.7"
    cis_sc_key: "kernel.yama.ptrace_scope"
    cis_sc_ok: ["1", "2", "3"]
    cis_sc_set: "1"
  tags:
    - "1.5.7"
    - section-1
    - level-1
    - server
    - workstation
...
