# 1.1.2.3.2 - nodev on /home. The logic is shared in tasks/lib/mount_option.yml.

- name: "1.1.2.3.2 - Ensure the nodev option is set on /home"
  ansible.builtin.import_tasks: ../../lib/mount_option.yml
  vars:
    cis_mo_id: "1.1.2.3.2"
    cis_mo_path: "/home"
    cis_mo_option: "nodev"
    cis_mo_options: "{{ cis_home_mount_options }}"
  tags:
    - "1.1.2.3.2"
    - section-1
    - level-1
    - server
    - workstation
...
