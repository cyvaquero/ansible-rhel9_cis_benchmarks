---
# 1.1.2.1.4 - noexec on /tmp. The logic is shared in tasks/lib/mount_option.yml.

- name: "1.1.2.1.4 - Ensure the noexec option is set on /tmp"
  ansible.builtin.import_tasks: ../../lib/mount_option.yml
  vars:
    cis_mo_id: "1.1.2.1.4"
    cis_mo_path: "/tmp"
    cis_mo_option: "noexec"
    cis_mo_options: "{{ cis_tmp_mount_options }}"
    cis_mo_unit: "tmp.mount"
  tags:
    - "1.1.2.1.4"
    - section-1
    - level-1
    - server
    - workstation
...
