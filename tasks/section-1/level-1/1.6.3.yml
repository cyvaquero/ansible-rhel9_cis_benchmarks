---
# 1.6.3 - No 64-bit tag or MD5 MAC may be allowed. Appends the role's own CIS-NO-WEAKMAC
# module. The logic is shared in tasks/lib/crypto_policy.yml.

- name: "1.6.3 - Ensure the crypto policy MACs are configured"
  ansible.builtin.import_tasks: ../../lib/crypto_policy.yml
  vars:
    cis_cp_id: "1.6.3"
    cis_cp_kind: "mac"
    cis_cp_module: "CIS-NO-WEAKMAC"
    cis_cp_pmod_body: |
      # Added by the CIS RHEL 9 role: drop 64-bit tag and MD5 MACs.
      mac = -*-64 -*-MD5
  tags:
    - "1.6.3"
    - section-1
    - level-1
    - server
    - workstation
...
