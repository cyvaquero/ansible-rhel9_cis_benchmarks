---
# 1.8.1 - the GDM login screen shows a banner (enabled, with text).
# Only when GDM is installed (package facts from preflight); without it the control is
# skipped with no finding. The logic is shared in
# tasks/lib/dconf.yml.

- name: "1.8.1 - Ensure the GDM login banner is enabled"
  ansible.builtin.import_tasks: ../../lib/dconf.yml
  vars:
    cis_dc_id: "1.8.1"
    cis_dc_db: "gdm"
    cis_dc_section: "org/gnome/login-screen"
    cis_dc_key: "banner-message-enable"
    cis_dc_kind: "eq"
    cis_dc_a: "true"
    cis_dc_b: ""
    cis_dc_write: "true"
  when: "'gdm' in ansible_facts.packages"
  tags:
    - "1.8.1"
    - section-1
    - level-1
    - server
    - workstation

- name: "1.8.1 - Ensure the GDM login banner has text"
  ansible.builtin.import_tasks: ../../lib/dconf.yml
  vars:
    cis_dc_id: "1.8.1"
    cis_dc_db: "gdm"
    cis_dc_section: "org/gnome/login-screen"
    cis_dc_key: "banner-message-text"
    cis_dc_kind: "nonempty"
    cis_dc_a: ""
    cis_dc_b: ""
    cis_dc_write: >-
      {{ "'" ~ (cis_banner_text | trim
                | replace(cis_dc_bs, cis_dc_bs ~ cis_dc_bs)
                | replace("'", cis_dc_bs ~ "'")
                | replace(cis_dc_nl, cis_dc_bs ~ "n")) ~ "'" }}
    # A backslash and a newline for the escaping above: template string literals are not unescaped, so they are set here.
    cis_dc_bs: "\\"
    cis_dc_nl: "\n"
  when: "'gdm' in ansible_facts.packages"
  tags:
    - "1.8.1"
    - section-1
    - level-1
    - server
    - workstation
...
