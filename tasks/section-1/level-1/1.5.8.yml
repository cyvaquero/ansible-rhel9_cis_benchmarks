---
# 1.5.8 - core dumps are limited to zero for every user (cis_expect_core_hard_limit; the fix
# writes cis_core_hard_limit, 0 by default). The check reads limits.conf and
# then limits.d/*.conf in order (a later wildcard entry wins) and prints "wild=<value>" for
# the last "* hard core" or "* - core" entry and "other=<n>" for entries of other domains
# (users, groups) that set a nonzero hard core limit. The fix writes the role file
# /etc/security/limits.d/99-zz-cis-benchmarks.conf with "* hard core 0", which sorts last.
# Entries for other domains are never edited: they are a finding. Remediate mode records a
# finding when the wildcard is still not 0 (a later file wins) or such entries exist; under
# --check nothing is fixed, so nothing is recorded then.

- name: "1.5.8 - Read the core file size limits"
  ansible.builtin.command:
    argv: &cis_argv_1_5_8
      - /bin/bash
      - -c
      - |
        set -u
        export LC_ALL=C
        shopt -s nullglob
        files=(/etc/security/limits.conf /etc/security/limits.d/*.conf)
        awk -v want="$1" '
        { sub(/#.*/, "") }
        NF >= 4 && $3 == "core" && ($2 == "hard" || $2 == "-") {
          if ($1 == "*") wild = $4
          else if ($4 != want) other++
        }
        END { print "wild=" wild; print "other=" other + 0 }' "${files[@]}" 2>/dev/null
      - bash
      - "{{ cis_expect_core_hard_limit }}"
  register: cis_check_1_5_8
  changed_when: false
  check_mode: false
  failed_when: false
  tags: &cis_tags_1_5_8
    - "1.5.8"
    - section-1
    - level-1
    - server
    - workstation

- name: "1.5.8 - Set the hard core limit in the role limits file"
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-zz-cis-benchmarks.conf
    content: |
      # Managed by rhel9_cis_benchmarks.
      * hard core {{ cis_core_hard_limit }}
    owner: root
    group: root
    mode: "0644"
  when:
    - not (cis_audit_only | bool)
    - "('wild=' ~ cis_core_hard_limit) not in cis_check_1_5_8.stdout_lines"
  tags: *cis_tags_1_5_8

- name: "1.5.8 - Read the core file size limits again after the fix"
  ansible.builtin.command:
    argv: *cis_argv_1_5_8
  register: cis_recheck_1_5_8
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - "('wild=' ~ cis_core_hard_limit) not in cis_check_1_5_8.stdout_lines"
  tags: *cis_tags_1_5_8

- name: "1.5.8 - Work out whether the limits are still not compliant"
  ansible.builtin.set_fact:
    cis_state_1_5_8_lines: "{{ cis_recheck_1_5_8.stdout_lines | default(cis_check_1_5_8.stdout_lines) }}"
  tags: *cis_tags_1_5_8

# Under --check the fix does not happen, so remediate mode records nothing then.
- name: "1.5.8 - Record the finding"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "1.5.8"
  when:
    - "('wild=' ~ cis_expect_core_hard_limit) not in cis_state_1_5_8_lines or 'other=0' not in cis_state_1_5_8_lines"
    - (cis_audit_only | bool) or not ansible_check_mode
  tags: *cis_tags_1_5_8
...
