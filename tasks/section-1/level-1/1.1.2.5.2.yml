---
# 1.1.2.5.2 - nodev on /var/tmp. The logic is shared in tasks/lib/mount_option.yml.

- name: "1.1.2.5.2 - Ensure the nodev option is set on /var/tmp"
  ansible.builtin.import_tasks: ../../lib/mount_option.yml
  vars:
    cis_mo_id: "1.1.2.5.2"
    cis_mo_path: "/var/tmp"
    cis_mo_option: "nodev"
    cis_mo_options: "{{ cis_var_tmp_mount_options }}"
  tags:
    - "1.1.2.5.2"
    - section-1
    - level-1
    - server
    - workstation
...
