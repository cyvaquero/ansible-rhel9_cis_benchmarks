---
# 1.3.1.7 - the mcstrans package is not installed. The check reads the package facts
# from preflight and always judges that it is absent (cis_expect_mcstrans_installed); the fix
# brings the package to the state cis_mcstrans_installed asks for with dnf (remove by default,
# install when the site set it to true) and reads the facts again to confirm.
# Remediate mode records a finding when the state is still not the benchmark's after the fix;
# under --check nothing is changed, so nothing is recorded then.

- name: "1.3.1.7 - Remove the mcstrans package"
  ansible.builtin.dnf:
    name: "{{ cis_state_1_3_1_7_installed }}"
    state: absent
  failed_when: false
  vars:
    cis_state_1_3_1_7_installed: "{{ ['mcstrans'] | select('in', ansible_facts.packages) | list }}"
  when:
    - not (cis_audit_only | bool)
    - not (cis_mcstrans_installed | bool)
    - cis_state_1_3_1_7_installed | length > 0
  tags: &cis_tags_1_3_1_7
    - "1.3.1.7"
    - section-1
    - level-1
    - server
    - workstation

- name: "1.3.1.7 - Install the mcstrans package"
  ansible.builtin.dnf:
    name: "{{ cis_state_1_3_1_7_missing }}"
    state: present
  failed_when: false
  vars:
    cis_state_1_3_1_7_missing: "{{ ['mcstrans'] | reject('in', ansible_facts.packages) | list }}"
  when:
    - not (cis_audit_only | bool)
    - cis_mcstrans_installed | bool
    - cis_state_1_3_1_7_missing | length > 0
  tags: *cis_tags_1_3_1_7

- name: "1.3.1.7 - Gather the installed packages again after the fix"
  ansible.builtin.package_facts:
    manager: rpm
  vars:
    cis_state_1_3_1_7_installed: "{{ ['mcstrans'] | select('in', ansible_facts.packages) | list }}"
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - >-
      (cis_state_1_3_1_7_installed | length > 0) != (cis_mcstrans_installed | bool)
      or (cis_mcstrans_installed | bool and cis_state_1_3_1_7_installed | length < 1)
  tags: *cis_tags_1_3_1_7

# Under --check the fix does not happen, so remediate mode records nothing then.
- name: "1.3.1.7 - Record the finding"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "1.3.1.7"
    cis_state_1_3_1_7_installed: "{{ ['mcstrans'] | select('in', ansible_facts.packages) | list }}"
  when:
    - >-
      (cis_state_1_3_1_7_installed | length > 0) != (cis_expect_mcstrans_installed | bool)
      or (cis_expect_mcstrans_installed | bool and cis_state_1_3_1_7_installed | length < 1)
    - (cis_audit_only | bool) or not ansible_check_mode
  tags: *cis_tags_1_3_1_7
...
