---
# 1.7.2 - /etc/issue holds a login banner without escape sequences or the operating system name.
# The logic, including how a missing, empty or symlinked file is treated, is shared in
# tasks/lib/banner.yml.

- name: "1.7.2 - Ensure /etc/issue is configured"
  ansible.builtin.import_tasks: ../../lib/banner.yml
  vars:
    cis_bn_id: "1.7.2"
    cis_bn_path: "/etc/issue"
    cis_bn_emptyok: "no"
  tags:
    - "1.7.2"
    - section-1
    - level-1
    - server
    - workstation
...
