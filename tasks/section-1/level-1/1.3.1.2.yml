---
# 1.3.1.2 - no boot entry turns SELinux off from the kernel command line. grubby reads and
# edits the boot entries of every installed kernel (BLS entries on RHEL 9); the check counts
# SELinux-disabling arguments in them (cis_expect_selinux_forbidden_args: selinux=0 and
# enforcing=0). A grubby that cannot be read counts as not compliant. The fix removes the
# arguments in cis_selinux_remove_boot_args (both by default) from all kernels. A running
# kernel started with either argument stays that way until the next boot, so the control sets
# cis_reboot_required when /proc/cmdline still holds one and the boot entries are clean.
# Remediate mode records a finding when the entries still hold an argument after the fix;
# under --check nothing is fixed, so nothing is recorded then.

- name: "1.3.1.2 - Count the SELinux-disabling arguments in the boot entries"
  ansible.builtin.command:
    argv: &cis_argv_1_3_1_2
      - /bin/sh
      - -c
      - |
        set -eu
        grubby --info=ALL | awk -v list="$1" '
        BEGIN { m = split(list, w, " "); for (j = 1; j <= m; j++) bad[w[j]] = 1 }
        /^args=/ {
          for (i = 1; i <= NF; i++) {
            a = $i; gsub(/^args="/, "", a); gsub(/"$/, "", a)
            if (a in bad) n++
          }
        }
        END { print n + 0 }'
      - sh
      - "{{ cis_expect_selinux_forbidden_args | join(' ') }}"
  register: cis_check_1_3_1_2
  changed_when: false
  check_mode: false
  failed_when: false
  tags: &cis_tags_1_3_1_2
    - "1.3.1.2"
    - section-1
    - level-1
    - server
    - workstation

- name: "1.3.1.2 - Check whether the running kernel was started with either argument"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - |
        for a in $1; do
          tr ' ' '\n' < /proc/cmdline | grep -Fqx -- "$a" && exit 0
        done
        exit 1
      - sh
      - "{{ cis_expect_selinux_forbidden_args | join(' ') }}"
  register: cis_check_1_3_1_2_running
  changed_when: false
  check_mode: false
  failed_when: false
  tags: *cis_tags_1_3_1_2

# changed_when is true because the command only runs when the check found an argument.
- name: "1.3.1.2 - Remove the SELinux-disabling arguments from all boot entries"
  ansible.builtin.command:
    argv:
      - grubby
      - --update-kernel=ALL
      - --remove-args
      - "{{ cis_selinux_remove_boot_args | join(' ') }}"
  changed_when: true
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - cis_selinux_remove_boot_args | length > 0
    - cis_check_1_3_1_2.rc == 0
    - cis_check_1_3_1_2.stdout | trim | int > 0
  tags: *cis_tags_1_3_1_2

- name: "1.3.1.2 - Count the arguments again after the fix"
  ansible.builtin.command:
    argv: *cis_argv_1_3_1_2
  register: cis_recheck_1_3_1_2
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - cis_check_1_3_1_2.rc == 0
    - cis_check_1_3_1_2.stdout | trim | int > 0
  tags: *cis_tags_1_3_1_2

- name: "1.3.1.2 - Work out whether the boot entries are still not compliant"
  ansible.builtin.set_fact:
    cis_state_1_3_1_2_bad: >-
      {{ (cis_recheck_1_3_1_2.rc | default(cis_check_1_3_1_2.rc)) != 0
         or (cis_recheck_1_3_1_2.stdout | default(cis_check_1_3_1_2.stdout)) | trim | int > 0 }}
  tags: *cis_tags_1_3_1_2

- name: "1.3.1.2 - Flag that a reboot is required"
  ansible.builtin.set_fact:
    cis_reboot_required: true
  when:
    - cis_check_1_3_1_2_running.rc == 0
    - not (cis_state_1_3_1_2_bad | bool)
  tags: *cis_tags_1_3_1_2

- name: "1.3.1.2 - Report that the running kernel keeps SELinux off until a reboot"
  ansible.builtin.debug:
    msg: "A reboot is pending: the running kernel was started with a SELinux-disabling argument that the boot entries no longer hold."
  when:
    - cis_check_1_3_1_2_running.rc == 0
    - not (cis_state_1_3_1_2_bad | bool)
  tags: *cis_tags_1_3_1_2

# Under --check the fix does not happen, so remediate mode records nothing then.
- name: "1.3.1.2 - Record the finding"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "1.3.1.2"
  when:
    - cis_state_1_3_1_2_bad | bool
    - (cis_audit_only | bool) or not ansible_check_mode
  tags: *cis_tags_1_3_1_2
...
