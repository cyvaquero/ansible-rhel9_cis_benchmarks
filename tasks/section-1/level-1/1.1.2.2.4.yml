---
# 1.1.2.2.4 - noexec on /dev/shm. The logic is shared in tasks/lib/mount_option.yml.

- name: "1.1.2.2.4 - Ensure the noexec option is set on /dev/shm"
  ansible.builtin.import_tasks: ../../lib/mount_option.yml
  vars:
    cis_mo_id: "1.1.2.2.4"
    cis_mo_path: "/dev/shm"
    cis_mo_option: "noexec"
    cis_mo_options: "{{ cis_dev_shm_mount_options }}"
    cis_mo_fstab_create:
      src: "tmpfs"
      fstype: "tmpfs"
  tags:
    - "1.1.2.2.4"
    - section-1
    - level-1
    - server
    - workstation
...
