  ansible.builtin.import_tasks: ../../lib/mount_separate.yml
  vars:
    cis_ms_id: "1.1.2.2.1"
    cis_ms_path: "/dev/shm"
  tags:
    - "1.1.2.2.1"
    - section-1
    - level-1
    - server
    - workstation
...
