---
# 1.3.1.1 - the libselinux package is installed. The check reads the package facts from
# preflight; the fix installs the package with dnf and reads the facts again to confirm.
# Remediate mode records a finding when the package is still missing after the fix; under
# --check nothing is installed, so nothing is recorded then.

- name: "1.3.1.1 - Install libselinux"
  ansible.builtin.dnf:
    name: libselinux
    state: present
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - "'libselinux' not in ansible_facts.packages"
  tags: &cis_tags_1_3_1_1
    - "1.3.1.1"
    - section-1
    - level-1
    - server
    - workstation

- name: "1.3.1.1 - Gather the installed packages again after the fix"
  ansible.builtin.package_facts:
    manager: rpm
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - "'libselinux' not in ansible_facts.packages"
  tags: *cis_tags_1_3_1_1

# Under --check the fix does not happen, so remediate mode records nothing then.
- name: "1.3.1.1 - Record the finding"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "1.3.1.1"
  when:
    - "'libselinux' not in ansible_facts.packages"
    - (cis_audit_only | bool) or not ansible_check_mode
  tags: *cis_tags_1_3_1_1
...
