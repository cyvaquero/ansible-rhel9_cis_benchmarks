---
# 1.6.4 - SSH must not offer CBC ciphers. Appends the role's own CIS-NO-SSHCBC module. The
# logic is shared in tasks/lib/crypto_policy.yml.

- name: "1.6.4 - Ensure the crypto policy disables CBC for SSH"
  ansible.builtin.import_tasks: ../../lib/crypto_policy.yml
  vars:
    cis_cp_id: "1.6.4"
    cis_cp_kind: "sshcbc"
    cis_cp_module: "CIS-NO-SSHCBC"
    cis_cp_pmod_body: |
      # Added by the CIS RHEL 9 role: drop CBC ciphers for SSH.
      cipher@SSH = -*-CBC
  tags:
    - "1.6.4"
    - section-1
    - level-1
    - server
    - workstation
...
