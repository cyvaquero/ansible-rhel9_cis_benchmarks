---
# 1.5.3 - fs.suid_dumpable is set to an accepted value, both running and in the configuration.
# Accepted: 0 (the vendor coredump file sets 2, the role file overrides it)
# (cis_expect_sysctl). The fix writes cis_sysctl_fs_suid_dumpable. The logic is shared in
# tasks/lib/sysctl.yml.

- name: "1.5.3 - Ensure fs.suid_dumpable is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "1.5.3"
    cis_sc_key: "fs.suid_dumpable"
    cis_sc_ok: "{{ cis_expect_sysctl['fs.suid_dumpable'] }}"
    cis_sc_set: "{{ cis_sysctl_fs_suid_dumpable }}"
  tags:
    - "1.5.3"
    - section-1
    - level-1
    - server
    - workstation
...
