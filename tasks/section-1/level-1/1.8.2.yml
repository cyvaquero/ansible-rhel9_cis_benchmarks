---
# 1.8.2 - the GDM login screen does not list users.
# Only when GDM is installed (package facts from preflight); without it the control is
# skipped with no finding. The logic is shared in
# tasks/lib/dconf.yml.

- name: "1.8.2 - Ensure the GDM user list is disabled"
  ansible.builtin.import_tasks: ../../lib/dconf.yml
  vars:
    cis_dc_id: "1.8.2"
    cis_dc_db: "gdm"
    cis_dc_section: "org/gnome/login-screen"
    cis_dc_key: "disable-user-list"
    cis_dc_kind: "eq"
    cis_dc_a: "true"
    cis_dc_b: ""
    cis_dc_write: "true"
  when: "'gdm' in ansible_facts.packages"
  tags:
    - "1.8.2"
    - section-1
    - level-1
    - server
    - workstation
...
