---
# 1.4.5 - systemd cannot be told to ask before starting each service at boot. Two places
# can do that: a systemd.confirm_spawn argument on a boot entry, and ConfirmSpawn set to a
# true value in /etc/systemd/system.conf or /etc/systemd/system.conf.d. The check lists
# the distinct arguments from grubby (BLS entries on RHEL 9) as "arg|<token>" and the
# configuration files as "conf|<file>". The fix removes exactly those arguments with
# grubby (which also keeps /etc/default/grub in line) and sets ConfirmSpawn=no in each
# file. A running kernel that still has the argument stays that way until the next boot, so
# the control sets cis_reboot_required when /proc/cmdline holds it and the entries are clean.
# The configuration files take effect at the next boot or daemon-reexec, which the role
# does not run.
# Remediate mode records a finding when the entries or files are still not clean after
# the fix (the entries are read again after grubby); under --check nothing is fixed, so
# nothing is recorded then.

- name: "1.4.5 - List the confirm_spawn settings in the boot entries and systemd configuration"
  ansible.builtin.command:
    argv: &cis_argv_1_4_5
      - /bin/bash
      - -c
      - |
        set -u
        if grubby --info=ALL >/dev/null 2>&1; then
          grubby --info=ALL | awk '
          /^args=/ {
            for (i = 1; i <= NF; i++) {
              a = $i; gsub(/^args="/, "", a); gsub(/"$/, "", a)
              if (a ~ /^systemd\.confirm_spawn(=|$)/) print "arg|" a
            }
          }' | sort -u
        else
          echo "unreadable|grubby"
        fi
        for f in /etc/systemd/system.conf /etc/systemd/system.conf.d/*.conf; do
          [ -f "$f" ] || continue
          grep -Eiq '^[ \t]*ConfirmSpawn[ \t]*=[ \t]*(yes|true|1|on)[ \t]*$' "$f" && echo "conf|$f"
        done
        exit 0
  register: cis_check_1_4_5
  changed_when: false
  check_mode: false
  failed_when: false
  tags: &cis_tags_1_4_5
    - "1.4.5"
    - section-1
    - level-1
    - server
    - workstation

- name: "1.4.5 - Check whether the running kernel was started with the argument"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - tr ' ' '\n' < /proc/cmdline | grep -Eq '^systemd[.]confirm_spawn(=|$)'
  register: cis_check_1_4_5_running
  changed_when: false
  check_mode: false
  failed_when: false
  tags: *cis_tags_1_4_5

# changed_when is true because the command only runs when the check found an argument.
- name: "1.4.5 - Remove the confirm_spawn arguments from all boot entries"
  ansible.builtin.command:
    argv:
      - grubby
      - --update-kernel=ALL
      - --remove-args
      - "{{ cis_check_1_4_5.stdout_lines | select('match', '^arg[|]') | map('regex_replace', '^arg[|]', '') | join(' ') }}"
  changed_when: true
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - cis_check_1_4_5.stdout_lines | select('match', '^arg[|]') | list | length > 0
  tags: *cis_tags_1_4_5

- name: "1.4.5 - Turn ConfirmSpawn off in the systemd configuration"
  ansible.builtin.replace:
    path: "{{ item | regex_replace('^conf[|]', '') }}"
    regexp: '^([ \t]*ConfirmSpawn[ \t]*=[ \t]*)(?i:yes|true|1|on)([ \t]*)$'
    replace: '\1no\2'
  loop: "{{ cis_check_1_4_5.stdout_lines | select('match', '^conf[|]') | list }}"
  failed_when: false
  when: not (cis_audit_only | bool)
  tags: *cis_tags_1_4_5

- name: "1.4.5 - List the settings again after the fix"
  ansible.builtin.command:
    argv: *cis_argv_1_4_5
  register: cis_recheck_1_4_5
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - cis_check_1_4_5.stdout_lines | length > 0
  tags: *cis_tags_1_4_5

- name: "1.4.5 - Work out whether anything is still not compliant"
  ansible.builtin.set_fact:
    cis_state_1_4_5_bad: "{{ (cis_recheck_1_4_5.stdout_lines | default(cis_check_1_4_5.stdout_lines)) | length > 0 }}"
  tags: *cis_tags_1_4_5

- name: "1.4.5 - Flag that a reboot is required"
  ansible.builtin.set_fact:
    cis_reboot_required: true
  when:
    - cis_check_1_4_5_running.rc == 0
    - not (cis_state_1_4_5_bad | bool)
  tags: *cis_tags_1_4_5

- name: "1.4.5 - Report that the running kernel keeps the argument until a reboot"
  ansible.builtin.debug:
    msg: "A reboot is pending: the running kernel was started with systemd.confirm_spawn, which the boot entries no longer hold."
  when:
    - cis_check_1_4_5_running.rc == 0
    - not (cis_state_1_4_5_bad | bool)
  tags: *cis_tags_1_4_5

# Under --check the fix does not happen, so remediate mode records nothing then.
- name: "1.4.5 - Record the finding"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "1.4.5"
  when:
    - cis_state_1_4_5_bad | bool
    - (cis_audit_only | bool) or not ansible_check_mode
  tags: *cis_tags_1_4_5
...
