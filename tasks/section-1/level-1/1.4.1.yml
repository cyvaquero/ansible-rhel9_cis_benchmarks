---
# 1.4.1 - the boot loader has a password. On RHEL 9 grub2 reads the hash from
# /boot/grub2/user.cfg (GRUB2_PASSWORD=...), which /etc/grub.d/01_users turns into a
# superuser at boot, so no grub2-mkconfig is needed. The role cannot invent a password:
# the hash comes from cis_grub_password_hash (output of grub2-mkpasswd-pbkdf2, keep it in
# a vault). With the variable empty the control only reports; it never touches the host.
# With a well-formed hash the role writes user.cfg (owner, group and mode from
# cis_bootloader_file_owner, _group and _mode: root:root 0600 by default; the tasks that carry
# the hash use no_log). A malformed hash is a finding and nothing is written.
# Remediate mode records a finding when no hash is in place after the fix; under --check
# nothing is fixed, so nothing is recorded then.

- name: "1.4.1 - Check the boot loader password file"
  ansible.builtin.command:
    argv: &cis_argv_1_4_1
      - grep
      - -Eq
      - '^GRUB2_PASSWORD=grub\.pbkdf2\.sha512\.[0-9]+\.[0-9A-Fa-f]+\.[0-9A-Fa-f]+$'
      - /boot/grub2/user.cfg
  register: cis_check_1_4_1
  changed_when: false
  check_mode: false
  failed_when: false
  tags: &cis_tags_1_4_1
    - "1.4.1"
    - section-1
    - level-1
    - server
    - workstation

- name: "1.4.1 - Write the boot loader password file"
  ansible.builtin.copy:
    dest: /boot/grub2/user.cfg
    content: "GRUB2_PASSWORD={{ cis_grub_password_hash }}\n"
    owner: "{{ cis_bootloader_file_owner }}"
    group: "{{ cis_bootloader_file_group }}"
    mode: "{{ cis_bootloader_file_mode }}"
  no_log: true
  vars:
    cis_state_1_4_1_valid: "{{ cis_grub_password_hash | default('') is match('^grub\\.pbkdf2\\.sha512\\.[0-9]+\\.[0-9A-Fa-f]+\\.[0-9A-Fa-f]+$') }}"
  when:
    - not (cis_audit_only | bool)
    - cis_grub_password_hash | default('') != ''
    - cis_state_1_4_1_valid | bool
  tags: *cis_tags_1_4_1

- name: "1.4.1 - Check the boot loader password file again after the fix"
  ansible.builtin.command:
    argv: *cis_argv_1_4_1
  register: cis_recheck_1_4_1
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - cis_check_1_4_1.rc != 0
    - cis_grub_password_hash | default('') != ''
  tags: *cis_tags_1_4_1

# Also true when the variable is set and the hash is malformed or differs from the file:
# a set hash is compared by rewriting, so only the missing-hash state is reported here.
- name: "1.4.1 - Record the finding"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "1.4.1"
  when:
    - (cis_recheck_1_4_1.rc | default(cis_check_1_4_1.rc)) != 0
    - (cis_audit_only | bool) or not ansible_check_mode
  tags: *cis_tags_1_4_1
...
