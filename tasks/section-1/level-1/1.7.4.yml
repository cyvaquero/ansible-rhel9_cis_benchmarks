# tasks/lib/banner_access.yml.

- name: "1.7.4 - Ensure access to /etc/motd is configured"
  ansible.builtin.import_tasks: ../../lib/banner_access.yml
  vars:
    cis_ba_id: "1.7.4"
    cis_ba_path: "{{ cis_motd_path }}"
  tags:
    - "1.7.4"
    - section-1
    - level-1
    - server
    - workstation
...
