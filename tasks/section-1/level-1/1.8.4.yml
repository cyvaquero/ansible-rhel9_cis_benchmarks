---
# 1.8.4 - removable media is not mounted automatically. Level 1 for the Server
# profile and Level 2 for Workstation; preflight selects it by profile and level.
# Only when GDM is installed (package facts from preflight); without it the control is
# skipped with no finding. The logic is shared in
# tasks/lib/dconf.yml.

- name: "1.8.4 - Ensure GDM automount is disabled"
  ansible.builtin.import_tasks: ../../lib/dconf.yml
  vars:
    cis_dc_id: "1.8.4"
    cis_dc_db: "local"
    cis_dc_section: "org/gnome/desktop/media-handling"
    cis_dc_key: "automount"
    cis_dc_kind: "eq"
    cis_dc_a: "false"
    cis_dc_b: ""
    cis_dc_write: "false"
  when: "'gdm' in ansible_facts.packages"
  tags:
    - "1.8.4"
    - section-1
    - level-1
    - level-2
    - server
    - workstation

- name: "1.8.4 - Ensure GDM automount-open is disabled"
  ansible.builtin.import_tasks: ../../lib/dconf.yml
  vars:
    cis_dc_id: "1.8.4"
    cis_dc_db: "local"
    cis_dc_section: "org/gnome/desktop/media-handling"
    cis_dc_key: "automount-open"
    cis_dc_kind: "eq"
    cis_dc_a: "false"
    cis_dc_b: ""
    cis_dc_write: "false"
  when: "'gdm' in ansible_facts.packages"
  tags:
    - "1.8.4"
    - section-1
    - level-1
    - level-2
    - server
    - workstation
...
