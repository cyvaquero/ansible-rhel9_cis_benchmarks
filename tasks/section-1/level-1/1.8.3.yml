---
# 1.8.3 - the GDM session blanks after a short idle time and locks shortly after.
# Accepted (cis_expect_gdm_*): idle-delay from 1 to 900, lock-delay from 0 to 5. The fix writes
# cis_gdm_idle_delay and cis_gdm_lock_delay when the configured value is not accepted.
# Only when GDM is installed (package facts from preflight); without it the control is
# skipped with no finding. The logic is shared in
# tasks/lib/dconf.yml.

- name: "1.8.3 - Ensure the GDM idle delay is configured"
  ansible.builtin.import_tasks: ../../lib/dconf.yml
  vars:
    cis_dc_id: "1.8.3"
    cis_dc_db: "local"
    cis_dc_section: "org/gnome/desktop/session"
    cis_dc_key: "idle-delay"
    cis_dc_kind: "range"
    cis_dc_a: "{{ cis_expect_gdm_idle_delay_min }}"
    cis_dc_b: "{{ cis_expect_gdm_idle_delay_max }}"
    cis_dc_write: "uint32 {{ cis_gdm_idle_delay }}"
  when: "'gdm' in ansible_facts.packages"
  tags:
    - "1.8.3"
    - section-1
    - level-1
    - server
    - workstation

- name: "1.8.3 - Ensure the GDM screen lock delay is configured"
  ansible.builtin.import_tasks: ../../lib/dconf.yml
  vars:
    cis_dc_id: "1.8.3"
    cis_dc_db: "local"
    cis_dc_section: "org/gnome/desktop/screensaver"
    cis_dc_key: "lock-delay"
    cis_dc_kind: "range"
    cis_dc_a: "{{ cis_expect_gdm_lock_delay_min }}"
    cis_dc_b: "{{ cis_expect_gdm_lock_delay_max }}"
    cis_dc_write: "uint32 {{ cis_gdm_lock_delay }}"
  when: "'gdm' in ansible_facts.packages"
  tags:
    - "1.8.3"
    - section-1
    - level-1
    - server
    - workstation
...
