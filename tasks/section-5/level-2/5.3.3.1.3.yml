---
# 5.3.3.1.3 - Level 2. The root account is locked out like the others: even_deny_root is set in
# /etc/security/faillock.conf (or root_unlock_time, which implies it), and a root_unlock_time that
# is set is 0 or at least 60. A root_unlock_time below 60 is replaced by cis_faillock_root_unlock_time
# (60 by default); one is never added when none is set. A root_unlock_time= argument on a pam_faillock
# line with a value below 60 is removed from the templates of the role's own authselect profile.
# Lockout risk: root can be locked out of password logins, so keep a console or sudo account.
# The logic is in tasks/lib/pam_setting.yml.

- name: "5.3.3.1.3 - Ensure password failed attempts lockout includes root account"
  ansible.builtin.import_tasks: ../../lib/pam_setting.yml
  vars:
    cis_ps_id: "5.3.3.1.3"
    cis_ps_conf:
      - path: /etc/security/faillock.conf
        regexp: '^\s*even_deny_root\b'
        line: 'even_deny_root'
      - path: /etc/security/faillock.conf
        regexp: '^\s*root_unlock_time\s*='
        line: 'root_unlock_time = {{ cis_faillock_root_unlock_time }}'
        skip: '{{ cis_pam.verdict[''5.3.3.1.3''].detail | default([]) | select(''match'', ''^root_unlock_time '') | list | length == 0 }}'
    cis_ps_header: ''
    cis_ps_tmpl:
      - re: '(^[ \t]*[a-z]+[ \t]+[^\n#]*?\bpam_faillock\.so\b[^\n#]*?)[ \t]+root_unlock_time=\S*'
        to: '\1'
    cis_ps_feature: ''
  tags:
    - "5.3.3.1.3"
    - section-5
    - level-2
    - server
    - workstation
...
