# 5.3 (PAM and authselect). PAM is changed only through authselect. A host that authselect does not
# manage is moved to a custom profile of the role's own (cis_authselect_profile, based on sssd) by
# 5.3.2.1, behind a lockout guard (see that file); the settings go in the configuration files of
# the modules (faillock.conf, a pwquality drop-in, pwhistory.conf), not on the PAM lines. The
# verdicts come from files/pam_scan.py, read once here and again after each change
# (tasks/lib/pam_state.yml). 5.3.3.1.3 (Level 2) is in level-2.yml, and runs after the Level 1
# controls here.

# One read of the host before the controls of 5.3.2 and 5.3.3. It only reads, so it runs in
# audit mode too, and it carries the always tag so a run limited to one control still has it.
- name: "5.3 - Read the PAM and authselect configuration"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/lib/pam_state.yml"
  when: "cis_selected_controls | select('match', '^5\\.3\\.[23]\\.') | list | length > 0"
  tags:
    - always

- name: "5.3.1.1 - Ensure latest version of pam is installed"
  ansible.builtin.import_tasks: level-1/5.3.1.1.yml
  when: "'5.3.1.1' in cis_selected_controls"

- name: "5.3.1.2 - Ensure latest version of authselect is installed"
  ansible.builtin.import_tasks: level-1/5.3.1.2.yml
  when: "'5.3.1.2' in cis_selected_controls"

- name: "5.3.1.3 - Ensure latest version of libpwquality is installed"
