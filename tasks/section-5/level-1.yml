---
# Section 5, Level 1 controls, one file per control in level-1/. The Level 2 controls of
# section 5 are in level-2.yml.
#
# import_tasks, not include_tasks: see tasks/section-1/level-1.yml.
#
# 5.1 (SSH server). The role's own sshd settings go in one drop-in (cis_sshd_dropin) whose
# name sorts before 50-redhat.conf, because sshd uses the first value it reads for most keywords (MaxStartups takes the last); the
# controls judge the effective configuration with `sshd -T`, never one file, and a handler
# validates it with `sshd -t` and reloads sshd only when it is running (never a restart).
#
# 5.1.11 and 5.1.12 are Level 1 on a workstation and Level 2 on a server, so they sit here
# and preflight's selection decides.

# The account the role is connected as, for the lockout guards of 5.1.8 and 5.1.21 and for
# `sshd -T -C`, which evaluates Match blocks for that account. Read with become off (sudo
# drops SSH_CONNECTION). It only reads the host, so it runs in audit mode too, and it
# carries the always tag so a run limited to one control still has it.
- name: "5.1 - Read the SSH connection of this run"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - 'printf "%s\n%s\n" "$(id -un 2>/dev/null)" "${SSH_CONNECTION:-}"'
  register: cis_sshd_conn_read
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  when: "cis_selected_controls | select('match', '^5\\.1\\.') | list | length > 0"
  tags:
    - always

- name: "5.1 - Record the SSH connection of this run"
  ansible.builtin.set_fact:
    cis_sshd_conn_user: "{{ cis_sshd_conn_read.stdout_lines[0] | default('') }}"
    cis_sshd_over_ssh: "{{ (ansible_connection | default('ssh')) is search('ssh|paramiko|smart') }}"
    cis_sshd_ctx: >-
      {{ ('user=' ~ cis_sshd_conn_read.stdout_lines[0] ~ ',host=' ~ cis_sshd_conn_read.stdout_lines[1].split()[0]
          ~ ',addr=' ~ cis_sshd_conn_read.stdout_lines[1].split()[0])
         if (cis_sshd_conn_read.stdout_lines | length > 1 and cis_sshd_conn_read.stdout_lines[0] | length > 0
             and cis_sshd_conn_read.stdout_lines[1] | length > 0)
         else '' }}
  when: "cis_selected_controls | select('match', '^5\\.1\\.') | list | length > 0"
  tags:
    - always

- name: "5.1.1 - Ensure access to /etc/ssh/sshd_config is configured"
  ansible.builtin.import_tasks: level-1/5.1.1.yml
  when: "'5.1.1' in cis_selected_controls"

