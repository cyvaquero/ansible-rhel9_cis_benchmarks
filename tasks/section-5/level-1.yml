# 5.4 (accounts and environment). The scan of the accounts, the account databases, the shell
# files and root's login (files/accounts_scan.py, tasks/lib/accounts_state.yml) is read once here
# and again after a change. The password aging controls (5.4.1.1, 5.4.1.3, 5.4.1.5) also change
# existing accounts that have a password hash, but never one whose password would be expired or
# inactive with the new value. 5.4.2.7 and 5.4.2.8 change only system accounts and never the
# account the role is connected as (see below), root, an account with a running process or one
# in cis_account_exceptions. 5.4.1.2 and 5.4.3.1 (Level 2) are in level-2.yml, and run after the
# Level 1 controls here. 5.4.3.2 and 5.4.3.4 share one role-owned /etc/profile.d file.

# The accounts the role must never lock out or give a nologin shell: the account it is connected
# as (read with become off, so it is the login account, not root), ansible_user and the account
# become runs through. It only reads the host, so it runs in audit mode too, and it carries the
# always tag so a run limited to one control still has it.
- name: "5.4 - Read the account of this run"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - 'id -un 2>/dev/null'
  register: cis_acct_conn_read
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  when: "cis_selected_controls | select('match', '^5\\.4\\.') | list | length > 0"
  tags:
    - always

- name: "5.4 - Record the accounts the role must never lock out"
  ansible.builtin.set_fact:
    cis_acct_guard: >-
      {{ ([cis_acct_conn_read.stdout_lines[0] | default(''), ansible_user | default(''),
           ansible_ssh_user | default(''), ansible_become_user | default('root')]
          | select | unique | list) }}
  when: "cis_selected_controls | select('match', '^5\\.4\\.') | list | length > 0"
  tags:
    - always

- name: "5.4 - Read the accounts and the shell environment"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/lib/accounts_state.yml"
  when: "cis_selected_controls | select('match', '^5\\.4\\.') | list | length > 0"
  tags:
    - always

