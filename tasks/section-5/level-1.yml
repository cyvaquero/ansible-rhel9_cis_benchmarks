# so it runs in audit mode too, and it carries the always tag so a run limited to one
# control still has it.
- name: "5.2 - Read the account of this run"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - 'id -un 2>/dev/null'
  register: cis_sudo_conn_read
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  when: "cis_selected_controls | select('match', '^5\\.2\\.(6|7)$') | list | length > 0"
  tags:
    - always

- name: "5.2 - Record the account of this run"
  ansible.builtin.set_fact:
    cis_sudo_conn_user: "{{ cis_sudo_conn_read.stdout_lines[0] | default('') }}"
  when: "cis_selected_controls | select('match', '^5\\.2\\.(6|7)$') | list | length > 0"
  tags:
