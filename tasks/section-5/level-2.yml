---
# Section 5, Level 2 controls, one file per control in level-2/.
#
# import_tasks, not include_tasks: see tasks/section-1/level-1.yml.

# 5.2.6 reads the account of this run (cis_sudo_conn_user), which level-1.yml sets, and
# Level 2 includes Level 1. It is also in cis_default_exclusions.
- name: "5.2.6 - Ensure users must provide password for escalation"
  ansible.builtin.import_tasks: level-2/5.2.6.yml
  when: "'5.2.6' in cis_selected_controls"

# 5.3.3.1.3 judges the state the Level 1 controls of 5.3 left (cis_pam), which level-1.yml reads.
- name: "5.3.3.1.3 - Ensure password failed attempts lockout includes root account"
  ansible.builtin.import_tasks: level-2/5.3.3.1.3.yml
  when: "'5.3.3.1.3' in cis_selected_controls"

# 5.4.1.2 and 5.4.3.1 read the scan of the accounts (cis_acct), which level-1.yml reads, and Level 2
# includes Level 1.
- name: "5.4.1.2 - Ensure minimum password days is configured"
  ansible.builtin.import_tasks: level-2/5.4.1.2.yml
  when: "'5.4.1.2' in cis_selected_controls"

- name: "5.4.3.1 - Ensure nologin is not listed in /etc/shells"
  ansible.builtin.import_tasks: level-2/5.4.3.1.yml
  when: "'5.4.3.1' in cis_selected_controls"
...
