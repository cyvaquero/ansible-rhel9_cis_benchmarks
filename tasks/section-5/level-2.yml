# Level 2 includes Level 1. It is also in cis_default_exclusions.
- name: "5.2.6 - Ensure users must provide password for escalation"
  ansible.builtin.import_tasks: level-2/5.2.6.yml
  when: "'5.2.6' in cis_selected_controls"
...
