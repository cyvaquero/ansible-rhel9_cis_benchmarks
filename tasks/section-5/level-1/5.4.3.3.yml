---
# 5.4.3.3 - UMASK in /etc/login.defs is 027 or more restrictive (the benchmark). pam_umask reads it for
# every PAM session (SSH, console, su -) before any shell file runs, and useradd uses it for new
# home directories. The fix makes it exactly cis_umask (a different spelling of the same mask, 0027
# for 027, is left alone), a stricter value included.

- name: "5.4.3.3 - Set UMASK in login.defs"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*UMASK\s'
    line: "UMASK {{ cis_umask }}"
  when:
    - not (cis_audit_only | bool)
    - cis_acct.defaults.umask.fix | bool
  tags:
    - "5.4.3.3"
    - section-5
    - level-1
    - server
    - workstation

- name: "5.4.3.3 - Record the finding"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "5.4.3.3"
  when:
    - >-
      (cis_audit_only | bool and not cis_acct.defaults.umask.ok)
      or not cis_acct.target_ok.umask
  tags:
    - "5.4.3.3"
    - section-5
    - level-1
    - server
    - workstation
...
