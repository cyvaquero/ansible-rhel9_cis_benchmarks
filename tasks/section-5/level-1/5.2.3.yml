---
# 5.2.3 - /etc/sudoers.d is owned by root:root with mode 0750 or stricter (the benchmark). A host without the folder passes.
# Two things are judged for each one. The benchmark: owner and group root:root, none of the bits
# 0027 set (cis_expect_sudoers_*). The site's setting: the owner, group and mode of
# cis_sudoers_owner, cis_sudoers_group and cis_sudoers_dir_mode. The fix gives every one that fails either
# exactly the owner, group and mode of the variables, a stricter mode included; one that passes
# both is left alone. A finding is recorded only when the benchmark still fails after the fix (a
# site that sets a weaker mode), or the wanted owner or group does not exist (nothing is changed
# then). Under --check nothing changes and, in remediate mode, nothing is recorded.
#
# The check prints `fix=<path>` for each path to change, `bad=<path>` for each that fails the
# benchmark and state=ok|diff|bad|unfixable.

- name: "5.2.3 - Handle the access on the sudoers.d directory"
  tags:
    - "5.2.3"
    - section-5
    - level-1
    - server
  block:
    - name: "5.2.3 - Check the owner and mode of the sudoers.d directory"
      ansible.builtin.command:
        argv: &cis_sudo_5_2_3_argv
          - /bin/sh
          - -c
          - |
            export LC_ALL=C
            wo=$1 wg=$2 wm=$3 bo=$4 bg=$5 fb=$6
            [ -d /etc/sudoers.d ] || { echo "state=ok"; exit 0; }
            if ! getent passwd "$wo" >/dev/null 2>&1 || ! getent group "$wg" >/dev/null 2>&1; then
              echo "state=unfixable"
              exit 1
            fi
            out=""
            for f in $(find /etc/sudoers.d -maxdepth 0 -type d 2>/dev/null); do
              set -- "$f" $(stat -c '%a %U %G' "$f")
              bad=0
              [ $(( 0$2 & fb )) -gt 0 ] && bad=1
              [ "$3" != "$bo" ] && bad=1
              [ "$4" != "$bg" ] && bad=1
              differs=0
              [ $(( 0$2 )) -ne $(( 0$wm )) ] && differs=1
              [ "$3" != "$wo" ] && differs=1
              [ "$4" != "$wg" ] && differs=1
              if [ "$bad" -eq 1 ] || [ "$differs" -eq 1 ]; then
                out="$out
            fix=$1"
                [ "$bad" -eq 1 ] && out="$out
            bad=$1"
              fi
            done
            out=$(printf '%s\n' "$out" | sed '/^$/d')
            if [ -n "$out" ]; then
              printf '%s\n' "$out"
              if printf '%s\n' "$out" | grep -q '^bad='; then
                echo "state=bad"
                exit 1
              fi
              echo "state=diff"
              exit 0
            fi
            echo "state=ok"
          - sh
          - "{{ cis_sudoers_owner }}"
          - "{{ cis_sudoers_group }}"
          - "{{ cis_sudoers_dir_mode }}"
          - "{{ cis_expect_sudoers_owner }}"
          - "{{ cis_expect_sudoers_group }}"
          - "{{ cis_expect_sudoers_dir_forbidden_bits }}"
      register: cis_check_5_2_3
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "5.2.3 - Set the owner and mode of the sudoers.d directory"
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ cis_sudoers_owner }}"
        group: "{{ cis_sudoers_group }}"
        mode: "{{ cis_sudoers_dir_mode }}"
        follow: false
      loop: "{{ cis_check_5_2_3.stdout_lines | select('match', '^fix=') | map('regex_replace', '^fix=', '') | list }}"
      when:
        - not (cis_audit_only | bool)

    - name: "5.2.3 - Check the owner and mode of the sudoers.d directory again after the fix"
      ansible.builtin.command:
        argv: *cis_sudo_5_2_3_argv
      register: cis_recheck_5_2_3
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode
        - "'state=ok' not in cis_check_5_2_3.stdout_lines"

    - name: "5.2.3 - Record the finding"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "5.2.3"
      when:
        - >-
          ('state=unfixable' in cis_check_5_2_3.stdout_lines)
          or (cis_audit_only | bool and 'state=bad' in cis_check_5_2_3.stdout_lines)
          or (cis_recheck_5_2_3 is not skipped and 'state=bad' in cis_recheck_5_2_3.stdout_lines)
...
