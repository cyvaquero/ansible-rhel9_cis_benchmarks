---
# 5.2.1 - sudo is installed (the benchmark). The fix follows
# cis_sudo_installed: true installs sudo when missing, false removes it when no other installed
# package needs it (one that is needed stays and is reported). sudo is never removed while the role
# becomes root with sudo and is not connected as root, whatever the variable says. A site that sets
# false gets a finding on every run. The logic is in tasks/lib/package_min_version.yml.

- name: "5.2.1 - Ensure sudo is installed"
  ansible.builtin.import_tasks: ../../lib/package_min_version.yml
  vars:
    cis_pm_id: "5.2.1"
    cis_pm_package: sudo
    cis_pm_min: ""
    cis_pm_want: "{{ cis_sudo_installed | bool }}"
    # Removing sudo would cut the role off when it becomes root with sudo (the default become
    # method) and is not connected as root.
    cis_pm_remove_ok: >-
      {{ (cis_sudo_conn_user | default('')) == 'root'
         or (ansible_become_method | default('sudo')) != 'sudo'
         or not (ansible_become | default(true) | bool) }}
  tags:
    - "5.2.1"
    - section-5
    - level-1
    - server
    - workstation
...
