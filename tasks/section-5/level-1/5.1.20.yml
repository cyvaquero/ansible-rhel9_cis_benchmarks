---
# 5.1.20 - PermitEmptyPasswords is no.
# The logic is shared in tasks/lib/sshd_option.yml.

- name: "5.1.20 - Ensure sshd PermitEmptyPasswords is disabled"
  ansible.builtin.import_tasks: ../../lib/sshd_option.yml
  vars:
    cis_sd_id: "5.1.20"
    cis_sd_options:
      - spec: "permitemptypasswords|eq|{{ cis_expect_sshd_permit_empty_passwords }}|{{ 'yes' if cis_sshd_permit_empty_passwords | bool else 'no' }}"
        directive: "PermitEmptyPasswords"
        value: "{{ 'yes' if cis_sshd_permit_empty_passwords | bool else 'no' }}"
  tags:
    - "5.1.20"
    - section-5
    - level-1
    - server
    - workstation
...
