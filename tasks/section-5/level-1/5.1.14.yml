---
# 5.1.14 - IgnoreRhosts is yes.
# The logic is shared in tasks/lib/sshd_option.yml.

- name: "5.1.14 - Ensure sshd IgnoreRhosts is enabled"
  ansible.builtin.import_tasks: ../../lib/sshd_option.yml
  vars:
    cis_sd_id: "5.1.14"
    cis_sd_options:
      - spec: "ignorerhosts|eq|{{ cis_expect_sshd_ignore_rhosts }}|{{ 'yes' if cis_sshd_ignore_rhosts | bool else 'no' }}"
        directive: "IgnoreRhosts"
        value: "{{ 'yes' if cis_sshd_ignore_rhosts | bool else 'no' }}"
  tags:
    - "5.1.14"
    - section-5
    - level-1
    - server
    - workstation
...
