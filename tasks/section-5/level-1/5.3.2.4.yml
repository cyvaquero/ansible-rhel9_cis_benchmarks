---
# 5.3.2.4 - pam_pwhistory is on a requisite or required password line of system-auth and password-auth. On an
# authselect-managed profile without the with-pwhistory feature the role enables it; 5.3.2.1 already
# selects it when it converts the host. A profile that has the feature but no lines is a finding.
# The logic is in tasks/lib/pam_setting.yml.

- name: "5.3.2.4 - Ensure pam_pwhistory module is enabled"
  ansible.builtin.import_tasks: ../../lib/pam_setting.yml
  vars:
    cis_ps_id: "5.3.2.4"
    cis_ps_conf: []
    cis_ps_header: ''
    cis_ps_tmpl: []
    cis_ps_feature: 'with-pwhistory'
  tags:
    - "5.3.2.4"
    - section-5
    - level-1
    - server
    - workstation
...
