---
# 5.3.3.2.5 - maxsequence is from 1 to 3 in the pwquality configuration (the role's drop-in gets
# cis_pwquality_maxsequence, 3 by default, when it is not); a maxsequence= argument on a
# pam_pwquality line outside that range overrides the files and is removed from the templates of
# the role's own profile.
# The logic is in tasks/lib/pam_setting.yml.

- name: "5.3.3.2.5 - Ensure password maximum sequential characters is configured"
  ansible.builtin.import_tasks: ../../lib/pam_setting.yml
  vars:
    cis_ps_id: "5.3.3.2.5"
    cis_ps_conf:
      - path: '{{ cis_pwquality_dropin }}'
        regexp: '^\s*maxsequence\s*='
        line: 'maxsequence = {{ cis_pwquality_maxsequence }}'
    cis_ps_header: '{{ cis_pwquality_dropin }}'
    cis_ps_tmpl:
      - re: '(^[ \t]*[a-z]+[ \t]+[^\n#]*?\bpam_pwquality\.so\b[^\n#]*?)[ \t]+maxsequence=\S*'
        to: '\1'
    cis_ps_feature: ''
  tags:
    - "5.3.3.2.5"
    - section-5
    - level-1
    - server
    - workstation
...
