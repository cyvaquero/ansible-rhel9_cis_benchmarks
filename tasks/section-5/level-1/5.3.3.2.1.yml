---
# 5.3.3.2.1 - difok is at least 2 in the pwquality configuration (the role's drop-in gets
# cis_pwquality_difok, 2 by default, when it is not); a difok= argument on a pam_pwquality line
# below 2 overrides the files and is removed from the templates of the role's own profile.
# The logic is in tasks/lib/pam_setting.yml.

- name: "5.3.3.2.1 - Ensure password number of changed characters is configured"
  ansible.builtin.import_tasks: ../../lib/pam_setting.yml
  vars:
    cis_ps_id: "5.3.3.2.1"
    cis_ps_conf:
      - path: '{{ cis_pwquality_dropin }}'
        regexp: '^\s*difok\s*='
        line: 'difok = {{ cis_pwquality_difok }}'
    cis_ps_header: '{{ cis_pwquality_dropin }}'
    cis_ps_tmpl:
      - re: '(^[ \t]*[a-z]+[ \t]+[^\n#]*?\bpam_pwquality\.so\b[^\n#]*?)[ \t]+difok=\S*'
        to: '\1'
    cis_ps_feature: ''
  tags:
    - "5.3.3.2.1"
    - section-5
    - level-1
    - server
    - workstation
...
