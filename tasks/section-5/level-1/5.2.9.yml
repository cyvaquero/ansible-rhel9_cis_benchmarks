---
# 5.2.9 - sudo refuses to prompt where the password would show: visiblepw is not enabled by
# an effective global line (no line is the default and passes), and no scoped line enables it.
# A non-compliant line is overridden with `Defaults !visiblepw` in the role file. The logic is
# shared in tasks/lib/sudo_default.yml.

- name: "5.2.9 - Ensure sudo visiblepw is configured"
  ansible.builtin.import_tasks: ../../lib/sudo_default.yml
  vars:
    cis_sdo_id: "5.2.9"
    cis_sdo_option: "visiblepw"
    cis_sdo_line: '!visiblepw'
  tags:
    - "5.2.9"
    - section-5
    - level-1
    - server
...
