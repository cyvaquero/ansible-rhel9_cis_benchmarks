---
# 5.3.3.2.6 - dictcheck is not 0 in the pwquality configuration (unset is compliant; when the value in
# effect is 0 the role's drop-in sets dictcheck = 1); a dictcheck=0 argument on a pam_pwquality line
# overrides the files and is removed from the templates of the role's own profile.
# The logic is in tasks/lib/pam_setting.yml.

- name: "5.3.3.2.6 - Ensure password dictionary check is enabled"
  ansible.builtin.import_tasks: ../../lib/pam_setting.yml
  vars:
    cis_ps_id: "5.3.3.2.6"
    cis_ps_conf:
      - path: '{{ cis_pwquality_dropin }}'
        regexp: '^\s*dictcheck\s*='
        line: 'dictcheck = 1'
    cis_ps_header: '{{ cis_pwquality_dropin }}'
    cis_ps_tmpl:
      - re: '(^[ \t]*[a-z]+[ \t]+[^\n#]*?\bpam_pwquality\.so\b[^\n#]*?)[ \t]+dictcheck=\S*'
        to: '\1'
    cis_ps_feature: ''
  tags:
    - "5.3.3.2.6"
    - section-5
    - level-1
    - server
    - workstation
...
