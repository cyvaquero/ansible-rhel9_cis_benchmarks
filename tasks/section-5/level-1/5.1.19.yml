---
# 5.1.19 - MaxSessions is from 1 to 10. The fix writes cis_sshd_max_sessions.
# The logic is shared in tasks/lib/sshd_option.yml.

- name: "5.1.19 - Ensure sshd MaxSessions is configured"
  ansible.builtin.import_tasks: ../../lib/sshd_option.yml
  vars:
    cis_sd_id: "5.1.19"
    cis_sd_options:
      - spec: "maxsessions|num|{{ cis_expect_sshd_max_sessions_max }}|{{ cis_sshd_max_sessions }}"
        directive: "MaxSessions"
        value: "{{ cis_sshd_max_sessions }}"
  tags:
    - "5.1.19"
    - section-5
    - level-1
    - server
    - workstation
...
