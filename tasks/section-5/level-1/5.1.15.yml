---
# 5.1.15 - LoginGraceTime is from 1 to 60 seconds (0 means no limit and fails). The fix writes
# cis_sshd_login_grace_time.
# The logic is shared in tasks/lib/sshd_option.yml.

- name: "5.1.15 - Ensure sshd LoginGraceTime is configured"
  ansible.builtin.import_tasks: ../../lib/sshd_option.yml
  vars:
    cis_sd_id: "5.1.15"
    cis_sd_options:
      - spec: "logingracetime|num|{{ cis_expect_sshd_login_grace_time_max }}|{{ cis_sshd_login_grace_time }}"
        directive: "LoginGraceTime"
        value: "{{ cis_sshd_login_grace_time }}"
  tags:
    - "5.1.15"
    - section-5
    - level-1
    - server
    - workstation
...
