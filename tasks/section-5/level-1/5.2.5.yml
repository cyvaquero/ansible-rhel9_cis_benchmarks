---
# 5.2.5 - sudo writes its own log file: an effective global `Defaults logfile=` with a path.
# A path the site already set is kept; otherwise cis_sudo_logfile is written. The logic is
# shared in tasks/lib/sudo_default.yml.

- name: "5.2.5 - Ensure sudo log file exists"
  ansible.builtin.import_tasks: ../../lib/sudo_default.yml
  vars:
    cis_sdo_id: "5.2.5"
    cis_sdo_option: "logfile"
    cis_sdo_line: 'logfile="{{ cis_sudo_logfile }}"'
  tags:
    - "5.2.5"
    - section-5
    - level-1
    - server
    - workstation
...
