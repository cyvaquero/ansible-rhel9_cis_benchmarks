---
# 5.1.9 - sshd shows a banner file before login. The path is /etc/issue.net, whose text 1.7.3
# manages; the check also fails when that file has a login escape or the OS name.
# The logic is shared in tasks/lib/sshd_option.yml.

- name: "5.1.9 - Ensure sshd Banner is configured"
  ansible.builtin.import_tasks: ../../lib/sshd_option.yml
  vars:
    cis_sd_id: "5.1.9"
    cis_sd_options:
      - spec: "banner|banner|"
        directive: "Banner"
        value: "/etc/issue.net"
  tags:
    - "5.1.9"
    - section-5
    - level-1
    - server
    - workstation
...
