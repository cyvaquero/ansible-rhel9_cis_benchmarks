---
# 5.3.3.2.2 - minlen is at least 14 in the pwquality configuration (the role's drop-in gets
# cis_pwquality_minlen, 14 by default, when it is not); a minlen= argument on a pam_pwquality line
# below 14 overrides the files and is removed from the templates of the role's own profile.
# The logic is in tasks/lib/pam_setting.yml.

- name: "5.3.3.2.2 - Ensure password length is configured"
  ansible.builtin.import_tasks: ../../lib/pam_setting.yml
  vars:
    cis_ps_id: "5.3.3.2.2"
    cis_ps_conf:
      - path: '{{ cis_pwquality_dropin }}'
        regexp: '^\s*minlen\s*='
        line: 'minlen = {{ cis_pwquality_minlen }}'
    cis_ps_header: '{{ cis_pwquality_dropin }}'
    cis_ps_tmpl:
      - re: '(^[ \t]*[a-z]+[ \t]+[^\n#]*?\bpam_pwquality\.so\b[^\n#]*?)[ \t]+minlen=\S*'
        to: '\1'
    cis_ps_feature: ''
  tags:
    - "5.3.3.2.2"
    - section-5
    - level-1
    - server
    - workstation
...
