---
# 5.3.3.1.1 - deny is set in /etc/security/faillock.conf (the benchmark: from 1 to 5). The fix makes it
# exactly cis_faillock_deny, also when the file holds another compliant value; a deny= argument on a
# pam_faillock line that differs from it overrides the file and is removed from the templates of
# the role's own authselect profile.
# The logic is in tasks/lib/pam_setting.yml.

- name: "5.3.3.1.1 - Ensure password failed attempts lockout is configured"
  ansible.builtin.import_tasks: ../../lib/pam_setting.yml
  vars:
    cis_ps_id: "5.3.3.1.1"
    cis_ps_conf:
      - path: /etc/security/faillock.conf
        regexp: '^\s*deny\s*='
        line: 'deny = {{ cis_faillock_deny }}'
    cis_ps_header: ''
    cis_ps_tmpl:
      - re: '(^[ \t]*[a-z]+[ \t]+[^\n#]*?\bpam_faillock\.so\b[^\n#]*?)[ \t]+deny=\S*'
        to: '\1'
    cis_ps_feature: ''
  tags:
    - "5.3.3.1.1"
    - section-5
    - level-1
    - server
    - workstation
...
