---
# 5.1.22 - PermitUserEnvironment is no.
# The logic is shared in tasks/lib/sshd_option.yml.

- name: "5.1.22 - Ensure sshd PermitUserEnvironment is disabled"
  ansible.builtin.import_tasks: ../../lib/sshd_option.yml
  vars:
    cis_sd_id: "5.1.22"
    cis_sd_options:
      - spec: "permituserenvironment|eq|{{ cis_expect_sshd_permit_user_environment }}|{{ 'yes' if cis_sshd_permit_user_environment | bool else 'no' }}"
        directive: "PermitUserEnvironment"
        value: "{{ 'yes' if cis_sshd_permit_user_environment | bool else 'no' }}"
  tags:
    - "5.1.22"
    - section-5
    - level-1
    - server
    - workstation
...
