---
# 5.1.6 - sshd must not offer a SHA-1 key exchange (the constant cis_expect_sshd_weak_kex). Fixed
# through the crypto policy with the shipped module of 1.6.2 (cis_crypto_policy_module_sha1), which
# the policy holds exactly as configured, as 1.6.2 does.

- name: "5.1.6 - Ensure sshd KexAlgorithms is configured"
  ansible.builtin.import_tasks: ../../lib/sshd_crypto.yml
  vars:
    cis_sc_id: "5.1.6"
    cis_sc_key: "kexalgorithms"
    cis_sc_weak: "{{ cis_expect_sshd_weak_kex }}"
    cis_sc_kind: "sha1"
    cis_sc_enforce: true
    cis_sc_module: "{{ cis_crypto_policy_module_sha1 }}"
  tags:
    - "5.1.6"
    - section-5
    - level-1
    - server
    - workstation
...
