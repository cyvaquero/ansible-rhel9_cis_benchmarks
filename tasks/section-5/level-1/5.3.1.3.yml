---
# 5.3.1.3 - libpwquality is installed at version-release 1.4.4-8 or later, the minimum the benchmark
# names (cis_expect_libpwquality_min_version); a newer one is left alone. The fix follows
# cis_libpwquality_installed: true installs or upgrades it with dnf, false removes it when no other
# installed package needs it (one that is needed stays and is reported). A site that sets false
# gets a finding on every run. The logic is in tasks/lib/package_min_version.yml.

- name: "5.3.1.3 - Ensure latest version of libpwquality is installed"
  ansible.builtin.import_tasks: ../../lib/package_min_version.yml
  vars:
    cis_pm_id: "5.3.1.3"
    cis_pm_package: libpwquality
    cis_pm_min: "{{ cis_expect_libpwquality_min_version }}"
    cis_pm_want: "{{ cis_libpwquality_installed | bool }}"
  tags:
    - "5.3.1.3"
    - section-5
    - level-1
    - server
    - workstation
...
