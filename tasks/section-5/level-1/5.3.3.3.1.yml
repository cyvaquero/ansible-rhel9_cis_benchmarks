---
# 5.3.3.3.1 - remember is at least 24 in /etc/security/pwhistory.conf (the role writes cis_pwhistory_remember, 24 by
# default, when it is not); a remember= argument on a pam_pwhistory line below 24 overrides the
# file and is removed from the templates of the role's own authselect profile.
# The logic is in tasks/lib/pam_setting.yml.

- name: "5.3.3.3.1 - Ensure password history remember is configured"
  ansible.builtin.import_tasks: ../../lib/pam_setting.yml
  vars:
    cis_ps_id: "5.3.3.3.1"
    cis_ps_conf:
      - path: /etc/security/pwhistory.conf
        regexp: '^\s*remember\s*='
        line: 'remember = {{ cis_pwhistory_remember }}'
    cis_ps_header: ''
    cis_ps_tmpl:
      - re: '(^[ \t]*[a-z]+[ \t]+[^\n#]*?\bpam_pwhistory\.so\b[^\n#]*?)[ \t]+remember=\S*'
        to: '\1'
    cis_ps_feature: ''
  tags:
    - "5.3.3.3.1"
    - section-5
    - level-1
    - server
    - workstation
...
