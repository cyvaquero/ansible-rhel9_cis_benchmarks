---
# 5.2.4 - sudo runs commands in a pseudo terminal: an effective global `Defaults use_pty` and no
# `!use_pty` that wins (the benchmark). The fix makes the effective value exactly cis_sudo_use_pty
# (a missing line counts as off). The logic is shared in tasks/lib/sudo_default.yml.

- name: "5.2.4 - Ensure sudo commands use pty"
  ansible.builtin.import_tasks: ../../lib/sudo_default.yml
  vars:
    cis_sdo_id: "5.2.4"
    cis_sdo_option: "use_pty"
    cis_sdo_line: "{{ 'use_pty' if cis_sudo_use_pty | bool else '!use_pty' }}"
    cis_sdo_cfg:
      want: "{{ cis_sudo_use_pty | bool }}"
      expect: {use_pty: "{{ cis_expect_sudo_use_pty | bool }}"}
  tags:
    - "5.2.4"
    - section-5
    - level-1
    - server
    - workstation
...
