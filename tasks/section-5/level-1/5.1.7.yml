---
# 5.1.7 - sshd must not offer a weak MAC (the constant cis_expect_sshd_weak_macs). Fixed through the
# crypto policy with the role's own module, the same one 1.6.3 adds (the module name and the
# excluded patterns are the variables of 1.6.3; keep the two module texts identical). The policy
# holds the module exactly as configured, as 1.6.3 does.
# hmac-sha1 itself is not weak under this control; 1.6.6 (manual) covers EtM.

- name: "5.1.7 - Ensure sshd MACs are configured"
  ansible.builtin.import_tasks: ../../lib/sshd_crypto.yml
  vars:
    cis_sc_id: "5.1.7"
    cis_sc_key: "macs"
    cis_sc_weak: "{{ cis_expect_sshd_weak_macs }}"
    cis_sc_kind: "mac"
    cis_sc_enforce: true
    cis_sc_module: "{{ cis_crypto_policy_module_mac }}"
    cis_sc_body: |
      # Added by the CIS RHEL 9 role: drop 64-bit tag and MD5 MACs.
      mac = {{ cis_crypto_policy_mac_excluded | map('regex_replace', '^', '-') | join(' ') }}
  tags:
    - "5.1.7"
    - section-5
    - level-1
    - server
    - workstation
...
