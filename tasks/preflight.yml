---
# Stop early on anything that is not RHEL 9, and record the minor release so later tasks
# can branch on it where a control differs between minor releases.

- name: "Preflight - Verify the host is RHEL 9"
  ansible.builtin.assert:
    that:
      - ansible_distribution == cis_supported_distribution
      - ansible_distribution_major_version | string == cis_supported_major_version
    fail_msg: >-
      rhel9_cis_benchmarks supports Red Hat Enterprise Linux {{ cis_supported_major_version }}
      only. This host reports distribution
      '{{ ansible_distribution | default("unknown") }}' version
      '{{ ansible_distribution_version | default("unknown") }}'.
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Report the benchmark version"
  ansible.builtin.debug:
    msg: "{{ cis_benchmark.title }} v{{ cis_benchmark.version }} ({{ cis_benchmark.date }})"
  tags:
    - always
    - preflight

- name: "Preflight - Record the RHEL 9 minor release"
  ansible.builtin.set_fact:
    # A string, for example "4" on RHEL 9.4 ("0" when the version has no minor part).
    # Compare with the int filter, for example: cis_rhel_minor_release | int >= 4
    cis_rhel_minor_release: "{{ (ansible_distribution_version.split('.') + ['0'])[1] }}"
  tags:
    - always
    - preflight

- name: "Preflight - Load the control level map"
  ansible.builtin.include_vars:
    file: controls.yml
  tags:
    - always
    - preflight

- name: "Preflight - Validate cis_profile"
  ansible.builtin.assert:
    that:
      - cis_profile in cis_valid_profiles
    fail_msg: >-
      cis_profile must be one of {{ cis_valid_profiles | join(', ') }}
      (got '{{ cis_profile }}').
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate cis_apply_level_2"
  ansible.builtin.assert:
    that:
      # Accepts a real boolean, or the strings true/false that -e key=value produces.
      - cis_apply_level_2 is boolean or (cis_apply_level_2 | string | lower) in ['true', 'false']
    fail_msg: "cis_apply_level_2 must be true or false (got '{{ cis_apply_level_2 }}')."
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate cis_audit_only and cis_fail_on_findings"
  ansible.builtin.assert:
    that:
      - item.value is boolean or (item.value | string | lower) in ['true', 'false']
    fail_msg: "{{ item.key }} must be true or false (got '{{ item.value }}')."
    quiet: true
  loop:
    - key: cis_audit_only
      value: "{{ cis_audit_only }}"
    - key: cis_fail_on_findings
      value: "{{ cis_fail_on_findings }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the exclusion list types"
  ansible.builtin.assert:
    that:
      - cis_exclusions is sequence and cis_exclusions is not string
      - cis_default_exclusions is sequence and cis_default_exclusions is not string
    fail_msg: "cis_exclusions and cis_default_exclusions must be lists of CIS IDs."
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate the exclusion lists"
  ansible.builtin.assert:
    that:
      - cis_unknown_exclusions | length == 0
    fail_msg: >-
      Unknown CIS IDs in cis_exclusions or cis_default_exclusions:
      {{ cis_unknown_exclusions | join(', ') }}. Use IDs listed in docs/controls.md,
      for example '1.1.1.1'.
    quiet: true
  vars:
    cis_unknown_exclusions: >-
      {{ (cis_default_exclusions + cis_exclusions) | map('string')
         | reject('in', cis_control_levels) | list }}
  tags:
    - always
    - preflight

- name: "Preflight - Validate the cron and at allow-user lists"
  ansible.builtin.assert:
    that:
      - item.value is sequence and item.value is not string and item.value is not mapping
      - cis_rejected_users | length == 0
    fail_msg: >-
      {{ item.key }} must be a list of plain login names (letters, digits, underscore, dot
      and hyphen, not starting with a digit or hyphen){{
      (' - rejected items: ' ~ (cis_rejected_users | map('to_json') | join(', ')))
      if cis_rejected_users | length > 0 else '' }}.
    quiet: true
  vars:
    # Items that are not strings, then strings that are not login names, so nothing is
    # dropped without a message later (tasks/lib/job_allow.yml).
    cis_rejected_users: >-
      {{ ((item.value | reject('string') | list)
          + (item.value | select('string') | reject('regex', '^[A-Za-z_][A-Za-z0-9_.-]*$', match_type='fullmatch') | list))
         if (item.value is sequence and item.value is not string and item.value is not mapping)
         else [] }}
  loop:
    - key: cis_cron_allow_users
      value: "{{ cis_cron_allow_users }}"
    - key: cis_at_allow_users
      value: "{{ cis_at_allow_users }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the firewalld zone target"
  ansible.builtin.assert:
    that:
      - cis_firewalld_zone_target in ['default', 'REJECT', 'DROP']
    fail_msg: >-
      cis_firewalld_zone_target must be one of default, REJECT or DROP (ACCEPT is what 4.1.4
      replaces). Got {{ cis_firewalld_zone_target | to_json }}.
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate the firewalld denied packet logging value"
  ansible.builtin.assert:
    that:
      - cis_firewalld_log_denied in ['all', 'unicast', 'broadcast', 'multicast']
    fail_msg: >-
      cis_firewalld_log_denied must be one of all, unicast, broadcast or multicast (off is
      what 4.1.10 replaces). Got {{ cis_firewalld_log_denied | to_json }}.
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate the SSH server access lists"
  ansible.builtin.assert:
    that:
      - item.value is sequence and item.value is not string and item.value is not mapping
      - cis_rejected_names | length == 0
    fail_msg: >-
      {{ item.key }} must be a list of plain user or group names (letters, digits, underscore,
      dot and hyphen, not starting with a digit or hyphen){{
      (' - rejected items: ' ~ (cis_rejected_names | map('to_json') | join(', ')))
      if cis_rejected_names | length > 0 else '' }}.
    quiet: true
  vars:
    cis_rejected_names: >-
      {{ ((item.value | reject('string') | list)
          + (item.value | select('string') | reject('regex', '^[A-Za-z_][A-Za-z0-9_.-]*$', match_type='fullmatch') | list))
         if (item.value is sequence and item.value is not string and item.value is not mapping)
         else [] }}
  loop:
    - key: cis_sshd_allow_users
      value: "{{ cis_sshd_allow_users }}"
    - key: cis_sshd_allow_groups
      value: "{{ cis_sshd_allow_groups }}"
    - key: cis_sshd_deny_users
      value: "{{ cis_sshd_deny_users }}"
    - key: cis_sshd_deny_groups
      value: "{{ cis_sshd_deny_groups }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the SSH server limits"
  ansible.builtin.assert:
    that:
      - item.value | string is match('^[0-9]+$')
      - item.value | int >= 1
      - item.max == 0 or item.value | int <= item.max
    fail_msg: >-
      {{ item.key }} must be a whole number from 1{{ (' to ' ~ item.max) if item.max > 0 else ' up' }}
      (got {{ item.value | to_json }}).
    quiet: true
  loop:
    - {key: cis_sshd_client_alive_interval, value: "{{ cis_sshd_client_alive_interval }}", max: 0}
    - {key: cis_sshd_client_alive_count_max, value: "{{ cis_sshd_client_alive_count_max }}", max: 0}
    - {key: cis_sshd_login_grace_time, value: "{{ cis_sshd_login_grace_time }}", max: 60}
    - {key: cis_sshd_max_auth_tries, value: "{{ cis_sshd_max_auth_tries }}", max: 4}
    - {key: cis_sshd_max_sessions, value: "{{ cis_sshd_max_sessions }}", max: 10}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the SSH server log level and MaxStartups"
  ansible.builtin.assert:
    that:
      - cis_sshd_log_level in ['INFO', 'VERBOSE']
      - cis_sshd_max_startups | string is match('^[0-9]+:[0-9]+:[0-9]+$')
      - cis_sshd_startups_parts | map('int') | min >= 1
      - cis_sshd_startups_parts[0] | int <= 10
      - cis_sshd_startups_parts[1] | int <= 30
      - cis_sshd_startups_parts[2] | int <= 60
    fail_msg: >-
      cis_sshd_log_level must be INFO or VERBOSE (got {{ cis_sshd_log_level | to_json }}) and
      cis_sshd_max_startups three whole numbers start:rate:full of at least 1 and at most
      10:30:60 (got {{ cis_sshd_max_startups | to_json }}).
    quiet: true
  vars:
    cis_sshd_startups_parts: "{{ (cis_sshd_max_startups | string).split(':') }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the sudo and su settings"
  ansible.builtin.assert:
    that:
      - cis_sudo_logfile is string
      - cis_sudo_logfile is match('^/[A-Za-z0-9_./-]+$')
      - "'..' not in cis_sudo_logfile"
      - not cis_sudo_logfile.endswith('/')
      - cis_sudo_timestamp_timeout | string is match('^[0-9]+$')
      - cis_sudo_timestamp_timeout | int >= 1
      - cis_sudo_timestamp_timeout | int <= 15
      - cis_su_group is string
      - cis_su_group is match('^[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: >-
      cis_sudo_logfile must be an absolute file path of letters, digits, underscore, dot,
      hyphen and slash (got {{ cis_sudo_logfile | to_json }}), cis_sudo_timestamp_timeout a
      whole number from 1 to 15 (got {{ cis_sudo_timestamp_timeout | to_json }}) and
      cis_su_group a plain group name of lowercase letters, digits, underscore and hyphen
      (got {{ cis_su_group | to_json }}).
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Compute the selected controls"
  ansible.builtin.set_fact:
    # The single list every control task or include tests with
    #   when: "'<cis-id>' in cis_selected_controls"
    # It is computed once here, from the level map, the profile, the level switch and the
    # exclusions, so no task repeats that logic and 352 controls cost one template
    # evaluation instead of 352. The Jinja loop is used because ansible-core 2.15's
    # stock filters cannot compare a nested level against a threshold; to_json plus
    # from_json guarantees a real list on every version.
    cis_selected_controls: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- set max_level = 2 if (cis_apply_level_2 | bool) else 1 -%}
      {%- set excluded = (cis_default_exclusions + cis_exclusions) | map('string') | list -%}
      {%- for id, levels in cis_control_levels.items() -%}
      {%- set lvl = levels[cis_profile] -%}
      {%- if lvl is not none and lvl <= max_level and id not in excluded -%}
      {%- set ns.ids = ns.ids + [id] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ids | to_json }}
  tags:
    - always
    - preflight

- name: "Preflight - Normalize the selected controls to a list"
  ansible.builtin.set_fact:
    cis_selected_controls: "{{ cis_selected_controls | from_json if cis_selected_controls is string else cis_selected_controls }}"
  tags:
    - always
    - preflight

# Once for every section: package controls read ansible_facts.packages. A control that
# installs or removes a package reads the facts again to confirm the result. The module
# supports --check, so --check sees the same packages.
- name: "Preflight - Gather the installed packages"
  ansible.builtin.package_facts:
    manager: rpm
  tags:
    - always
    - preflight

# IPv6 is treated as disabled when the ipv6 module parameter is missing or not 0, or when
# both the all and default disable_ipv6 sysctls are 1. The 3.3.2 controls are skipped then.
- name: "Preflight - Read the IPv6 disable settings"
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -c
      - |
        for f in /sys/module/ipv6/parameters/disable /proc/sys/net/ipv6/conf/all/disable_ipv6 /proc/sys/net/ipv6/conf/default/disable_ipv6; do
          printf '%s=%s\n' "$f" "$(tr -d ' \t\r\n' < "$f" 2>/dev/null)"
        done
  register: cis_ipv6_read
  changed_when: false
  check_mode: false
  failed_when: false
  tags:
    - always
    - preflight

- name: "Preflight - Work out whether IPv6 is disabled"
  ansible.builtin.set_fact:
    cis_ipv6_disabled: >-
      {{ (cis_ipv6_read.stdout_lines | default([]) | select('match', '^/sys/module/ipv6/parameters/disable=0$') | list | length == 0)
      or (cis_ipv6_read.stdout_lines | default([]) | select('match', '^/proc/sys/net/ipv6/conf/(all|default)/disable_ipv6=1$') | list | length == 2) }}
  tags:
    - always
    - preflight
...
