---
# Stop early on anything that is not RHEL 9, and record the minor release so later tasks
# can branch on it where a control differs between minor releases.

- name: "Preflight - Verify the host is RHEL 9"
  ansible.builtin.assert:
    that:
      - ansible_distribution == cis_supported_distribution
      - ansible_distribution_major_version | string == cis_supported_major_version
    fail_msg: >-
      rhel9_cis_benchmarks supports Red Hat Enterprise Linux {{ cis_supported_major_version }}
      only. This host reports distribution
      '{{ ansible_distribution | default("unknown") }}' version
      '{{ ansible_distribution_version | default("unknown") }}'.
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Report the benchmark version"
  ansible.builtin.debug:
    msg: "{{ cis_benchmark.title }} v{{ cis_benchmark.version }} ({{ cis_benchmark.date }})"
  tags:
    - always
    - preflight

- name: "Preflight - Record the RHEL 9 minor release"
  ansible.builtin.set_fact:
    # A string, for example "4" on RHEL 9.4 ("0" when the version has no minor part).
    # Compare with the int filter, for example: cis_rhel_minor_release | int >= 4
    cis_rhel_minor_release: "{{ (ansible_distribution_version.split('.') + ['0'])[1] }}"
  tags:
    - always
    - preflight

- name: "Preflight - Load the control level map"
  ansible.builtin.include_vars:
    file: controls.yml
  tags:
    - always
    - preflight

- name: "Preflight - Validate cis_profile"
  ansible.builtin.assert:
    that:
      - cis_profile in cis_valid_profiles
    fail_msg: >-
      cis_profile must be one of {{ cis_valid_profiles | join(', ') }}
      (got '{{ cis_profile }}').
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate cis_apply_level_2"
  ansible.builtin.assert:
    that:
      # Accepts a real boolean, or the strings true/false that -e key=value produces.
      - cis_apply_level_2 is boolean or (cis_apply_level_2 | string | lower) in ['true', 'false']
    fail_msg: "cis_apply_level_2 must be true or false (got '{{ cis_apply_level_2 }}')."
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate cis_audit_only and cis_fail_on_findings"
  ansible.builtin.assert:
    that:
      - item.value is boolean or (item.value | string | lower) in ['true', 'false']
    fail_msg: "{{ item.key }} must be true or false (got '{{ item.value }}')."
    quiet: true
  loop:
    - key: cis_audit_only
      value: "{{ cis_audit_only }}"
    - key: cis_fail_on_findings
      value: "{{ cis_fail_on_findings }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the exclusion list types"
  ansible.builtin.assert:
    that:
      - cis_exclusions is sequence and cis_exclusions is not string
      - cis_default_exclusions is sequence and cis_default_exclusions is not string
    fail_msg: "cis_exclusions and cis_default_exclusions must be lists of CIS IDs."
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate the exclusion lists"
  ansible.builtin.assert:
    that:
      - cis_unknown_exclusions | length == 0
    fail_msg: >-
      Unknown CIS IDs in cis_exclusions or cis_default_exclusions:
      {{ cis_unknown_exclusions | join(', ') }}. Use IDs listed in docs/controls.md,
      for example '1.1.1.1'.
    quiet: true
  vars:
    cis_unknown_exclusions: >-
      {{ (cis_default_exclusions + cis_exclusions) | map('string')
         | reject('in', cis_control_levels) | list }}
  tags:
    - always
    - preflight

- name: "Preflight - Validate the cron and at allow-user lists"
  ansible.builtin.assert:
    that:
      - item.value is sequence and item.value is not string and item.value is not mapping
      - cis_rejected_users | length == 0
    fail_msg: >-
      {{ item.key }} must be a list of plain login names (letters, digits, underscore, dot
      and hyphen, not starting with a digit or hyphen){{
      (' - rejected items: ' ~ (cis_rejected_users | map('to_json') | join(', ')))
      if cis_rejected_users | length > 0 else '' }}.
    quiet: true
  vars:
    # Items that are not strings, then strings that are not login names, so nothing is
    # dropped without a message later (tasks/lib/job_allow.yml).
    cis_rejected_users: >-
      {{ ((item.value | reject('string') | list)
          + (item.value | select('string') | reject('regex', '^[A-Za-z_][A-Za-z0-9_.-]*$', match_type='fullmatch') | list))
         if (item.value is sequence and item.value is not string and item.value is not mapping)
         else [] }}
  loop:
    - key: cis_cron_allow_users
      value: "{{ cis_cron_allow_users }}"
    - key: cis_at_allow_users
      value: "{{ cis_at_allow_users }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

# Section 2 override variables (defaults/main.yml). Only the type and format are checked, never
# the benchmark bounds (see README, "Overriding values").
- name: "Preflight - Validate the section 2 yes/no values"
  ansible.builtin.assert:
    that:
      - vars[item] is boolean or (vars[item] | string | lower) in ['true', 'false']
    fail_msg: "{{ item }} must be true or false (got {{ vars[item] | to_json }})."
    quiet: true
  loop:
    - cis_autofs_installed
    - cis_avahi_installed
    - cis_cockpit_installed
    - cis_cockpit_ws_installed
    - cis_dhcp_server_installed
    - cis_bind_installed
    - cis_dnsmasq_installed
    - cis_samba_installed
    - cis_vsftpd_installed
    - cis_dovecot_installed
    - cis_cyrus_imapd_installed
    - cis_nfs_utils_installed
    - cis_cups_installed
    - cis_rpcbind_installed
    - cis_rsync_daemon_installed
    - cis_net_snmp_installed
    - cis_telnet_server_installed
    - cis_tftp_server_installed
    - cis_squid_installed
    - cis_httpd_installed
    - cis_nginx_installed
    - cis_x_server_installed
    - cis_xwayland_installed
    - cis_ftp_client_installed
    - cis_ldap_client_installed
    - cis_telnet_client_installed
    - cis_tftp_client_installed
    - cis_gui_installed
    - cis_chrony_installed
    - cis_chronyd_run_as_root
    - cis_crond_enabled
    - cis_crond_active
  tags:
    - always
    - preflight

- name: "Preflight - Validate the optional package variables"
  ansible.builtin.assert:
    that:
      - vars[item] is none or vars[item] is boolean or (vars[item] | string | lower) in ['true', 'false']
    fail_msg: "{{ item }} must be true, false or null (got {{ vars[item] | to_json }})."
    quiet: true
  loop:
    - cis_cronie_installed
    - cis_at_installed
  tags:
    - always
    - preflight

- name: "Preflight - Validate the section 2 file modes"
  ansible.builtin.assert:
    that:
      - vars[item] is string
      - vars[item] is match('^0?[0-7]{3,4}$')
    fail_msg: >-
      {{ item }} must be a quoted string of three or four octal digits, for example "0640"
      (got {{ vars[item] | to_json }}).
    quiet: true
  loop:
    - cis_cron_file_mode
    - cis_cron_dir_mode
    - cis_cron_allow_mode
    - cis_at_allow_mode
  tags:
    - always
    - preflight

- name: "Preflight - Validate the section 2 names and values"
  ansible.builtin.assert:
    that:
      - vars[item.key] is string
      - (vars[item.key] | lower) is match(item.pattern)
    fail_msg: "{{ item.key }} must be {{ item.what }} (got {{ vars[item.key] | to_json }})."
    quiet: true
  loop:
    - {key: cis_cron_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_cron_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_cron_allow_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_cron_allow_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_at_allow_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_at_allow_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_default_target, pattern: '^[a-z0-9_@:.-]+[.]target$', what: a systemd target name ending in .target}
    - {key: cis_postfix_inet_interfaces, pattern: '^[a-z0-9_.:\[\], -]*[a-z0-9_.:\[\]-]$', what: loopback-only or a comma separated list of interfaces}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

# Section 3 override variables (defaults/main.yml). Only the type and format are checked, never
# the benchmark bounds (see README, "Overriding values").
- name: "Preflight - Validate the section 3 yes/no values"
  ansible.builtin.assert:
    that:
      - vars[item] is boolean or (vars[item] | string | lower) in ['true', 'false']
    fail_msg: "{{ item }} must be true or false (got {{ vars[item] | to_json }})."
    quiet: true
  loop:
    - cis_module_wireless_blocked
    - cis_bluez_installed
    - cis_module_dccp_blocked
    - cis_module_tipc_blocked
    - cis_module_rds_blocked
    - cis_module_sctp_blocked
    - cis_module_atm_blocked
    - cis_module_can_blocked
  tags:
    - always
    - preflight

- name: "Preflight - Validate the section 3 whole numbers"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item) is not boolean
      - lookup('ansible.builtin.vars', item) | string is match('^[0-9]+$')
    fail_msg: "{{ item }} must be a whole number of 0 or more (got {{ lookup('ansible.builtin.vars', item) | to_json }})."
    quiet: true
  loop:
    - cis_sysctl_net_ipv4_ip_forward
    - cis_sysctl_net_ipv4_conf_all_forwarding
    - cis_sysctl_net_ipv4_conf_default_forwarding
    - cis_sysctl_net_ipv4_conf_all_send_redirects
    - cis_sysctl_net_ipv4_conf_default_send_redirects
    - cis_sysctl_net_ipv4_icmp_ignore_bogus_error_responses
    - cis_sysctl_net_ipv4_icmp_echo_ignore_broadcasts
    - cis_sysctl_net_ipv4_conf_all_accept_redirects
    - cis_sysctl_net_ipv4_conf_default_accept_redirects
    - cis_sysctl_net_ipv4_conf_all_secure_redirects
    - cis_sysctl_net_ipv4_conf_default_secure_redirects
    - cis_sysctl_net_ipv4_conf_all_rp_filter
    - cis_sysctl_net_ipv4_conf_default_rp_filter
    - cis_sysctl_net_ipv4_conf_all_accept_source_route
    - cis_sysctl_net_ipv4_conf_default_accept_source_route
    - cis_sysctl_net_ipv4_conf_all_log_martians
    - cis_sysctl_net_ipv4_conf_default_log_martians
    - cis_sysctl_net_ipv4_tcp_syncookies
    - cis_sysctl_net_ipv4_conf_all_route_localnet
    - cis_sysctl_net_ipv4_conf_default_route_localnet
    - cis_sysctl_net_ipv6_conf_all_forwarding
    - cis_sysctl_net_ipv6_conf_default_forwarding
    - cis_sysctl_net_ipv6_conf_all_accept_redirects
    - cis_sysctl_net_ipv6_conf_default_accept_redirects
    - cis_sysctl_net_ipv6_conf_all_accept_source_route
    - cis_sysctl_net_ipv6_conf_default_accept_source_route
    - cis_sysctl_net_ipv6_conf_all_accept_ra
    - cis_sysctl_net_ipv6_conf_default_accept_ra
  tags:
    - always
    - preflight

# net.ipv4.ip_forward and net.ipv4.conf.all.forwarding are one kernel setting under two names:
# setting either sets the other. Different values would make 3.3.1.1 and 3.3.1.2 undo each other
# on every run.
- name: "Preflight - Check that the two names of the IPv4 forwarding setting agree"
  ansible.builtin.assert:
    that:
      - (cis_sysctl_net_ipv4_ip_forward | string) == (cis_sysctl_net_ipv4_conf_all_forwarding | string)
    fail_msg: >-
      cis_sysctl_net_ipv4_ip_forward ({{ cis_sysctl_net_ipv4_ip_forward }}) and
      cis_sysctl_net_ipv4_conf_all_forwarding ({{ cis_sysctl_net_ipv4_conf_all_forwarding }}) set
      the same kernel setting and must be equal. cis_sysctl_net_ipv4_conf_all_forwarding follows
      cis_sysctl_net_ipv4_ip_forward unless it is set.
    quiet: true
  tags:
    - always
    - preflight

# Section 4 override variables (defaults/main.yml). Only the type and format are checked, never
# the benchmark bounds (see README, "Overriding values").
- name: "Preflight - Validate the section 4 yes/no values"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item) is boolean or (lookup('ansible.builtin.vars', item) | string | lower) in ['true', 'false']
    fail_msg: "{{ item }} must be true or false (got {{ lookup('ansible.builtin.vars', item) | to_json }})."
    quiet: true
  loop:
    - cis_firewalld_installed
    - cis_firewalld_enabled
    - cis_firewalld_active
    - cis_nftables_service_enabled
    - cis_nftables_service_active
    - cis_iptables_services_installed
    - cis_ufw_installed
    - cis_firewalld_icmp_timestamp_request_blocked
    - cis_firewalld_icmp_timestamp_reply_blocked
  tags:
    - always
    - preflight

- name: "Preflight - Validate the section 4 firewalld values"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item.key) is string
      - lookup('ansible.builtin.vars', item.key) in item.allowed
    fail_msg: >-
      {{ item.key }} must be one of {{ item.allowed | join(', ') }}, as a quoted string
      (got {{ lookup('ansible.builtin.vars', item.key) | to_json }}).
    quiet: true
  loop:
    - {key: cis_firewalld_backend, allowed: [nftables, iptables]}
    - {key: cis_firewalld_zone_target, allowed: [default, ACCEPT, REJECT, DROP]}
    - {key: cis_firewalld_log_denied, allowed: ['off', all, unicast, broadcast, multicast]}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the SSH server access lists"
  ansible.builtin.assert:
    that:
      - item.value is sequence and item.value is not string and item.value is not mapping
      - cis_rejected_names | length == 0
    fail_msg: >-
      {{ item.key }} must be a list of plain user or group names (letters, digits, underscore,
      dot and hyphen, not starting with a digit or hyphen){{
      (' - rejected items: ' ~ (cis_rejected_names | map('to_json') | join(', ')))
      if cis_rejected_names | length > 0 else '' }}.
    quiet: true
  vars:
    cis_rejected_names: >-
      {{ ((item.value | reject('string') | list)
          + (item.value | select('string') | reject('regex', '^[A-Za-z_][A-Za-z0-9_.-]*$', match_type='fullmatch') | list))
         if (item.value is sequence and item.value is not string and item.value is not mapping)
         else [] }}
  loop:
    - key: cis_sshd_allow_users
      value: "{{ cis_sshd_allow_users }}"
    - key: cis_sshd_allow_groups
      value: "{{ cis_sshd_allow_groups }}"
    - key: cis_sshd_deny_users
      value: "{{ cis_sshd_deny_users }}"
    - key: cis_sshd_deny_groups
      value: "{{ cis_sshd_deny_groups }}"
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

# Section 5 override variables (defaults/main.yml). Only the type and format are checked, never
# the benchmark bounds (see README, "Overriding values"): a value is refused only when sshd, sudo
# or the account tools would not accept it or when it would lock the role out (MaxSessions 0,
# a ClientAlive value of 0).
- name: "Preflight - Validate the SSH server limits"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item.key) is not boolean
      - lookup('ansible.builtin.vars', item.key) | string is match('^[0-9]+$')
      - lookup('ansible.builtin.vars', item.key) | int >= item.min
    fail_msg: >-
      {{ item.key }} must be a whole number of {{ item.min }} or more
      (got {{ lookup('ansible.builtin.vars', item.key) | to_json }}).
    quiet: true
  loop:
    - {key: cis_sshd_client_alive_interval, min: 1}
    - {key: cis_sshd_client_alive_count_max, min: 1}
    - {key: cis_sshd_login_grace_time, min: 0}
    - {key: cis_sshd_max_auth_tries, min: 1}
    - {key: cis_sshd_max_sessions, min: 1}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the SSH server log level, MaxStartups and PermitRootLogin"
  ansible.builtin.assert:
    that:
      - cis_sshd_log_level is string
      - cis_sshd_log_level in ['QUIET', 'FATAL', 'ERROR', 'INFO', 'VERBOSE', 'DEBUG', 'DEBUG1', 'DEBUG2', 'DEBUG3']
      - cis_sshd_max_startups | string is match('^[0-9]+:[0-9]+:[0-9]+$')
      - cis_sshd_startups_parts[0] | int >= 1
      - cis_sshd_startups_parts[1] | int >= 1
      - cis_sshd_startups_parts[1] | int <= 100
      - cis_sshd_startups_parts[2] | int >= cis_sshd_startups_parts[0] | int
      - cis_sshd_permit_root_login is string
      - cis_sshd_permit_root_login in ['no', 'yes', 'prohibit-password', 'forced-commands-only']
    fail_msg: >-
      cis_sshd_log_level must be one of QUIET, FATAL, ERROR, INFO, VERBOSE, DEBUG, DEBUG1,
      DEBUG2 or DEBUG3 (got {{ cis_sshd_log_level | to_json }}), cis_sshd_max_startups three
      whole numbers start:rate:full with start of 1 or more, rate from 1 to 100 and full at
      least start (got {{ cis_sshd_max_startups | to_json }}), and cis_sshd_permit_root_login one
      of the quoted strings no, yes, prohibit-password or forced-commands-only
      (got {{ cis_sshd_permit_root_login | to_json }}).
    quiet: true
  vars:
    cis_sshd_startups_parts: "{{ (cis_sshd_max_startups | string).split(':') }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the section 5 yes/no values"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item) is boolean or (lookup('ansible.builtin.vars', item) | string | lower) in ['true', 'false']
    fail_msg: "{{ item }} must be true or false (got {{ lookup('ansible.builtin.vars', item) | to_json }})."
    quiet: true
  loop:
    - cis_sshd_disable_forwarding
    - cis_sshd_gssapi_authentication
    - cis_sshd_hostbased_authentication
    - cis_sshd_ignore_rhosts
    - cis_sshd_permit_empty_passwords
    - cis_sshd_permit_user_environment
    - cis_sshd_use_pam
    - cis_sudo_installed
    - cis_pam_installed
    - cis_authselect_installed
    - cis_libpwquality_installed
    - cis_sudo_use_pty
    - cis_sudo_pwfeedback
    - cis_sudo_visiblepw
    - cis_faillock_even_deny_root
    - cis_pwquality_enforce_for_root
    - cis_pwhistory_enforce_for_root
  tags:
    - always
    - preflight

- name: "Preflight - Validate the section 5 file modes"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item) is string
      - lookup('ansible.builtin.vars', item) is match('^0?[0-7]{3,4}$')
    fail_msg: >-
      {{ item }} must be a quoted string of three or four octal digits, for example "0600"
      (got {{ lookup('ansible.builtin.vars', item) | to_json }}).
    quiet: true
  loop:
    - cis_sshd_config_mode
    - cis_sshd_config_dir_mode
    - cis_sshd_private_key_mode
    - cis_sshd_public_key_mode
    - cis_sudoers_file_mode
    - cis_sudoers_dir_mode
  tags:
    - always
    - preflight

- name: "Preflight - Validate the section 5 owners, groups, paths and choices"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item.key) is string
      - lookup('ansible.builtin.vars', item.key) is match(item.pattern)
      - item.extra | default(true)
    fail_msg: "{{ item.key }} must be {{ item.what }} (got {{ lookup('ansible.builtin.vars', item.key) | to_json }})."
    quiet: true
  loop:
    - {key: cis_sshd_config_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_sshd_config_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_sshd_private_key_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_sshd_private_key_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_sshd_public_key_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_sshd_public_key_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_sudoers_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_sudoers_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_sshd_banner, pattern: '^/[A-Za-z0-9_./-]+$', what: an absolute path of letters, digits, underscore, dot, hyphen and slash}
    - {key: cis_sudo_timestamp_type, pattern: '^(tty|ppid|global|kernel)$', what: tty, ppid, global or kernel}
    - {key: cis_password_hash, pattern: '^(sha512|yescrypt|sha256|md5|blowfish)$', what: sha512, yescrypt, sha256, md5 or blowfish}
    - {key: cis_encrypt_method, pattern: '^(?i:sha512|yescrypt|sha256|md5|blowfish)$', what: the upper case spelling of cis_password_hash}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

# cis_password_hash (the pam_unix line, 5.3.3.4.3) and cis_encrypt_method (login.defs, 5.4.1.4) are
# one setting. Different values would make 5.3.3.4.3 and 5.4.1.4 undo each other on every run.
- name: "Preflight - Check that the two password hashing settings agree"
  ansible.builtin.assert:
    that:
      - cis_encrypt_method | upper == cis_password_hash | upper
    fail_msg: >-
      cis_encrypt_method ({{ cis_encrypt_method | to_json }}) must be cis_password_hash
      ({{ cis_password_hash | to_json }}) in upper case: the pam_unix line and ENCRYPT_METHOD are one
      setting, and different values would be rewritten against each other on every run.
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate the sudo and su settings"
  ansible.builtin.assert:
    that:
      - cis_sudo_logfile is string
      - cis_sudo_logfile is match('^/[A-Za-z0-9_./-]+$')
      - "'..' not in cis_sudo_logfile"
      - not cis_sudo_logfile.endswith('/')
      - cis_sudo_timestamp_timeout is not boolean
      - cis_sudo_timestamp_timeout | string is match('^-?[0-9]+$')
      - cis_su_group is string
      - cis_su_group is match('^[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: >-
      cis_sudo_logfile must be an absolute file path of letters, digits, underscore, dot,
      hyphen and slash (got {{ cis_sudo_logfile | to_json }}), cis_sudo_timestamp_timeout a
      whole number (got {{ cis_sudo_timestamp_timeout | to_json }}) and
      cis_su_group a plain group name of lowercase letters, digits, underscore and hyphen
      (got {{ cis_su_group | to_json }}).
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate the PAM settings"
  ansible.builtin.assert:
    that:
      - cis_authselect_profile is string
      - cis_authselect_profile is match('^[a-z][a-z0-9_-]{0,31}$')
      - cis_authselect_profile not in ['minimal', 'sssd', 'winbind', 'nis']
      - lookup('ansible.builtin.vars', item.key) is not boolean
      - lookup('ansible.builtin.vars', item.key) | string is match('^[0-9]+$')
      - lookup('ansible.builtin.vars', item.key) | int >= item.min
      - lookup('ansible.builtin.vars', item.key) | int <= item.max
    fail_msg: >-
      cis_authselect_profile must be a name of lowercase letters, digits, underscore and hyphen
      that starts with a letter, is at most 32 characters and is not a stock profile name (got
      {{ cis_authselect_profile | to_json }}), and {{ item.key }} must be a whole number from
      {{ item.min }} to {{ item.max }} (got {{ lookup('ansible.builtin.vars', item.key) | to_json }}).
    quiet: true
  loop:
    - {key: cis_faillock_deny, min: 1, max: 1000}
    - {key: cis_faillock_unlock_time, min: 0, max: 31536000}
    - {key: cis_faillock_root_unlock_time, min: 0, max: 31536000}
    - {key: cis_pwquality_difok, min: 0, max: 1000}
    - {key: cis_pwquality_minlen, min: 0, max: 1000}
    - {key: cis_pwquality_maxrepeat, min: 0, max: 1000}
    - {key: cis_pwquality_maxsequence, min: 0, max: 1000}
    - {key: cis_pwquality_dictcheck, min: 0, max: 1}
    - {key: cis_pwhistory_remember, min: 0, max: 400}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the account and environment settings"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item.key) is not boolean
      - lookup('ansible.builtin.vars', item.key) | string is match('^[0-9]+$')
      - lookup('ansible.builtin.vars', item.key) | int >= item.min
      - lookup('ansible.builtin.vars', item.key) | int <= item.max
    fail_msg: >-
      {{ item.key }} must be a whole number from {{ item.min }} to {{ item.max }}
      (got {{ lookup('ansible.builtin.vars', item.key) | to_json }}).
    quiet: true
  loop:
    - {key: cis_pass_max_days, min: 1, max: 99999}
    - {key: cis_pass_warn_age, min: 0, max: 99999}
    - {key: cis_inactive_days, min: 0, max: 99999}
    - {key: cis_tmout, min: 1, max: 31536000}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate the umask and the account exceptions"
  ansible.builtin.assert:
    that:
      - cis_umask is string
      - cis_umask is match('^[0-7]{3,4}$')
      - cis_account_exceptions is sequence and cis_account_exceptions is not string and cis_account_exceptions is not mapping
      - cis_rejected_exceptions | length == 0
    fail_msg: >-
      cis_umask must be a quoted string of three or four octal digits, for example "027"
      (got {{ cis_umask | to_json }}), and cis_account_exceptions
      a list of plain login names (letters, digits, underscore, dot and hyphen, not starting
      with a digit or hyphen){{
      (' - rejected items: ' ~ (cis_rejected_exceptions | map('to_json') | join(', ')))
      if cis_rejected_exceptions | length > 0 else '' }}.
    quiet: true
  vars:
    cis_rejected_exceptions: >-
      {{ ((cis_account_exceptions | reject('string') | list)
          + (cis_account_exceptions | select('string') | reject('regex', '^[A-Za-z_][A-Za-z0-9_.-]*$', match_type='fullmatch') | list))
         if (cis_account_exceptions is sequence and cis_account_exceptions is not string and cis_account_exceptions is not mapping)
         else [] }}
  tags:
    - always
    - preflight

