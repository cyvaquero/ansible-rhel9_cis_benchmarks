- name: "Preflight - Validate the section 1 names, paths and choices"
  ansible.builtin.assert:
    that:
      - vars[item.key] is string
      - (vars[item.key] | lower) is match(item.pattern)
    fail_msg: "{{ item.key }} must be {{ item.what }} (got {{ vars[item.key] | to_json }})."
    quiet: true
  loop:
    - {key: cis_bootloader_file_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_bootloader_file_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_banner_file_owner, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain account name}
    - {key: cis_banner_file_group, pattern: '^[a-z_][a-z0-9_.-]*[$]?$', what: a plain group name}
    - {key: cis_motd_path, pattern: '^/[a-z0-9_./-]+$', what: an absolute path of letters, digits, underscore, dot, hyphen and slash}
    - {key: cis_issue_path, pattern: '^/[a-z0-9_./-]+$', what: an absolute path of letters, digits, underscore, dot, hyphen and slash}
    - {key: cis_issue_net_path, pattern: '^/[a-z0-9_./-]+$', what: an absolute path of letters, digits, underscore, dot, hyphen and slash}
    - {key: cis_selinux_policy, pattern: '^[a-z0-9_-]+$', what: a policy name of letters, digits, underscore and hyphen}
    - {key: cis_selinux_target_mode, pattern: '^(enforcing|permissive|disabled)$', what: enforcing, permissive or disabled}
    - {key: cis_coredump_process_size_max, pattern: '^([0-9]+[kmgtpe]?|infinity)$', what: a whole number with an optional K, M, G, T, P or E suffix}
    - {key: cis_coredump_storage, pattern: '^(none|external|journal)$', what: none, external or journal}
    - {key: cis_crypto_policy_base, pattern: '^[a-z0-9_-]+$', what: a policy name of letters, digits, underscore and hyphen}
    - {key: cis_crypto_policy_module_sha1, pattern: '^[a-z0-9_-]+$', what: a policy module name of letters, digits, underscore and hyphen}
    - {key: cis_crypto_policy_module_mac, pattern: '^[a-z0-9_-]+$', what: a policy module name of letters, digits, underscore and hyphen}
    - {key: cis_crypto_policy_module_sshcbc, pattern: '^[a-z0-9_-]+$', what: a policy module name of letters, digits, underscore and hyphen}
    - {key: cis_crypto_policy_module_pq, pattern: '^[a-z0-9_-]+$', what: a policy module name of letters, digits, underscore and hyphen}
    - {key: cis_rescue_exec_start, pattern: '^[^ ].*$', what: a one-line ExecStart value}
    - {key: cis_emergency_exec_start, pattern: '^[^ ].*$', what: a one-line ExecStart value}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - always
    - preflight

- name: "Preflight - Validate cis_banner_text"
  ansible.builtin.assert:
    that:
      - cis_banner_text is string
      - cis_banner_text | trim | length > 0
    fail_msg: "cis_banner_text must be text that is not empty (got {{ cis_banner_text | to_json }})."
    quiet: true
  tags:
    - always
    - preflight

- name: "Preflight - Validate cis_gdm_wayland_enable"
  ansible.builtin.assert:
    that:
      - (cis_gdm_wayland_enable | string | lower) in ['absent', 'true', 'false']
    fail_msg: "cis_gdm_wayland_enable must be absent, true or false (got {{ cis_gdm_wayland_enable | to_json }})."
