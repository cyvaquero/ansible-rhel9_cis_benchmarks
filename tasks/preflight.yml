- name: "Preflight - Validate the section 1 file modes"
  ansible.builtin.assert:
    that:
      - vars[item] is string
      - vars[item] is match('^0?[0-7]{3,4}$')
    fail_msg: >-
      {{ item }} must be a quoted string of three or four octal digits, for example "0600"
      (got {{ vars[item] | to_json }}).
    quiet: true
  loop:
    - cis_bootloader_file_mode
    - cis_bootloader_efi_umask
    - cis_banner_file_mode
  tags:
