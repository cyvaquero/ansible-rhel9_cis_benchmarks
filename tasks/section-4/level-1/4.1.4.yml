---
# 4.1.4 - every active zone bound to an interface other than lo or virbr* has a target that
# is not ACCEPT or empty, and the same runtime and permanent target. With no such zone (or
# firewalld not running) the control is a finding with nothing to fix. The fix sets the
# permanent target to cis_firewalld_zone_target (default: default) on a zone whose target
# is empty or ACCEPT, then reloads firewalld; a runtime and permanent mismatch with an
# acceptable permanent target is fixed by the reload alone. Replacing an ACCEPT target can
# start filtering, so it is made only when the SSH guard
# (tasks/lib/firewalld_ssh_guard.yml) says the zone that applies to the role's connection
# allows SSH by service or port; otherwise the zone is left alone, a message says why and
# the control is a finding. An empty target is set without the guard. A control that still
# fails after the fix is a finding; under --check nothing changes and nothing is recorded
# in remediate mode.
#
# The check prints one line per action: accept:<zone>, empty:<zone>, reload, or
# state=noactive; its exit status is 1 when any line is printed.
- name: "4.1.4 - Handle the firewalld zone target"
  tags:
    - "4.1.4"
    - section-4
    - level-1
    - level-2
    - server
    - workstation
  block:
    - name: "4.1.4 - Check the state"
      ansible.builtin.command:
        argv: &cis_fw_4_1_4_argv
          - /bin/sh
          - -c
          - |
            if ! systemctl is-active --quiet firewalld.service 2>/dev/null; then
              echo "state=noactive"
              exit 1
            fi
            zones=$(firewall-cmd --get-active-zones 2>/dev/null | awk '
              /^[^ \t]/ { z = $1; next }
              /^[ \t]+interfaces:/ {
                for (i = 2; i <= NF; i++) {
                  if ($i == "lo" || $i ~ /^virbr/) continue
                  print z
                  break
                }
              }')
            if [ -z "$zones" ]; then
              echo "state=noactive"
              exit 1
            fi
            bad=0
            reload=0
            for z in $zones; do
              # The runtime target comes from list-all: --get-target needs --permanent.
              # Both sides drop any %% (%%REJECT%% is REJECT) so they compare equal.
              rt=$(firewall-cmd --zone="$z" --list-all 2>/dev/null | sed -n 's/^[[:space:]]*target:[[:space:]]*//p' | head -n 1 | tr -d '%[:space:]')
              pt=$(firewall-cmd --permanent --zone="$z" --get-target 2>/dev/null | tr -d '%[:space:]')
              case "$pt" in
                ACCEPT) echo "accept:$z"; bad=1 ;;
                "") echo "empty:$z"; bad=1 ;;
                *) if [ -n "$rt" ] && [ "$rt" != "$pt" ]; then reload=1; fi ;;
              esac
            done
            if [ "$reload" = 1 ]; then
              echo "reload"
              bad=1
            fi
            exit $bad
      register: cis_check_4_1_4
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "4.1.4 - Set the permanent zone target"
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - "--zone={{ item }}"
          - "--set-target={{ cis_firewalld_zone_target }}"
      loop: >-
        {{ ((cis_check_4_1_4.stdout_lines | select('match', '^empty:') | list)
            + (cis_check_4_1_4.stdout_lines | select('match', '^accept:') | list
               if (cis_fw_guard_replace_ok | default(false) | bool) else []))
           | map('regex_replace', '^[a-z]+:', '') | list }}
      register: cis_set_4_1_4
      changed_when: true
      when:
        - not (cis_audit_only | bool)
        - cis_check_4_1_4.rc != 0

    - name: "4.1.4 - Reload firewalld to apply the permanent configuration"
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --reload
      changed_when: true
      when:
        - not (cis_audit_only | bool)
        - cis_check_4_1_4.rc != 0
        - "'state=noactive' not in cis_check_4_1_4.stdout_lines"
        - cis_set_4_1_4 is changed or 'reload' in cis_check_4_1_4.stdout_lines

    - name: "4.1.4 - Report that an ACCEPT target was kept because SSH may not be allowed"
      ansible.builtin.debug:
        msg: >-
          The ACCEPT zone target is kept: SSH is not known to be allowed by service or port in
          the zone that applies to this connection ({{ cis_fw_guard_zone | default('unknown') }}).
          Allow SSH there, or set the zone target by hand.
      when:
        - not (cis_audit_only | bool)
        - cis_check_4_1_4.stdout_lines | select('match', '^accept:') | list | length > 0
        - not (cis_fw_guard_replace_ok | default(false) | bool)

    - name: "4.1.4 - Check again after the fix"
      ansible.builtin.command:
        argv: *cis_fw_4_1_4_argv
      register: cis_recheck_4_1_4
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode
        - cis_check_4_1_4.rc != 0

    - name: "4.1.4 - Record the finding when the check fails in audit mode"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "4.1.4"
      when:
        - cis_audit_only | bool
        - cis_check_4_1_4.rc != 0

    # Under --check the fix does not happen, so the second check says nothing new.
    - name: "4.1.4 - Record the finding when the fix did not take effect"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "4.1.4"
      when:
        - cis_recheck_4_1_4 is not skipped
        - not ansible_check_mode
        - cis_recheck_4_1_4.rc != 0
...
