---
# 4.1.3 - firewalld.service is unmasked, enabled and active. The check judges the benchmark
# (cis_expect_firewalld_enabled and _active). The fix makes the service enabled and active exactly
# as cis_firewalld_enabled and cis_firewalld_active say: it unmasks (when either is true),
# enables or disables, and starts or stops it, whenever it differs. Starting it begins
# filtering, so it is made only when firewalld already runs or the SSH guard
# (tasks/lib/firewalld_ssh_guard.yml) says the zone that applies to the role's own connection
# allows SSH or accepts everything; otherwise the host is left alone, a message says why and
# the control is a finding. A variable can never bypass the guard. Stopping or disabling only
# lifts filtering, so it needs no guard. With firewalld not installed there is nothing to fix
# here (4.1.1 installs it); with cis_firewalld_installed false the service is left to 4.1.1
# (a kept package is stopped and masked there). A control that is not compliant with the
# benchmark after the fix is a finding, so a site value of false is found on every run; under
# --check nothing changes and nothing is recorded in remediate mode.
#
# The check prints state=ok, state=bad or state=nopkg (the benchmark verdict), site=ok or
# site=bad (whether the service is enabled, active and, when wanted, unmasked as the site wants)
# and active=yes or active=no; its exit status is 1 unless state=ok.
- name: "4.1.3 - Handle the firewalld service"
  tags:
    - "4.1.3"
    - section-4
    - level-1
    - level-2
    - server
    - workstation
  block:
    - name: "4.1.3 - Check the state"
      ansible.builtin.command:
        argv: &cis_fw_4_1_3_argv
          - /bin/sh
          - -c
          - |
            # $1, $2: enabled and active as the benchmark wants (yes or no); $3, $4: as the site wants.
            if ! rpm -q firewalld >/dev/null 2>&1; then
              echo "state=nopkg"
              exit 1
            fi
            active=no
            systemctl is-active --quiet firewalld.service 2>/dev/null && active=yes
            echo "active=$active"
            load=$(systemctl show -p LoadState --value firewalld.service 2>/dev/null)
            enabled=$(systemctl is-enabled firewalld.service 2>/dev/null)
            if [ "$enabled" = enabled ]; then ens=yes; else ens=no; fi
            site=ok
            [ "$ens" = "$3" ] && [ "$active" = "$4" ] || site=bad
            if [ "$load" = masked ] && { [ "$3" = yes ] || [ "$4" = yes ]; }; then site=bad; fi
            echo "site=$site"
            if [ "$load" != masked ] && [ "$ens" = "$1" ] && [ "$active" = "$2" ]; then
              echo "state=ok"
              exit 0
            fi
            echo "state=bad"
            exit 1
          - sh
          - "{{ 'yes' if cis_expect_firewalld_enabled | bool else 'no' }}"
          - "{{ 'yes' if cis_expect_firewalld_active | bool else 'no' }}"
          - "{{ 'yes' if cis_firewalld_enabled | bool else 'no' }}"
          - "{{ 'yes' if cis_firewalld_active | bool else 'no' }}"
      register: cis_check_4_1_3
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "4.1.3 - Make firewalld enabled and active as the site wants"
      ansible.builtin.systemd:
        name: firewalld.service
        masked: "{{ false if (cis_firewalld_enabled | bool or cis_firewalld_active | bool) else omit }}"
        enabled: "{{ cis_firewalld_enabled | bool }}"
        state: "{{ 'started' if cis_firewalld_active | bool else 'stopped' }}"
      when:
        - not (cis_audit_only | bool)
        - cis_firewalld_installed | bool
        - "'site=bad' in cis_check_4_1_3.stdout_lines"
        - not (cis_firewalld_active | bool) or 'active=yes' in cis_check_4_1_3.stdout_lines or (cis_fw_guard_start_ok | default(false) | bool)

    - name: "4.1.3 - Report that firewalld was not started because SSH may not be allowed"
      ansible.builtin.debug:
        msg: >-
          firewalld is not started: SSH is not known to be allowed in the zone that applies to
          this connection ({{ cis_fw_guard_zone | default('unknown') }}). Allow SSH there, or
          start firewalld by hand.
      when:
        - not (cis_audit_only | bool)
        - cis_firewalld_installed | bool
        - cis_firewalld_active | bool
        - "'site=bad' in cis_check_4_1_3.stdout_lines"
        - "'active=no' in cis_check_4_1_3.stdout_lines"
        - not (cis_fw_guard_start_ok | default(false) | bool)

    - name: "4.1.3 - Check again after the fix"
      ansible.builtin.command:
        argv: *cis_fw_4_1_3_argv
      register: cis_recheck_4_1_3
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode

    - name: "4.1.3 - Record the finding when the check fails in audit mode"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "4.1.3"
      when:
        - cis_audit_only | bool
        - cis_check_4_1_3.rc != 0

    # Under --check the fix does not happen, so the second check says nothing new.
    - name: "4.1.3 - Record the finding when the fix did not take effect"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "4.1.3"
      when:
        - cis_recheck_4_1_3 is not skipped
        - not ansible_check_mode
        - cis_recheck_4_1_3.rc != 0
...
