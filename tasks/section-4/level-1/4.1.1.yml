---
# 4.1.1 - firewalld is installed. The check judges the benchmark (cis_expect_firewalld_installed).
# The fix makes the package exactly as cis_firewalld_installed says: true installs it with dnf
# when missing (install only; 4.1.3 decides what runs), false removes it when no other installed
# package needs it (an rpm erase test decides; dependents are never removed), otherwise it stays
# and firewalld.service is stopped and masked, and 4.1.3 then leaves the service alone. Removing
# or stopping firewalld only lifts filtering, so there is no SSH guard here. A control that is
# not compliant with the benchmark after the fix is a finding, so false is reported on every run.
# Audit mode only reports; under --check nothing changes and nothing is recorded in remediate mode.
- name: "4.1.1 - Handle the firewalld package"
  tags:
    - "4.1.1"
    - section-4
    - level-1
    - level-2
    - server
    - workstation
  block:
    - name: "4.1.1 - Check firewalld is installed"
      ansible.builtin.command:
        argv: &cis_fw_4_1_1_argv
          - rpm
          - -q
          - firewalld
      register: cis_check_4_1_1
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "4.1.1 - Install firewalld"
      ansible.builtin.dnf:
        name: firewalld
        state: present
      when:
        - not (cis_audit_only | bool)
        - cis_firewalld_installed | bool
        - cis_check_4_1_1.rc != 0

    - name: "4.1.1 - Check whether another package needs firewalld"
      ansible.builtin.command:
        argv:
          - rpm
          - -e
          - --test
          - firewalld
      register: cis_erase_4_1_1
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not (cis_firewalld_installed | bool)
        - cis_check_4_1_1.rc == 0

    - name: "4.1.1 - Remove firewalld"
      ansible.builtin.dnf:
        name: firewalld
        state: absent
      when:
        - cis_erase_4_1_1 is not skipped
        - cis_erase_4_1_1.rc == 0

    - name: "4.1.1 - Stop and mask firewalld because another package needs it"
      ansible.builtin.systemd:
        name: firewalld.service
        state: stopped
        masked: true
      failed_when: false
      when:
        - cis_erase_4_1_1 is not skipped
        - cis_erase_4_1_1.rc != 0

    - name: "4.1.1 - Report that firewalld was kept"
      ansible.builtin.debug:
        msg: >-
          firewalld stays installed because another installed package needs it; firewalld.service
          is stopped and masked instead.
      when:
        - cis_erase_4_1_1 is not skipped
        - cis_erase_4_1_1.rc != 0

    - name: "4.1.1 - Check again after the fix"
      ansible.builtin.command:
        argv: *cis_fw_4_1_1_argv
      register: cis_recheck_4_1_1
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode

    - name: "4.1.1 - Record the finding when the check fails in audit mode"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "4.1.1"
      when:
        - cis_audit_only | bool
        - (cis_check_4_1_1.rc == 0) != (cis_expect_firewalld_installed | bool)

    # Under --check the fix does not happen, so the second check says nothing new.
    - name: "4.1.1 - Record the finding when the fix did not take effect"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "4.1.1"
      when:
        - cis_recheck_4_1_1 is not skipped
        - not ansible_check_mode
        - (cis_recheck_4_1_1.rc == 0) != (cis_expect_firewalld_installed | bool)
...
