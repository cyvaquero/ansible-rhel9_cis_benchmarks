---
# 4.1.2 - the firewalld backend. The check judges the benchmark: only an explicit
# FirewallBackend=<cis_expect_firewalld_backend_forbidden> (iptables) in
# /etc/firewalld/firewalld.conf is non-compliant (the last such line wins, as in firewalld, and
# the case is ignored); a missing file, a missing line or any other value passes. The fix makes
# the last FirewallBackend line exactly cis_firewalld_backend (default nftables) whenever it
# differs, also when the line holds another spelling or value the benchmark accepts. A missing
# line counts as firewalld's own default (cis_firewalld_backend_unset) and is written only when
# that differs from the variable; a missing file is left alone. When the line changes, firewalld
# is restarted right away, and only when it is running (try-restart), so the new backend applies
# before any later control reloads firewalld: a firewalld that could not apply the old line (a
# reload with a value it does not know fails and leaves its rules half applied) can hang a later
# reload and cut the role's SSH connection. A control that is not compliant
# with the benchmark after the fix (a site value of iptables) is a finding on every run; under
# --check nothing changes and nothing is recorded in remediate mode.
#
# The check prints state=ok or state=bad (the benchmark verdict) and site=ok or site=bad
# (whether the effective backend is exactly the variable); its exit status is 1 when
# state=bad.
- name: "4.1.2 - Handle the firewalld backend"
  tags:
    - "4.1.2"
    - section-4
    - level-1
    - level-2
    - server
    - workstation
  block:
    - name: "4.1.2 - Check the state"
      ansible.builtin.command:
        argv: &cis_fw_4_1_2_argv
          - /bin/sh
          - -c
          - |
            # $1: the backend the site wants, $2: the one the benchmark forbids, $3: the backend
            # firewalld uses when the line is missing.
            f=/etc/firewalld/firewalld.conf
            raw=$(sed -n 's/^[[:space:]]*FirewallBackend[[:space:]]*=[[:space:]]*//p' "$f" 2>/dev/null | tail -n 1 | tr -d '[:space:]')
            v=$(printf '%s' "$raw" | tr 'A-Z' 'a-z')
            site=ok
            if [ -f "$f" ]; then
              if [ -n "$raw" ]; then
                [ "$raw" = "$1" ] || site=bad
              else
                [ "$3" = "$1" ] || site=bad
              fi
            fi
            echo "site=$site"
            if [ "$v" = "$2" ]; then
              echo "state=bad"
              exit 1
            fi
            echo "state=ok"
          - sh
          - "{{ cis_firewalld_backend }}"
          - "{{ cis_expect_firewalld_backend_forbidden }}"
          - "{{ cis_firewalld_backend_unset }}"
      register: cis_check_4_1_2
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "4.1.2 - Set the firewalld backend"
      ansible.builtin.lineinfile:
        path: /etc/firewalld/firewalld.conf
        regexp: '^\s*FirewallBackend\s*='
        line: "FirewallBackend={{ cis_firewalld_backend }}"
      register: cis_set_4_1_2
      when:
        - not (cis_audit_only | bool)
        - "'site=bad' in cis_check_4_1_2.stdout_lines"

    # try-restart leaves a stopped firewalld alone (starting it is 4.1.3's decision, behind the
    # SSH guard). The systemd module has no try-restart state, so the command-instead-of-module
    # rule is waived.
    - name: "4.1.2 - Restart firewalld now when it is running so the new backend applies"
      ansible.builtin.command: /usr/bin/systemctl try-restart firewalld.service  # noqa: command-instead-of-module
      changed_when: true
      when:
        - not (cis_audit_only | bool)
        - cis_set_4_1_2 is changed

    - name: "4.1.2 - Check again after the fix"
      ansible.builtin.command:
        argv: *cis_fw_4_1_2_argv
      register: cis_recheck_4_1_2
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode

    - name: "4.1.2 - Record the finding when the check fails in audit mode"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "4.1.2"
      when:
        - cis_audit_only | bool
        - cis_check_4_1_2.rc != 0

    # Under --check the fix does not happen, so the second check says nothing new.
    - name: "4.1.2 - Record the finding when the fix did not take effect"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "4.1.2"
      when:
        - cis_recheck_4_1_2 is not skipped
        - not ansible_check_mode
        - cis_recheck_4_1_2.rc != 0
...
