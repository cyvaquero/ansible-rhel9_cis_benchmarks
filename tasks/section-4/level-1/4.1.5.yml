---
# 4.1.5 (manual) - lists the nftables rules that match the loopback interface, for review.
# It only reads, in both modes, and records no finding: summary.yml lists manual controls.
# Output is empty when the tool it reads is not available.

- name: "4.1.5 - Find the loopback interface rules"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - |
        nft list ruleset 2>/dev/null | grep -E '(iifname|oifname) "?lo"?' || true
  register: cis_check_4_1_5
  changed_when: false
  check_mode: false
  failed_when: false
  tags: &cis_tags_4_1_5
    - "4.1.5"
    - section-4
    - level-1
    - server
    - workstation

- name: "4.1.5 - Report the loopback interface rules for review"
  ansible.builtin.debug:
    msg: "{{ ['Rules that match the loopback interface (nft list ruleset):'] + (cis_check_4_1_5.stdout_lines | default([])) }}"
  tags: *cis_tags_4_1_5
...
