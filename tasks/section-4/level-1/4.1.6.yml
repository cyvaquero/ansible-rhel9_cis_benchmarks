---
# 4.1.6 (manual) - lists the nftables rules that match loopback source and destination
# addresses, for review. It only reads, in both modes, and records no finding: summary.yml
# lists manual controls. Output is empty when the tool it reads is not available.

- name: "4.1.6 - Find the loopback address rules"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - |
        nft list ruleset 2>/dev/null | grep -E '(127\.0\.0\.0/8|127\.0\.0\.1|::1)' || true
  register: cis_check_4_1_6
  changed_when: false
  check_mode: false
  failed_when: false
  tags: &cis_tags_4_1_6
    - "4.1.6"
    - section-4
    - level-1
    - server
    - workstation

- name: "4.1.6 - Report the loopback address rules for review"
  ansible.builtin.debug:
    msg: "{{ ['Rules that match the loopback addresses (nft list ruleset):'] + (cis_check_4_1_6.stdout_lines | default([])) }}"
  tags: *cis_tags_4_1_6
...
