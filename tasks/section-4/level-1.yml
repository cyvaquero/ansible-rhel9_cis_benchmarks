---
# Section 4, Level 1 controls, one file per control in level-1/.
#
# import_tasks, not include_tasks: see tasks/section-1/level-1.yml.
#
# The SSH guard is computed after 4.1.1 (which may install firewalld) and before the
# controls that depend on it, 4.1.3 and 4.1.4. It only reads the host.

- name: "4.1.1 - Ensure firewalld is installed"
  ansible.builtin.import_tasks: level-1/4.1.1.yml
  when: "'4.1.1' in cis_selected_controls"

- name: "4.1.3 - Work out the SSH guard for the firewalld controls"
  ansible.builtin.import_tasks: ../lib/firewalld_ssh_guard.yml
  when:
    - "'4.1.3' in cis_selected_controls or '4.1.4' in cis_selected_controls"
    - not (cis_audit_only | bool)
  tags:
    - "4.1.3"
    - "4.1.4"
    - section-4
    - level-1
    - level-2
    - server
    - workstation

- name: "4.1.2 - Ensure firewalld backend is configured"
  ansible.builtin.import_tasks: level-1/4.1.2.yml
  when: "'4.1.2' in cis_selected_controls"

- name: "4.1.3 - Ensure firewalld.service is configured"
  ansible.builtin.import_tasks: level-1/4.1.3.yml
  when: "'4.1.3' in cis_selected_controls"

- name: "4.1.4 - Ensure firewalld active zone target is configured"
  ansible.builtin.import_tasks: level-1/4.1.4.yml
  when: "'4.1.4' in cis_selected_controls"

- name: "4.1.5 - Ensure firewalld loopback traffic is configured"
  ansible.builtin.import_tasks: level-1/4.1.5.yml
  when: "'4.1.5' in cis_selected_controls"

- name: "4.1.6 - Ensure firewalld loopback source address traffic is configured"
  ansible.builtin.import_tasks: level-1/4.1.6.yml
  when: "'4.1.6' in cis_selected_controls"

- name: "4.1.7 - Ensure firewalld services and ports are configured"
  ansible.builtin.import_tasks: level-1/4.1.7.yml
  when: "'4.1.7' in cis_selected_controls"

- name: "4.1.9 - Ensure conflicting firewall utilities are not in use with firewalld"
  ansible.builtin.import_tasks: level-1/4.1.9.yml
  when: "'4.1.9' in cis_selected_controls"
...
