---
# Shared logic for the banner file access controls (1.7.4 to 1.7.6). A control file imports
# this with:
#   cis_ba_id    the CIS ID
#   cis_ba_path  the file
# and puts the tags, which every task here inherits, on the import.
#
# Compliant: a regular file owned by root:root with no write for group or other and no
# execute bit (0644 or stricter). A missing file is compliant: whether it must exist is
# for 1.7.1 to 1.7.3. A symlink or a file of another type is never changed (chmod would act
# on the link target); it is a finding. The fix removes the offending bits and keeps
# anything stricter. Remediate mode records a finding when the file is still not compliant
# after the fix; under --check nothing is fixed, so nothing is recorded then.
# Task names are one template expression because the CIS ID must come first.

- name: "{{ cis_ba_id ~ ' - Read the owner and mode of ' ~ cis_ba_path }}"
  ansible.builtin.command:
    argv: &cis_ba_argv
      - /bin/bash
      - -c
      - |
        set -u
        export LC_ALL=C
        p=$1
        if [ ! -e "$p" ] && [ ! -L "$p" ]; then echo "state=ok"; exit 0; fi
        if [ -L "$p" ]; then echo "state=link"; exit 0; fi
        read -r u g m t < <(stat -c '%u %g %a %F' "$p")
        case "$t" in regular*) ;; *) echo "state=odd"; exit 0 ;; esac
        if [ "$u" = 0 ] && [ "$g" = 0 ] && (( (8#$m & 8#133) == 0 )); then echo "state=ok"; else echo "state=bad"; fi
      - bash
      - "{{ cis_ba_path }}"
  register: cis_ba_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: "{{ cis_ba_id ~ ' - Set the owner and mode of ' ~ cis_ba_path }}"
  ansible.builtin.file:
    path: "{{ cis_ba_path }}"
    state: file
    owner: root
    group: root
    mode: "u-x,g-wx,o-wx"
    follow: false
  when:
    - not (cis_audit_only | bool)
    - "'state=bad' in cis_ba_check.stdout_lines"

- name: "{{ cis_ba_id ~ ' - Read the owner and mode of ' ~ cis_ba_path ~ ' again after the fix' }}"
  ansible.builtin.command:
    argv: *cis_ba_argv
  register: cis_ba_recheck
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - "'state=bad' in cis_ba_check.stdout_lines"

- name: "{{ cis_ba_id ~ ' - Record the finding' }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "{{ cis_ba_id }}"
  when:
    - "'state=ok' not in (cis_ba_recheck.stdout_lines | default(cis_ba_check.stdout_lines))"
    - (cis_audit_only | bool) or not ansible_check_mode
...
