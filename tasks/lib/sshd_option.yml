---
# Shared logic for the sshd setting controls (5.1.9 to 5.1.23). A control file imports this
# with:
#   cis_sd_id       the CIS ID
#   cis_sd_options  a list of {spec, directive, value}: spec is "name|kind|arg|want" (name: the
#                   keyword as sshd -T prints it, in lower case), directive and value are
#                   what the fix writes. Kinds: eq (value equals arg, any case), num (a whole
#                   number from 1 to arg), pos (a whole number above 0), oneof (one of the
#                   comma separated words in arg), startups (MaxStartups, each of the three
#                   numbers at most the matching one in arg), banner (a path to a file with no
#                   login escapes and no OS name). arg is the benchmark value (a role constant,
#                   cis_expect_*) and judges the check. want is optional: the value the site
#                   configured (the same as value, as sshd -T prints it, compared without regard
#                   to case). When it is given the fix makes the effective value exactly want,
#                   also when the benchmark check passes; without it the fix writes only when
#                   the benchmark check fails (the older behavior).
#   cis_sd_fix_ok   optional, default true: false stops the fix (a message says why)
#   cis_sd_fix_msg  the message for that case
# and puts the tags, which every task here inherits, on the import.
#
# Compliance is judged on the effective configuration, `sshd -T` (read only), never on one
# file, and also on `sshd -T -C` for the role's own connection (cis_sshd_ctx, set in
# tasks/section-5/level-1.yml) so a Match block for that account is seen. A host without
# sshd passes. A setting that is already compliant, wherever it comes from, is never
# touched unless a want is given and the value differs from it. The fix writes the one directive into the role's own drop-in cis_sshd_dropin
# (name sorts before 50-redhat.conf), validated with `sshd -t -f` before it is written, and
# notifies the handler that checks the whole configuration with `sshd -t` and reloads sshd
# only when it runs. A value set by another file still wins (for most keywords one read
# earlier: a file that sorts before the drop-in, or the main file above its Include; for
# MaxStartups, which sshd resolves last-value-wins, one read later): the control is then a finding, and the role
# edits no file it does not own. Under --check nothing is fixed and, in remediate mode,
# nothing is recorded.

- name: "{{ cis_sd_id ~ ' - Check the effective sshd settings' }}"
  ansible.builtin.command:
    argv: &cis_sd_argv
      - /bin/sh
      - -c
      - |
        set -u
        export LC_ALL=C
        ctx=$1
        specs=$2
        sshd=/usr/sbin/sshd
        if [ ! -x "$sshd" ]; then
          echo "state=nosshd"
          exit 0
        fi
        base=$("$sshd" -T 2>/dev/null) || { echo "state=unreadable"; exit 1; }
        conn=""
        if [ -n "$ctx" ]; then
          conn=$("$sshd" -T -C "$ctx" 2>/dev/null) || conn=""
        fi
        val() { printf '%s\n' "$1" | awk -v n="$2" '$1 == n { sub(/^[^ ]+ +/, ""); print; exit }'; }
        isnum() { case $1 in ''|*[!0-9]*) return 1 ;; esac; }
        same() { [ "$(printf '%s' "$1" | tr 'A-Z' 'a-z')" = "$(printf '%s' "$2" | tr 'A-Z' 'a-z')" ]; }
        ok() {
          v=$(val "$1" "$2")
          case $3 in
            eq) [ "$(printf '%s' "$v" | tr 'A-Z' 'a-z')" = "$4" ] ;;
            num) isnum "$v" && [ "$v" -ge 1 ] && [ "$v" -le "$4" ] ;;
            pos) isnum "$v" && [ "$v" -ge 1 ] ;;
            oneof)
              v=$(printf '%s' "$v" | tr 'A-Z' 'a-z')
              case ",$4," in *",$v,"*) return 0 ;; esac
              return 1 ;;
            startups)
              set -- $(printf '%s' "$v" | tr ':' ' ') $(printf '%s' "$4" | tr ':' ' ')
              [ $# -eq 6 ] || return 1
              isnum "$1" && isnum "$2" && isnum "$3" || return 1
              [ "$1" -le "$4" ] && [ "$2" -le "$5" ] && [ "$3" -le "$6" ] ;;
            banner)
              case $v in /*) ;; *) return 1 ;; esac
              [ -f "$v" ] || return 1
              grep -Eqi -- '\\[vrms]' "$v" && return 1
              osid=$(sed -n 's/^ID=//p' /etc/os-release 2>/dev/null | tr -d '"' | head -n 1)
              if [ -n "$osid" ] && grep -Eqiw -- "$osid" "$v"; then return 1; fi
              return 0 ;;
            *) return 1 ;;
          esac
        }
        # bad=<name>: the benchmark check fails; fix=<name>: the fix has to write it (the value
        # differs from what the site wants; without a want, the check fails).
        res=$(printf '%s\n' "$specs" | while IFS='|' read -r name kind arg want; do
          [ -n "$name" ] || continue
          b=0
          d=0
          for src in "$base" "$conn"; do
            [ -n "$src" ] || continue
            if ! ok "$src" "$name" "$kind" "$arg"; then b=1; fi
            if [ -n "$want" ] && ! same "$(val "$src" "$name")" "$want"; then d=1; fi
          done
          [ "$b" -eq 1 ] && echo "bad=$name"
          if [ -n "$want" ]; then f=$d; else f=$b; fi
          [ "$f" -eq 1 ] && echo "fix=$name"
        done)
        if [ -n "$res" ]; then
          printf '%s\n' "$res"
          if printf '%s\n' "$res" | grep -q '^bad='; then
            echo "state=bad"
            exit 1
          fi
          echo "state=diff"
          exit 0
        fi
        echo "state=ok"
      - sh
      - "{{ cis_sshd_ctx | default('') }}"
      - "{{ cis_sd_options | map(attribute='spec') | join('\n') }}"
  register: cis_sd_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: "{{ cis_sd_id ~ ' - Work out which sshd settings need a change' }}"
  ansible.builtin.set_fact:
    cis_sd_state: "{{ cis_sd_check.stdout_lines | select('match', '^state=') | first | default('state=unreadable') | regex_replace('^state=', '') }}"
    cis_sd_bad: "{{ cis_sd_check.stdout_lines | select('match', '^fix=') | map('regex_replace', '^fix=', '') | list }}"

- name: "{{ cis_sd_id ~ ' - Report why the sshd settings are not changed' }}"
  ansible.builtin.debug:
    msg: "{{ cis_sd_fix_msg | default('The change is not made.') }}"
  when:
    - not (cis_audit_only | bool)
    - cis_sd_bad | length > 0
    - not (cis_sd_fix_ok | default(true) | bool)

- name: "{{ cis_sd_id ~ ' - Write the managed header of the sshd drop-in' }}"
  ansible.builtin.lineinfile:
    path: "{{ cis_sshd_dropin }}"
    regexp: '^# Managed by the CIS RHEL 9 role'
    line: "# Managed by the CIS RHEL 9 role. Most sshd keywords take the first value read, so this file sorts first; MaxStartups takes the last."
    insertbefore: BOF
    create: true
    owner: "{{ cis_sshd_config_owner }}"
    group: "{{ cis_sshd_config_group }}"
    mode: "{{ cis_sshd_config_mode }}"
  when:
    - not (cis_audit_only | bool)
    - cis_sd_bad | length > 0
    - cis_sd_fix_ok | default(true) | bool

- name: "{{ cis_sd_id ~ ' - Set the sshd directives in the role drop-in' }}"
  ansible.builtin.lineinfile:
    path: "{{ cis_sshd_dropin }}"
    regexp: '(?i)^\s*{{ item.directive }}\s'
    line: "{{ item.directive }} {{ item.value }}"
    create: true
    owner: "{{ cis_sshd_config_owner }}"
    group: "{{ cis_sshd_config_group }}"
    mode: "{{ cis_sshd_config_mode }}"
    validate: /usr/sbin/sshd -t -f %s
  loop: "{{ cis_sd_options }}"
  loop_control:
    label: "{{ item.directive }}"
  notify: Reload sshd when running
  when:
    - not (cis_audit_only | bool)
    - cis_sd_bad | length > 0
    - cis_sd_fix_ok | default(true) | bool
    - item.spec.split('|')[0] in cis_sd_bad

- name: "{{ cis_sd_id ~ ' - Check the effective sshd settings again after the fix' }}"
  ansible.builtin.command:
    argv: *cis_sd_argv
  register: cis_sd_recheck
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - cis_sd_state in ['bad', 'diff']
    - cis_sd_fix_ok | default(true) | bool

- name: "{{ cis_sd_id ~ ' - Report a setting that another file overrides' }}"
  ansible.builtin.debug:
    msg: >-
      The value written to {{ cis_sshd_dropin }} is not effective: another sshd file sets the
      same keyword and wins. Most keywords take the first value read (a drop-in that sorts
      earlier, or the main file above its Include); MaxStartups takes the last (any file read
      after this one).
      The role edits no file it does not own; change that file by hand.
  when:
    - cis_sd_recheck is not skipped
    - cis_sd_recheck.stdout_lines | select('match', '^fix=') | list | length > 0

# Audit mode, an unreadable configuration and a fix that is not allowed are real findings.
# After a fix, a setting that does not meet the benchmark is one too (a site value that is weaker
# than the benchmark, or one that another file overrides). Under --check the fix does
# not happen, so remediate mode records nothing then.
- name: "{{ cis_sd_id ~ ' - Record the finding' }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "{{ cis_sd_id }}"
  when:
    - >-
      cis_sd_state == 'unreadable'
      or (cis_sd_state == 'bad' and ((cis_audit_only | bool) or not (cis_sd_fix_ok | default(true) | bool)))
      or (cis_sd_recheck is not skipped and 'state=bad' in cis_sd_recheck.stdout_lines)
...
