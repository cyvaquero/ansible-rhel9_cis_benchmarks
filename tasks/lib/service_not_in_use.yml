---
# Shared logic for the "service not in use" controls (2.1.1 to 2.1.18, 3.1.3). A control
# file imports this with:
#   cis_svc_id        the CIS ID, for the task names and the finding
#   cis_svc_name      a short service label for the task names
#   cis_svc_packages  the packages that provide the service
#   cis_svc_units     the systemd units (sockets, services, paths) of the service
#   cis_svc_want      optional, default []: the listed packages the site wants installed (a
#                     role variable). They are left out of the removal, installed with dnf when
#                     missing, and reported as a finding while installed, since the benchmark
#                     wants them absent. Pass in cis_svc_units only the units of the packages
#                     that are not wanted
# and puts the tags, which every task here inherits, on the import.
#
# Decision, made on the host at run time with read-only commands:
# - A listed package that is installed and that no other installed package needs is
#   removed with dnf. "Needs" is decided by an rpm erase test of all the control's
#   installed packages together, so the control's own packages never block each other.
#   A package that something else needs is kept (the loop drops it from the erase set and
#   tests again, so a package that needs a kept one is kept too).
# - When any package is kept, or no listed package is installed but a listed unit still
#   exists, every existing unit is stopped and masked. A masked, inactive unit is
#   compliant; a kept package with all its units masked is compliant.
# - A package in cis_svc_want is installed when missing (after the removal) and
#   never removed or masked. The check judges the benchmark, so it prints want:<package>
#   for one that is installed, which fails the check.
# - A site that needs the service lists the CIS ID in cis_services_keep: the whole
#   control is skipped with no finding.
#
# The check prints one line per action: remove:<package>, keep:<package> (information
# only), want:<package>, install:<package> (information only: a wanted package that is
# missing) and mask:<unit>; its exit status is 1 when a remove:, want: or mask: line exists.
# Audit mode only runs the check and records a finding. Remediate mode removes, runs the
# check again to learn which units remain (units of a removed package are gone), masks
# them, and checks a last time. A control that still fails is recorded as a finding
# without failing the run; under --check nothing changes and nothing is recorded.
# Task names are one template expression because ansible-lint allows a template only at
# the end of a name, and the CIS ID must come first.
# Needs cis_selected_controls (preflight) and finding.yml.

- name: "{{ cis_svc_id ~ ' - Handle the ' ~ cis_svc_name ~ ' service unless the site keeps it' }}"
  when: cis_svc_id not in (cis_services_keep | default([]))
  block:
    - name: "{{ cis_svc_id ~ ' - Check the ' ~ cis_svc_name ~ ' service is not in use' }}"
      ansible.builtin.command:
        argv: &cis_svc_argv
          - /bin/sh
          - -c
          - |
            # $1: packages, $2: units, $3: packages the site wants, all space separated.
            pkgs=$1
            units=$2
            want=$3
            erase=""
            blocked=""
            wanted=""
            install=""
            for p in $pkgs; do
              case " $want " in
                *" $p "*)
                  if rpm -q "$p" >/dev/null 2>&1; then wanted="$wanted $p"; else install="$install $p"; fi
                  continue ;;
              esac
              rpm -q "$p" >/dev/null 2>&1 && erase="$erase $p"
            done
            while :; do
              set -- $erase
              [ $# -gt 0 ] || break
              out=$(rpm -e --test "$@" 2>&1) && break
              # Failure lines read "<capability> is needed by (installed) <package>".
              caps=$(printf '%s\n' "$out" | sed -n 's/^[[:space:]]*\([^[:space:]][^[:space:]]*\)[[:space:]].*is needed by (installed).*/\1/p' | sort -u)
              drop=""
              for c in $caps; do
                for n in $(rpm -q --qf '%{NAME}\n' --whatprovides "$c" 2>/dev/null); do
                  case " $erase " in *" $n "*) drop="$drop $n" ;; esac
                done
              done
              # Failed for a reason we cannot read: keep everything.
              [ -n "$drop" ] || drop=$erase
              new=""
              for p in $erase; do
                case " $drop " in
                  *" $p "*) blocked="$blocked $p" ;;
                  *) new="$new $p" ;;
                esac
              done
              erase=$new
            done
            bad=0
            for p in $erase; do echo "remove:$p"; bad=1; done
            for p in $blocked; do echo "keep:$p"; done
            for p in $wanted; do echo "want:$p"; bad=1; done
            for p in $install; do echo "install:$p"; done
            if [ -n "$blocked" ] || [ -z "$erase" ]; then
              for u in $units; do
                state=$(systemctl show -p LoadState --value "$u" 2>/dev/null)
                case "$state" in ""|not-found) continue ;; esac
                active=$(systemctl show -p ActiveState --value "$u" 2>/dev/null)
                case "$active" in
                  active|activating|reloading) running=yes ;;
                  *) running=no ;;
                esac
                if [ "$state" != masked ] || [ "$running" = yes ]; then
                  echo "mask:$u"
                  bad=1
                fi
              done
            fi
            exit $bad
          - sh
          - "{{ cis_svc_packages | join(' ') }}"
          - "{{ cis_svc_units | join(' ') }}"
          - "{{ cis_svc_want | default([]) | join(' ') }}"
      register: cis_svc_check
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "{{ cis_svc_id ~ ' - Remove the ' ~ cis_svc_name ~ ' packages nothing else needs' }}"
      ansible.builtin.dnf:
        name: "{{ cis_svc_check.stdout_lines | select('match', '^remove:') | map('regex_replace', '^remove:', '') | list }}"
        state: absent
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - cis_svc_check.rc != 0
        - cis_svc_check.stdout_lines | select('match', '^remove:') | list | length > 0

    - name: "{{ cis_svc_id ~ ' - Install the ' ~ cis_svc_name ~ ' packages the site wants' }}"
      ansible.builtin.dnf:
        name: "{{ cis_svc_check.stdout_lines | select('match', '^install:') | map('regex_replace', '^install:', '') | list }}"
        state: present
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - cis_svc_check.stdout_lines | select('match', '^install:') | list | length > 0

    - name: "{{ cis_svc_id ~ ' - Check which ' ~ cis_svc_name ~ ' units remain' }}"
      ansible.builtin.command:
        argv: *cis_svc_argv
      register: cis_svc_units_left
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - cis_svc_check.rc != 0

    - name: "{{ cis_svc_id ~ ' - Stop and mask the ' ~ cis_svc_name ~ ' units' }}"
      ansible.builtin.systemd:
        name: "{{ item | regex_replace('^mask:', '') }}"
        state: stopped
        masked: true
      loop: "{{ cis_svc_units_left.stdout_lines | select('match', '^mask:') | list }}"
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - cis_svc_check.rc != 0

    - name: "{{ cis_svc_id ~ ' - Check again after the fix' }}"
      ansible.builtin.command:
        argv: *cis_svc_argv
      register: cis_svc_recheck
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode
        - cis_svc_check.rc != 0 or (cis_svc_check.stdout_lines | select('match', '^install:') | list | length > 0)

    - name: "{{ cis_svc_id ~ ' - Record the finding when the check fails in audit mode' }}"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "{{ cis_svc_id }}"
      when:
        - cis_audit_only | bool
        - cis_svc_check.rc != 0

    # Under --check the fix does not happen, so the second check says nothing new.
    - name: "{{ cis_svc_id ~ ' - Record the finding when the fix did not take effect' }}"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "{{ cis_svc_id }}"
      when:
        - cis_svc_recheck is not skipped
        - not ansible_check_mode
        - cis_svc_recheck.rc != 0
...
