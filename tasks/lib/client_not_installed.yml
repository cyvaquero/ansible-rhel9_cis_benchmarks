---
# Shared logic for the "client not installed" controls (2.2.1 to 2.2.4). A control file
# imports this with:
#   cis_client_id        the CIS ID, for the task names and the finding
#   cis_client_name      a short label for the task names
#   cis_client_packages  the client packages
# and puts the tags, which every task here inherits, on the import.
#
# Decision, made on the host at run time with read-only commands, with the same rpm erase
# test as tasks/lib/service_not_in_use.yml (kept in step with it by hand: that file is
# not shared, so its behavior stays as it was):
# - A listed package that is installed and that no other installed package needs is
#   removed with dnf. A package that something else needs is kept, because dependents are
#   never removed, and that is a finding.
#
# The check prints remove:<package> (to be removed) and keep:<package> (needed by another
# package); its exit status is 1 when it printed either. Audit mode only runs the check and
# records a finding. Remediate mode removes the remove: packages, checks again, and records
# a finding when anything still fails (always the case for a kept package), without failing
# the run. Under --check nothing changes and nothing is recorded.
# Needs cis_selected_controls (preflight) and finding.yml.

- name: "{{ cis_client_id ~ ' - Check the ' ~ cis_client_name ~ ' client is not installed' }}"
  ansible.builtin.command:
    argv: &cis_client_argv
      - /bin/sh
      - -c
      - |
        # $1: packages, space separated.
        pkgs=$1
        erase=""
        blocked=""
        for p in $pkgs; do
          rpm -q "$p" >/dev/null 2>&1 && erase="$erase $p"
        done
        while :; do
          set -- $erase
          [ $# -gt 0 ] || break
          out=$(rpm -e --test "$@" 2>&1) && break
          # Failure lines read "<capability> is needed by (installed) <package>".
          caps=$(printf '%s\n' "$out" | sed -n 's/^[[:space:]]*\([^[:space:]][^[:space:]]*\)[[:space:]].*is needed by (installed).*/\1/p' | sort -u)
          drop=""
          for c in $caps; do
            for n in $(rpm -q --qf '%{NAME}\n' --whatprovides "$c" 2>/dev/null); do
              case " $erase " in *" $n "*) drop="$drop $n" ;; esac
            done
          done
          # Failed for a reason we cannot read: keep everything.
          [ -n "$drop" ] || drop=$erase
          new=""
          for p in $erase; do
            case " $drop " in
              *" $p "*) blocked="$blocked $p" ;;
              *) new="$new $p" ;;
            esac
          done
          erase=$new
        done
        bad=0
        for p in $erase; do echo "remove:$p"; bad=1; done
        for p in $blocked; do echo "keep:$p"; bad=1; done
        exit $bad
      - sh
      - "{{ cis_client_packages | join(' ') }}"
  register: cis_client_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: "{{ cis_client_id ~ ' - Remove the ' ~ cis_client_name ~ ' client when nothing else needs it' }}"
  ansible.builtin.dnf:
    name: "{{ cis_client_check.stdout_lines | select('match', '^remove:') | map('regex_replace', '^remove:', '') | list }}"
    state: absent
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - cis_client_check.stdout_lines | select('match', '^remove:') | list | length > 0

- name: "{{ cis_client_id ~ ' - Check again after the fix' }}"
  ansible.builtin.command:
    argv: *cis_client_argv
  register: cis_client_recheck
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - not ansible_check_mode
    - cis_client_check.rc != 0

- name: "{{ cis_client_id ~ ' - Report the client that another package needs' }}"
  ansible.builtin.debug:
    msg: >-
      Kept because another installed package needs it:
      {{ (cis_client_recheck.stdout_lines | default(cis_client_check.stdout_lines))
         | select('match', '^keep:') | map('regex_replace', '^keep:', '') | join(', ') }}
  when:
    - (cis_client_recheck.stdout_lines | default(cis_client_check.stdout_lines)) | select('match', '^keep:') | list | length > 0

- name: "{{ cis_client_id ~ ' - Record the finding when the check fails in audit mode' }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "{{ cis_client_id }}"
  when:
    - cis_audit_only | bool
    - cis_client_check.rc != 0

# Under --check the fix does not happen, so the second check says nothing new.
- name: "{{ cis_client_id ~ ' - Record the finding when the fix did not take effect' }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
  vars:
    cis_finding_id: "{{ cis_client_id }}"
  when:
    - cis_client_recheck is not skipped
    - not ansible_check_mode
    - cis_client_recheck.rc != 0
...
