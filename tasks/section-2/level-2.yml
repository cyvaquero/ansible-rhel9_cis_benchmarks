---
# Section 2, Level 2 controls, one file per control in level-2/.
#
# import_tasks, not include_tasks: see tasks/section-1/level-1.yml.

- name: "2.1.3 - Ensure cockpit services are not in use"
  ansible.builtin.import_tasks: level-2/2.1.3.yml
  when: "'2.1.3' in cis_selected_controls"

- name: "2.1.20 - Ensure a graphical user interface is not in use"
  ansible.builtin.import_tasks: level-2/2.1.20.yml
  when: "'2.1.20' in cis_selected_controls"

- name: "2.1.21 - Ensure X window server services are not in use"
  ansible.builtin.import_tasks: level-2/2.1.21.yml
  when: "'2.1.21' in cis_selected_controls"

- name: "2.1.22 - Ensure Xwayland is not in use"
  ansible.builtin.import_tasks: level-2/2.1.22.yml
  when: "'2.1.22' in cis_selected_controls"

- name: "2.2.2 - Ensure ldap client is not installed"
  ansible.builtin.import_tasks: level-2/2.2.2.yml
  when: "'2.2.2' in cis_selected_controls"
...
