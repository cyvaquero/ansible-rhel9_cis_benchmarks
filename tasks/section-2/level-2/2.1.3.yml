---
# 2.1.3 - cockpit service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_cockpit_installed, cis_cockpit_ws_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.3 - Ensure cockpit services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.3"
    cis_svc_name: "cockpit"
    cis_svc_packages: [cockpit, cockpit-ws]
    cis_svc_want: "{{ (['cockpit'] if cis_cockpit_installed | bool else []) + (['cockpit-ws'] if cis_cockpit_ws_installed | bool else []) }}"
    cis_svc_units: "{{ [] if cis_cockpit_ws_installed | bool else ['cockpit.socket', 'cockpit.service'] }}"
  tags:
    - "2.1.3"
    - section-2
    - level-2
    - server
    - workstation
...
