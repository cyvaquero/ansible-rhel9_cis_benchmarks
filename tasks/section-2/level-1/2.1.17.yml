---
# 2.1.17 - web proxy server service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_squid_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.17 - Ensure web proxy server services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.17"
    cis_svc_name: "web proxy server"
    cis_svc_packages: [squid]
    cis_svc_want: "{{ ['squid'] if cis_squid_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_squid_installed | bool else ['squid.service'] }}"
  tags:
    - "2.1.17"
    - section-2
    - level-1
    - server
    - workstation
...
