---
# 2.1.14 - snmp service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_net_snmp_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.14 - Ensure snmp services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.14"
    cis_svc_name: "snmp"
    cis_svc_packages: [net-snmp]
    cis_svc_want: "{{ ['net-snmp'] if cis_net_snmp_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_net_snmp_installed | bool else ['snmpd.service'] }}"
  tags:
    - "2.1.14"
    - section-2
    - level-1
    - server
    - workstation
...
