---
# 2.4.1.9 - only permitted users may use crontab: the allow file exists, owned by root with group root
# or crontab, mode 0640 or stricter, and the deny file, when present, has the same owner, group
# and mode (the benchmark values the check judges). The role sets the owner, group and mode of
# cis_cron_allow_* (owner, group, mode) exactly on both files, also over a stricter mode. Applies only
# when the cronie package is installed. The logic is shared in tasks/lib/job_allow.yml.
# cis_cron_allow_users lists users to add to the allow file; with the default empty list a new allow file is
# empty, so only root can use crontab.

- name: "2.4.1.9 - Ensure access to crontab is configured"
  ansible.builtin.import_tasks: ../../lib/job_allow.yml
  vars:
    cis_ja_id: "2.4.1.9"
    cis_ja_pkg: cronie
    cis_ja_allow: /etc/cron.allow
    cis_ja_deny: /etc/cron.deny
    cis_ja_owner: "{{ cis_cron_allow_owner }}"
    cis_ja_group: "{{ cis_cron_allow_group }}"
    cis_ja_mode: "{{ cis_cron_allow_mode }}"
    cis_ja_xgroups: "{{ cis_expect_cron_allow_groups }}"
    cis_ja_users: "{{ cis_cron_allow_users }}"
  tags:
    - "2.4.1.9"
    - section-2
    - level-1
    - server
    - workstation
...
