---
# 2.4.1.2 - /etc/crontab is owned by root:root with no permissions for group or other. The logic,
# including how a missing path, a symlink and the cronie package check are treated, is
# shared in tasks/lib/cron_access.yml.

- name: "2.4.1.2 - Ensure access to /etc/crontab is configured"
  ansible.builtin.import_tasks: ../../lib/cron_access.yml
  vars:
    cis_ca_id: "2.4.1.2"
    cis_ca_path: "/etc/crontab"
    cis_ca_type: "file"
  tags:
    - "2.4.1.2"
    - section-2
    - level-1
    - server
    - workstation
...
