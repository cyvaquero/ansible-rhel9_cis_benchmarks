---
# 2.1.10 - network file system service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_nfs_utils_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.10 - Ensure network file system services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.10"
    cis_svc_name: "network file system"
    cis_svc_packages: [nfs-utils]
    cis_svc_want: "{{ ['nfs-utils'] if cis_nfs_utils_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_nfs_utils_installed | bool else ['nfs-server.service'] }}"
  tags:
    - "2.1.10"
    - section-2
    - level-1
    - server
    - workstation
...
