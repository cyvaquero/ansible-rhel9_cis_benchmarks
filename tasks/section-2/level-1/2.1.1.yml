---
# 2.1.1 - autofs service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_autofs_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.1 - Ensure autofs services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.1"
    cis_svc_name: "autofs"
    cis_svc_packages: [autofs]
    cis_svc_want: "{{ ['autofs'] if cis_autofs_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_autofs_installed | bool else ['autofs.service'] }}"
  tags:
    - "2.1.1"
    - section-2
    - level-1
    - level-2
    - server
    - workstation
...
