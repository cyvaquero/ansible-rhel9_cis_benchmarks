---
# 2.1.6 - dnsmasq service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_dnsmasq_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.6 - Ensure dnsmasq services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.6"
    cis_svc_name: "dnsmasq"
    cis_svc_packages: [dnsmasq]
    cis_svc_want: "{{ ['dnsmasq'] if cis_dnsmasq_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_dnsmasq_installed | bool else ['dnsmasq.service'] }}"
  tags:
    - "2.1.6"
    - section-2
    - level-1
    - server
    - workstation
...
