  vars:
    cis_svc_id: "2.1.4"
    cis_svc_name: "dhcp server"
    cis_svc_packages: [dhcp-server]
    cis_svc_units: [dhcpd.service, dhcpd6.service]
  tags:
    - "2.1.4"
    - section-2
    - level-1
    - server
    - workstation
...
