---
# 2.4.2.1 - only permitted users may use at: the allow file exists, owned by root with group root
# or daemon, mode 0640 or stricter, and the deny file, when present, has the same owner, group
# and mode (the benchmark values the check judges). The role sets the owner, group and mode of
# cis_at_allow_* (owner, group, mode) exactly on both files, also over a stricter mode. Applies only
# when the at package is installed. The logic is shared in tasks/lib/job_allow.yml.
# cis_at_allow_users lists users to add to the allow file; with the default empty list a new allow file is
# empty, so only root can use at.

# The at package (cis_at_installed): null (default) leaves it alone; true installs it when missing;
# false removes it if no installed package needs it (an rpm erase test decides, dependents are
# never removed), otherwise it stays and atd is stopped and masked. The control then judges the
# benchmark as usual (without the package it passes).
- name: "2.4.2.1 - Check at is installed"
  ansible.builtin.command:
    argv:
      - rpm
      - -q
      - at
  register: cis_check_2_4_2_1_pkg
  changed_when: false
  check_mode: false
  failed_when: false
  when: cis_at_installed is not none
  tags: &cis_tags_2_4_2_1
    - "2.4.2.1"
    - section-2
    - level-1
    - server
    - workstation

- name: "2.4.2.1 - Install at"
  ansible.builtin.dnf:
    name: at
    state: present
  when:
    - not (cis_audit_only | bool)
    - cis_at_installed is not none
    - cis_at_installed | bool
    - cis_check_2_4_2_1_pkg.rc != 0
  tags: *cis_tags_2_4_2_1

- name: "2.4.2.1 - Check whether another package needs at"
  ansible.builtin.command:
    argv:
      - rpm
      - -e
      - --test
      - at
  register: cis_check_2_4_2_1_erase
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - not (cis_audit_only | bool)
    - cis_at_installed is not none
    - not (cis_at_installed | bool)
    - cis_check_2_4_2_1_pkg.rc == 0
  tags: *cis_tags_2_4_2_1

- name: "2.4.2.1 - Remove at"
  ansible.builtin.dnf:
    name: at
    state: absent
  when:
    - cis_check_2_4_2_1_erase is not skipped
    - cis_check_2_4_2_1_erase.rc == 0
  tags: *cis_tags_2_4_2_1

- name: "2.4.2.1 - Stop and mask atd because another package needs at"
  ansible.builtin.systemd:
    name: atd
    state: stopped
    masked: true
  failed_when: false
  when:
    - cis_check_2_4_2_1_erase is not skipped
    - cis_check_2_4_2_1_erase.rc != 0
  tags: *cis_tags_2_4_2_1

- name: "2.4.2.1 - Report that at was kept"
  ansible.builtin.debug:
    msg: "at stays installed because another installed package needs it; atd is stopped and masked instead."
  when:
    - cis_check_2_4_2_1_erase is not skipped
    - cis_check_2_4_2_1_erase.rc != 0
  tags: *cis_tags_2_4_2_1

- name: "2.4.2.1 - Ensure access to at is configured"
  ansible.builtin.import_tasks: ../../lib/job_allow.yml
  vars:
    cis_ja_id: "2.4.2.1"
    cis_ja_pkg: at
    cis_ja_allow: /etc/at.allow
    cis_ja_deny: /etc/at.deny
    cis_ja_owner: "{{ cis_at_allow_owner }}"
    cis_ja_group: "{{ cis_at_allow_group }}"
    cis_ja_mode: "{{ cis_at_allow_mode }}"
    cis_ja_xgroups: "{{ cis_expect_at_allow_groups }}"
    cis_ja_users: "{{ cis_at_allow_users }}"
  tags: *cis_tags_2_4_2_1
...
