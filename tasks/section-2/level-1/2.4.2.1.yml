---
# 2.4.2.1 - only permitted users may use at: /etc/at.allow exists, owned by root with group
# root or daemon, mode 0640 or stricter, and /etc/at.deny, when present, has the same owner,
# group and mode. Applies only when the at package is installed. The logic is shared in
# tasks/lib/job_allow.yml. cis_at_allow_users lists users to add to at.allow; with the
# default empty list a new at.allow is empty, so only root can use at.

- name: "2.4.2.1 - Ensure access to at is configured"
  ansible.builtin.import_tasks: ../../lib/job_allow.yml
  vars:
    cis_ja_id: "2.4.2.1"
    cis_ja_pkg: at
    cis_ja_allow: /etc/at.allow
    cis_ja_deny: /etc/at.deny
    cis_ja_group: daemon
    cis_ja_users: "{{ cis_at_allow_users }}"
  tags:
    - "2.4.2.1"
    - section-2
    - level-1
    - server
    - workstation
...
