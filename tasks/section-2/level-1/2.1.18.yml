---
# 2.1.18 - web server service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_httpd_installed, cis_nginx_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.18 - Ensure web server services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.18"
    cis_svc_name: "web server"
    cis_svc_packages: [httpd, nginx]
    cis_svc_want: "{{ (['httpd'] if cis_httpd_installed | bool else []) + (['nginx'] if cis_nginx_installed | bool else []) }}"
    cis_svc_units: "{{ ([] if cis_httpd_installed | bool else ['httpd.socket', 'httpd.service']) + ([] if cis_nginx_installed | bool else ['nginx.service']) }}"
  tags:
    - "2.1.18"
    - section-2
    - level-1
    - server
    - workstation
...
