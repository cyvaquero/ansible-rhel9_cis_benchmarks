---
# 2.2.1 - ftp client not installed. The logic is shared in tasks/lib/client_not_installed.yml:
# the package is removed when nothing else installed needs it, otherwise it stays and is a
# finding.

- name: "2.2.1 - Ensure ftp client is not installed"
  ansible.builtin.import_tasks: ../../lib/client_not_installed.yml
  vars:
    cis_client_id: "2.2.1"
    cis_client_name: "ftp"
    cis_client_packages: [ftp]
  tags:
    - "2.2.1"
    - section-2
    - level-1
    - server
    - workstation
...
