    cis_svc_name: "avahi daemon"
    cis_svc_packages: [avahi]
    cis_svc_units: [avahi-daemon.socket, avahi-daemon.service]
  tags:
    - "2.1.2"
    - section-2
    - level-1
    - level-2
    - server
    - workstation
