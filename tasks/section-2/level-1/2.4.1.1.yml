---
# 2.4.1.1 - the cron daemon (crond) is enabled and active. Applies only when cronie is
# installed; without it the control is compliant and nothing is installed. The check judges
# the benchmark (cis_expect_crond_enabled and _active). The fix makes crond enabled and active
# exactly as cis_crond_enabled and cis_crond_active say: it unmasks, enables and starts it, or
# stops and disables it, whenever it differs. A control that is not compliant with the
# benchmark after the fix is a finding, so a site value of false is found on every run; under
# --check nothing changes and nothing is recorded in remediate mode.
#
# cis_cronie_installed says whether cronie should be installed (see below). A cronie that is kept
# because another package needs it leaves crond masked, and then the control reports the
# benchmark finding.
#
# The check prints state=ok or state=bad (the benchmark verdict) and site=ok or site=bad
# (whether crond is enabled, not masked when wanted, and active as the site wants); its exit
# status is 1 when state=bad.

- name: "2.4.1.1 - Handle the cron daemon"
  tags:
    - "2.4.1.1"
    - section-2
    - level-1
    - server
    - workstation
  block:
    # The cronie package (cis_cronie_installed, default null: leave it alone, since the benchmark
# judges cron only when it is installed): installed when wanted and missing; when not
    # wanted it is removed if no installed package needs it (an rpm erase test decides,
    # dependents are never removed), otherwise it stays and crond is stopped and masked, and the
    # fix below leaves that mask alone. The cron controls then judge the benchmark as usual.
    - name: "2.4.1.1 - Check cronie is installed"
      ansible.builtin.command:
        argv:
          - rpm
          - -q
          - cronie
      register: cis_check_2_4_1_1_pkg
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "2.4.1.1 - Install cronie"
      ansible.builtin.dnf:
        name: cronie
        state: present
      when:
        - not (cis_audit_only | bool)
        - cis_cronie_installed is not none
        - cis_cronie_installed | bool
        - cis_check_2_4_1_1_pkg.rc != 0

    - name: "2.4.1.1 - Check whether another package needs cronie"
      ansible.builtin.command:
        argv:
          - rpm
          - -e
          - --test
          - cronie
      register: cis_check_2_4_1_1_erase
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - cis_cronie_installed is not none
        - not (cis_cronie_installed | bool)
        - cis_check_2_4_1_1_pkg.rc == 0

    - name: "2.4.1.1 - Remove cronie"
      ansible.builtin.dnf:
        name: cronie
        state: absent
      when:
        - cis_check_2_4_1_1_erase is not skipped
        - cis_check_2_4_1_1_erase.rc == 0

    - name: "2.4.1.1 - Stop and mask crond because another package needs cronie"
      ansible.builtin.systemd:
        name: crond
        state: stopped
        masked: true
      failed_when: false
      when:
        - cis_check_2_4_1_1_erase is not skipped
        - cis_check_2_4_1_1_erase.rc != 0

    - name: "2.4.1.1 - Report that cronie was kept"
      ansible.builtin.debug:
        msg: >-
          cronie stays installed because another installed package needs it; crond is
          stopped and masked instead.
      when:
        - cis_check_2_4_1_1_erase is not skipped
        - cis_check_2_4_1_1_erase.rc != 0

    - name: "2.4.1.1 - Check the cron daemon is enabled and active"
      ansible.builtin.command:
        argv: &cis_crond_argv
          - /bin/sh
          - -c
          - |
            # $1, $2: enabled and active as the benchmark wants (yes or no); $3, $4: as the site wants.
            rpm -q cronie >/dev/null 2>&1 || { echo "state=ok"; exit 0; }
            en=$(systemctl is-enabled crond 2>/dev/null)
            if [ "$en" = enabled ]; then ens=yes; else ens=no; fi
            if systemctl is-active --quiet crond 2>/dev/null; then acs=yes; else acs=no; fi
            site=ok
            [ "$ens" = "$3" ] && [ "$acs" = "$4" ] || site=bad
            if [ "$en" = masked ] && { [ "$3" = yes ] || [ "$4" = yes ]; }; then site=bad; fi
            echo "site=$site"
            if [ "$ens" = "$1" ] && [ "$acs" = "$2" ]; then
              echo "state=ok"
              exit 0
            fi
            echo "state=bad"
            exit 1
          - sh
          - "{{ 'yes' if cis_expect_crond_enabled | bool else 'no' }}"
          - "{{ 'yes' if cis_expect_crond_active | bool else 'no' }}"
          - "{{ 'yes' if cis_crond_enabled | bool else 'no' }}"
          - "{{ 'yes' if cis_crond_active | bool else 'no' }}"
      register: cis_check_2_4_1_1
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "2.4.1.1 - Make the cron daemon enabled and active as the site wants"
      ansible.builtin.systemd:
        name: crond
        masked: "{{ false if (cis_crond_enabled | bool or cis_crond_active | bool) else omit }}"
        enabled: "{{ cis_crond_enabled | bool }}"
        state: "{{ 'started' if cis_crond_active | bool else 'stopped' }}"
      when:
        - not (cis_audit_only | bool)
        - cis_cronie_installed is none or cis_cronie_installed | bool
        - "'site=bad' in cis_check_2_4_1_1.stdout_lines"

    - name: "2.4.1.1 - Check again after the fix"
      ansible.builtin.command:
        argv: *cis_crond_argv
      register: cis_recheck_2_4_1_1
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode
        - cis_cronie_installed is none or cis_cronie_installed | bool
        - "'site=bad' in cis_check_2_4_1_1.stdout_lines"

    - name: "2.4.1.1 - Record the finding when the check fails in audit mode"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "2.4.1.1"
      when:
        - cis_audit_only | bool
        - cis_check_2_4_1_1.rc != 0

    # Under --check the fix does not happen, so the second check says nothing new.
    - name: "2.4.1.1 - Record the finding when the fix did not take effect"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "2.4.1.1"
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode
        - (cis_recheck_2_4_1_1.rc | default(cis_check_2_4_1_1.rc)) != 0
...
