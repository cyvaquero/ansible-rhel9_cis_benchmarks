---
# 2.1.16 - tftp server service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_tftp_server_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.16 - Ensure tftp server services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.16"
    cis_svc_name: "tftp server"
    cis_svc_packages: [tftp-server]
    cis_svc_want: "{{ ['tftp-server'] if cis_tftp_server_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_tftp_server_installed | bool else ['tftp.socket', 'tftp.service'] }}"
  tags:
    - "2.1.16"
    - section-2
    - level-1
    - server
    - workstation
...
