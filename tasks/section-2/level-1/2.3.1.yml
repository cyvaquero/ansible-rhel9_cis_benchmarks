---
# 2.3.1 - time synchronization is in use: chrony is installed. Remediate mode installs it
# with dnf; audit mode records a finding. The service state and the configuration are for
# 2.3.2 and 2.3.3 and the host's own setup. Under --check nothing changes and nothing is
# recorded in remediate mode.

- name: "2.3.1 - Handle chrony"
  tags:
    - "2.3.1"
    - section-2
    - level-1
    - server
    - workstation
  block:
    - name: "2.3.1 - Check chrony is installed"
      ansible.builtin.command:
        argv: &cis_chrony_pkg_argv
          - rpm
          - -q
          - chrony
      register: cis_check_2_3_1
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "2.3.1 - Install chrony"
      ansible.builtin.dnf:
        name: chrony
        state: present
      when:
        - not (cis_audit_only | bool)
        - cis_check_2_3_1.rc != 0

    - name: "2.3.1 - Check again after the fix"
      ansible.builtin.command:
        argv: *cis_chrony_pkg_argv
      register: cis_recheck_2_3_1
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode
        - cis_check_2_3_1.rc != 0

    - name: "2.3.1 - Record the finding when the check fails in audit mode"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "2.3.1"
      when:
        - cis_audit_only | bool
        - cis_check_2_3_1.rc != 0

    # Under --check the fix does not happen, so the second check says nothing new.
    - name: "2.3.1 - Record the finding when the fix did not take effect"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "2.3.1"
      when:
        - cis_recheck_2_3_1 is not skipped
        - not ansible_check_mode
        - cis_recheck_2_3_1.rc != 0
...
