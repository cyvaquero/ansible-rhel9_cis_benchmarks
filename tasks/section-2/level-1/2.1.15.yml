---
# 2.1.15 - telnet server service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_telnet_server_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.15 - Ensure telnet server services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.15"
    cis_svc_name: "telnet server"
    cis_svc_packages: [telnet-server]
    cis_svc_want: "{{ ['telnet-server'] if cis_telnet_server_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_telnet_server_installed | bool else ['telnet.socket'] }}"
  tags:
    - "2.1.15"
    - section-2
    - level-1
    - server
    - workstation
...
