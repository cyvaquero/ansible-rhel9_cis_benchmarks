---
# 2.4.1.6 - /etc/cron.monthly is owned by root:root with no permissions for group or other (the benchmark
# value the check judges). The role sets the owner, group and mode of cis_cron_owner,
# cis_cron_group and cis_cron_dir_mode exactly, also over a stricter mode. The logic, including how a
# missing path, a symlink and the cronie package check are treated, is shared in
# tasks/lib/cron_access.yml.

- name: "2.4.1.6 - Ensure access to /etc/cron.monthly is configured"
  ansible.builtin.import_tasks: ../../lib/cron_access.yml
  vars:
    cis_ca_id: "2.4.1.6"
    cis_ca_path: "/etc/cron.monthly"
    cis_ca_type: "directory"
  tags:
    - "2.4.1.6"
    - section-2
    - level-1
    - server
    - workstation
...
