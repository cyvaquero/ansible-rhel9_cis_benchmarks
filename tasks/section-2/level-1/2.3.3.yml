---
# 2.3.3 - chronyd does not run as root: the last OPTIONS= assignment in
# /etc/sysconfig/chronyd has no "-u root" option (also written "-uroot"). A missing file or
# assignment is compliant: chronyd then runs as its built-in default user, chrony. The check
# judges the benchmark (cis_expect_chronyd_run_as_root).
#
# The fix makes the options match cis_chronyd_run_as_root. false (default): rewrite the
# assignment as OPTIONS="<value>" with just the "-u root" option removed and every other option
# kept. true: rewrite it with every -u option dropped and "-u root" last (the assignment is
# created when missing). chronyd is restarted only when it is running. The check works out the
# new value itself and prints it, so the edit is the same in --check. Nothing is read by
# sourcing the file. A control that is not compliant with the benchmark after the fix is a
# finding (a site value of true is found on every run); under --check nothing changes and
# nothing is recorded in remediate mode.
#
# The check prints state=ok or state=bad (the benchmark verdict), set=yes or set=no (whether the
# file differs from what the site wants), new=<value> when set=yes, and active=yes when chronyd
# is running; its exit status is 1 when state=bad.

- name: "2.3.3 - Handle the chronyd options"
  tags:
    - "2.3.3"
    - section-2
    - level-1
    - server
    - workstation
  block:
    - name: "2.3.3 - Check chronyd does not run as root"
      ansible.builtin.command:
        argv: &cis_chrony_opt_argv
          - /bin/bash
          - -c
          - |
            set -u
            f=$1; want=$2; expect=$3
            set -f
            val=""
            if [ -f "$f" ]; then
              line=$(grep -E '^[[:space:]]*OPTIONS=' "$f" | tail -n 1)
              if [ -n "$line" ]; then
                val=${line#*OPTIONS=}
                case "$val" in
                  \"*) val=${val#\"}; val=${val%%\"*} ;;
                  \'*) val=${val#\'}; val=${val%%\'*} ;;
                esac
              fi
            fi
            out=""
            nou=""
            cur=""
            bad=0
            skip=0
            for t in $val; do
              cur="$cur $t"
              if [ "$skip" = 1 ]; then
                skip=0
                case "$t" in root|\"root\"|\'root\') bad=1; continue ;; esac
                out="$out -u $t"
                continue
              fi
              case "$t" in
                -u) skip=1; continue ;;
                -uroot) bad=1; continue ;;
                -u*) out="$out $t"; continue ;;
              esac
              out="$out $t"
              nou="$nou $t"
            done
            # A trailing -u with no value stays as it was.
            [ "$skip" = 1 ] && out="$out -u"
            out=${out# }
            nou=${nou# }
            cur=${cur# }
            if [ "$want" = yes ]; then
              new="${nou:+$nou }-u root"
              if [ "$cur" = "$new" ]; then chg=no; else chg=yes; fi
            else
              new=$out
              if [ "$bad" = 1 ]; then chg=yes; else chg=no; fi
            fi
            systemctl is-active --quiet chronyd 2>/dev/null && echo "active=yes"
            [ "$chg" = yes ] && echo "new=$new"
            echo "set=$chg"
            if [ "$bad" = 1 ]; then root=yes; else root=no; fi
            if [ "$root" != "$expect" ]; then echo "state=bad"; exit 1; fi
            echo "state=ok"
          - bash
          - /etc/sysconfig/chronyd
          - "{{ 'yes' if cis_chronyd_run_as_root | bool else 'no' }}"
          - "{{ 'yes' if cis_expect_chronyd_run_as_root | bool else 'no' }}"
      register: cis_check_2_3_3
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "2.3.3 - Set the chronyd options as the site wants"
      ansible.builtin.lineinfile:  # noqa: risky-file-permissions
        path: /etc/sysconfig/chronyd
        regexp: '^\s*OPTIONS='
        line: >-
          OPTIONS="{{ cis_check_2_3_3.stdout_lines | select('match', '^new=') | first | regex_replace('^new=', '') }}"
        create: "{{ cis_chronyd_run_as_root | bool }}"  # a missing file is created only to add the root option
      register: cis_fix_2_3_3
      when:
        - not (cis_audit_only | bool)
        - "'set=yes' in cis_check_2_3_3.stdout_lines"

    # A running chronyd keeps its old user until it restarts.
    - name: "2.3.3 - Restart chronyd when it is running"
      ansible.builtin.systemd:
        name: chronyd
        state: restarted
      when:
        - cis_fix_2_3_3 is changed
        - "'active=yes' in cis_check_2_3_3.stdout_lines"

    - name: "2.3.3 - Check again after the fix"
      ansible.builtin.command:
        argv: *cis_chrony_opt_argv
      register: cis_recheck_2_3_3
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode
        - "'set=yes' in cis_check_2_3_3.stdout_lines"

    - name: "2.3.3 - Record the finding when the check fails in audit mode"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "2.3.3"
      when:
        - cis_audit_only | bool
        - cis_check_2_3_3.rc != 0

    # Under --check the fix does not happen, so the second check says nothing new.
    - name: "2.3.3 - Record the finding when the fix did not take effect"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/finding.yml"
      vars:
        cis_finding_id: "2.3.3"
      when:
        - not (cis_audit_only | bool)
        - not ansible_check_mode
        - (cis_recheck_2_3_3.rc | default(cis_check_2_3_3.rc)) != 0
...
