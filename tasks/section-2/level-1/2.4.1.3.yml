---
# 2.4.1.3 - /etc/cron.hourly is owned by root:root with no permissions for group or other. The logic,
# including how a missing path, a symlink and the cronie package check are treated, is
# shared in tasks/lib/cron_access.yml.

- name: "2.4.1.3 - Ensure access to /etc/cron.hourly is configured"
  ansible.builtin.import_tasks: ../../lib/cron_access.yml
  vars:
    cis_ca_id: "2.4.1.3"
    cis_ca_path: "/etc/cron.hourly"
    cis_ca_type: "directory"
  tags:
    - "2.4.1.3"
    - section-2
    - level-1
    - server
    - workstation
...
