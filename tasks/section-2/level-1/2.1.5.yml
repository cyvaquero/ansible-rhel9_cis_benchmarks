---
# 2.1.5 - dns server service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_bind_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.5 - Ensure dns server services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.5"
    cis_svc_name: "dns server"
    cis_svc_packages: [bind]
    cis_svc_want: "{{ ['bind'] if cis_bind_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_bind_installed | bool else ['named.service'] }}"
  tags:
    - "2.1.5"
    - section-2
    - level-1
    - server
    - workstation
...
