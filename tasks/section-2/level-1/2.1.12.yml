---
# 2.1.12 - rpcbind service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variables (cis_rpcbind_installed) say whether each package should be installed;
# cis_services_keep skips the control.

- name: "2.1.12 - Ensure rpcbind services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "2.1.12"
    cis_svc_name: "rpcbind"
    cis_svc_packages: [rpcbind]
    cis_svc_want: "{{ ['rpcbind'] if cis_rpcbind_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_rpcbind_installed | bool else ['rpcbind.socket', 'rpcbind.service'] }}"
  tags:
    - "2.1.12"
    - section-2
    - level-1
    - server
    - workstation
...
