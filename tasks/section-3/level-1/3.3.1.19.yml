---
# 3.3.1.19 - net.ipv4.conf.all.route_localnet is held at
# cis_sysctl_net_ipv4_conf_all_route_localnet (default 0), both running and in the configuration;
# the finding is judged against the benchmark value (cis_expect_sysctl). The logic is shared in tasks/lib/sysctl.yml.

- name: "3.3.1.19 - Ensure net.ipv4.conf.all.route_localnet is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.19"
    cis_sc_key: "net.ipv4.conf.all.route_localnet"
    cis_sc_ok: "{{ cis_expect_sysctl['net.ipv4.conf.all.route_localnet'] }}"
    cis_sc_enforce: true
    cis_sc_set: "{{ cis_sysctl_net_ipv4_conf_all_route_localnet }}"
  tags:
    - "3.3.1.19"
    - section-3
    - level-1
    - server
    - workstation
...
