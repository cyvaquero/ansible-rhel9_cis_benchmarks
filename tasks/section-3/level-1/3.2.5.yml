---
# 3.2.5 - atm kernel module. The logic is shared in tasks/lib/kernel_module.yml.
# cis_module_atm_blocked says whether the role blocks the module; the check judges the
# benchmark state either way.

- name: "3.2.5 - Ensure the atm kernel module is not available"
  ansible.builtin.import_tasks: ../../lib/kernel_module.yml
  vars:
    cis_km_id: "3.2.5"
    cis_km_module: "atm"
    cis_km_fix: "{{ cis_module_atm_blocked }}"
  tags:
    - "3.2.5"
    - section-3
    - level-1
    - server
    - workstation
...
