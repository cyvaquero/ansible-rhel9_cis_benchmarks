- name: "3.3.1.15 - Ensure net.ipv4.conf.default.accept_source_route is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.15"
    cis_sc_key: "net.ipv4.conf.default.accept_source_route"
    cis_sc_ok: "{{ cis_expect_sysctl['net.ipv4.conf.default.accept_source_route'] }}"
    cis_sc_enforce: true
    cis_sc_set: "{{ cis_sysctl_net_ipv4_conf_default_accept_source_route }}"
  tags:
    - "3.3.1.15"
    - section-3
    - level-1
    - server
    - workstation
