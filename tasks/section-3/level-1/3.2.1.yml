---
# 3.2.1 - dccp kernel module. The logic is shared in tasks/lib/kernel_module.yml.
# cis_module_dccp_blocked says whether the role blocks the module; the check judges the
# benchmark state either way.

- name: "3.2.1 - Ensure the dccp kernel module is not available"
  ansible.builtin.import_tasks: ../../lib/kernel_module.yml
  vars:
    cis_km_id: "3.2.1"
    cis_km_module: "dccp"
    cis_km_fix: "{{ cis_module_dccp_blocked }}"
  tags:
    - "3.2.1"
    - section-3
    - level-1
    - server
    - workstation
...
