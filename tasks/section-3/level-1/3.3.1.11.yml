---
# 3.3.1.11 - net.ipv4.conf.default.secure_redirects is held at
# cis_sysctl_net_ipv4_conf_default_secure_redirects (default 0), both running and in the configuration;
# the finding is judged against the benchmark value (cis_expect_sysctl). The logic is shared in tasks/lib/sysctl.yml.

- name: "3.3.1.11 - Ensure net.ipv4.conf.default.secure_redirects is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.11"
    cis_sc_key: "net.ipv4.conf.default.secure_redirects"
    cis_sc_ok: "{{ cis_expect_sysctl['net.ipv4.conf.default.secure_redirects'] }}"
    cis_sc_enforce: true
    cis_sc_set: "{{ cis_sysctl_net_ipv4_conf_default_secure_redirects }}"
  tags:
    - "3.3.1.11"
    - section-3
    - level-1
    - server
    - workstation
...
