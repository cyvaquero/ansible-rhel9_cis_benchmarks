---
# 3.3.1.1 - net.ipv4.ip_forward is held at
# cis_sysctl_net_ipv4_ip_forward (default 0), both running and in the configuration;
# the finding is judged against the benchmark value (cis_expect_sysctl). The logic is shared in tasks/lib/sysctl.yml.

- name: "3.3.1.1 - Ensure net.ipv4.ip_forward is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.1"
    cis_sc_key: "net.ipv4.ip_forward"
    cis_sc_ok: "{{ cis_expect_sysctl['net.ipv4.ip_forward'] }}"
    cis_sc_enforce: true
    cis_sc_set: "{{ cis_sysctl_net_ipv4_ip_forward }}"
  tags:
    - "3.3.1.1"
    - section-3
    - level-1
    - level-2
    - server
    - workstation
...
