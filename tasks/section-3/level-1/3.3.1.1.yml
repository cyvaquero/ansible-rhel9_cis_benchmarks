---
# 3.3.1.1 - net.ipv4.ip_forward is set to 0, both running and in the configuration. The logic is shared in tasks/lib/sysctl.yml.

- name: "3.3.1.1 - Ensure net.ipv4.ip_forward is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.1"
    cis_sc_key: "net.ipv4.ip_forward"
    cis_sc_ok: ["0"]
    cis_sc_set: "0"
  tags:
    - "3.3.1.1"
    - section-3
    - level-1
    - level-2
    - server
    - workstation
...
