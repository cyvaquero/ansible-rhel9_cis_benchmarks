---
# 3.3.2.2 - net.ipv6.conf.default.forwarding is held at
# cis_sysctl_net_ipv6_conf_default_forwarding (default 0), both running and in the configuration;
# the finding is judged against the benchmark value (cis_expect_sysctl).
# Only when IPv6 is enabled (cis_ipv6_disabled from preflight); on a host with IPv6
# disabled the control is skipped with no finding. The logic is shared in
# tasks/lib/sysctl.yml.

- name: "3.3.2.2 - Ensure net.ipv6.conf.default.forwarding is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.2.2"
    cis_sc_key: "net.ipv6.conf.default.forwarding"
    cis_sc_ok: "{{ cis_expect_sysctl['net.ipv6.conf.default.forwarding'] }}"
    cis_sc_enforce: true
    cis_sc_set: "{{ cis_sysctl_net_ipv6_conf_default_forwarding }}"
  when: not (cis_ipv6_disabled | bool)
  tags:
    - "3.3.2.2"
    - section-3
    - level-1
    - server
    - workstation
...
