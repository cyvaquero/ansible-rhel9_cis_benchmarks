# 3.3.1.7 - net.ipv4.icmp_echo_ignore_broadcasts is set to 1, both running and in the configuration. The logic is shared in tasks/lib/sysctl.yml.

- name: "3.3.1.7 - Ensure net.ipv4.icmp_echo_ignore_broadcasts is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.7"
    cis_sc_key: "net.ipv4.icmp_echo_ignore_broadcasts"
    cis_sc_ok: ["1"]
    cis_sc_set: "1"
  tags:
    - "3.3.1.7"
    - section-3
    - level-1
    - server
    - workstation
...
