---
# 3.3.1.7 - net.ipv4.icmp_echo_ignore_broadcasts is held at
# cis_sysctl_net_ipv4_icmp_echo_ignore_broadcasts (default 1), both running and in the configuration;
# the finding is judged against the benchmark value (cis_expect_sysctl). The logic is shared in tasks/lib/sysctl.yml.

- name: "3.3.1.7 - Ensure net.ipv4.icmp_echo_ignore_broadcasts is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.7"
    cis_sc_key: "net.ipv4.icmp_echo_ignore_broadcasts"
    cis_sc_ok: "{{ cis_expect_sysctl['net.ipv4.icmp_echo_ignore_broadcasts'] }}"
    cis_sc_enforce: true
    cis_sc_set: "{{ cis_sysctl_net_ipv4_icmp_echo_ignore_broadcasts }}"
  tags:
    - "3.3.1.7"
    - section-3
    - level-1
    - server
    - workstation
...
