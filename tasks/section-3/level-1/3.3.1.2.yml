---
# 3.3.1.2 - net.ipv4.conf.all.forwarding is held at
# cis_sysctl_net_ipv4_conf_all_forwarding (default 0), both running and in the configuration;
# the finding is judged against the benchmark value (cis_expect_sysctl). The logic is shared in tasks/lib/sysctl.yml.

- name: "3.3.1.2 - Ensure net.ipv4.conf.all.forwarding is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.2"
    cis_sc_key: "net.ipv4.conf.all.forwarding"
    cis_sc_ok: "{{ cis_expect_sysctl['net.ipv4.conf.all.forwarding'] }}"
    cis_sc_enforce: true
    cis_sc_set: "{{ cis_sysctl_net_ipv4_conf_all_forwarding }}"
  tags:
    - "3.3.1.2"
    - section-3
    - level-1
    - server
    - workstation
...
