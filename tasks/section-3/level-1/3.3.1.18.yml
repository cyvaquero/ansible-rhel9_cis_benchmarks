---
# 3.3.1.18 - net.ipv4.tcp_syncookies is held at
# cis_sysctl_net_ipv4_tcp_syncookies (default 1), both running and in the configuration;
# the finding is judged against the benchmark value (cis_expect_sysctl). The logic is shared in tasks/lib/sysctl.yml.

- name: "3.3.1.18 - Ensure net.ipv4.tcp_syncookies is configured"
  ansible.builtin.import_tasks: ../../lib/sysctl.yml
  vars:
    cis_sc_id: "3.3.1.18"
    cis_sc_key: "net.ipv4.tcp_syncookies"
    cis_sc_ok: "{{ cis_expect_sysctl['net.ipv4.tcp_syncookies'] }}"
    cis_sc_enforce: true
    cis_sc_set: "{{ cis_sysctl_net_ipv4_tcp_syncookies }}"
  tags:
    - "3.3.1.18"
    - section-3
    - level-1
    - server
    - workstation
...
