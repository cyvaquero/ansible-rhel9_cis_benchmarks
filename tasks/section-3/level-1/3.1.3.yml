---
# 3.1.3 - bluetooth service not in use. The logic is shared in tasks/lib/service_not_in_use.yml.
# The package variable (cis_bluez_installed) says whether bluez should be installed;
# cis_services_keep skips the control.

- name: "3.1.3 - Ensure bluetooth services are not in use"
  ansible.builtin.import_tasks: ../../lib/service_not_in_use.yml
  vars:
    cis_svc_id: "3.1.3"
    cis_svc_name: "bluetooth"
    cis_svc_packages: [bluez]
    cis_svc_want: "{{ ['bluez'] if cis_bluez_installed | bool else [] }}"
    cis_svc_units: "{{ [] if cis_bluez_installed | bool else ['bluetooth.service'] }}"
  tags:
    - "3.1.3"
    - section-3
    - level-1
    - level-2
    - server
    - workstation
...
