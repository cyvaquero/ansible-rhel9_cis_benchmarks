---
name: Lint

"on":
  push:
    branches: [develop, main, "release/**", "feature/**", "bugfix/**", "hotfix/**"]
  pull_request:
    branches: [develop, main, "release/**", "feature/**", "bugfix/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.9"
      - name: Install the pinned toolchain
        run: python -m pip install -r tests/requirements.txt
      - name: Make the role resolvable by name
        run: |
          mkdir -p "$RUNNER_TEMP/roles"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/roles/rhel9_cis_benchmarks"
          echo "ANSIBLE_ROLES_PATH=$RUNNER_TEMP/roles" >> "$GITHUB_ENV"
      - name: ansible-lint
        run: ansible-lint
      - name: Check that the controls and the benchmark version agree
        run: |
          python tests/check_controls.py
          python tests/check_benchmark_version.py
      - name: Test the sudoers scanner
        run: python tests/check_sudoers_scan.py
      - name: Test the PAM scanner
        run: python tests/check_pam_scan.py
      - name: Test the accounts scanner
        run: python tests/check_accounts_scan.py
      - name: Syntax check
        run: ansible-playbook -i localhost, -e target=localhost --syntax-check tests/syntax.yml
...
