---
# Internal constants for rhel9_cis_benchmarks. Not meant to be overridden.

# The benchmark document this role implements, from its cover page. Preflight and the
# end-of-run summary print the title and version. The version must match the header of
# docs/controls.md and the version prefix of the newest CHANGELOG entry
# (tests/check_benchmark_version.py checks all three).
cis_benchmark:
  title: "CIS Red Hat Enterprise Linux 9 Benchmark"
  version: "3.0.0"
  date: "2026-08-28"

# Preflight: the only platform this role supports.
cis_supported_distribution: RedHat
cis_supported_major_version: "9"

# Selection: the profiles cis_profile accepts. The per-control levels are in
# vars/controls.yml, which preflight loads.
cis_valid_profiles:
  - server
  - workstation

# Section 5.1 (SSH server): the one drop-in the role owns. Its name sorts before
# 50-redhat.conf, because sshd uses the first value it reads for most keywords (MaxStartups
# takes the last value, so a later file can override it).
cis_sshd_dropin: /etc/ssh/sshd_config.d/00-cis-rhel9.conf

# Section 5.2 (sudo): the one sudoers drop-in the role owns. sudo applies the last Defaults
# line it reads and reads /etc/sudoers.d in name order (names with a dot or a trailing ~ are
# skipped), so the name sorts after the usual ones and the role's Defaults win over those of
# the files that sort before it. A Defaults line after the #includedir line in /etc/sudoers
# is read later still and would win; the controls report it.
cis_sudoers_dropin: /etc/sudoers.d/zz-cis-rhel9

# Section 5.2: the Python the sudo controls run their read-only scanner with
# (files/sudoers_scan.py): the interpreter Ansible found on the managed node.
cis_sudo_python: "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"

# Section 5.3 (PAM): the pwquality drop-in the role owns. libpwquality reads pwquality.conf and
# then the files of pwquality.conf.d in name order and the last value of a key wins, so the name
# sorts after the usual ones; a file that sorts after it would win and the controls report it.
cis_pwquality_dropin: /etc/security/pwquality.conf.d/zz-cis-rhel9.conf

# Section 5.3: the Python the PAM controls run their read-only scanner with
# (files/pam_scan.py): the interpreter Ansible found on the managed node.
cis_pam_python: "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"

# Section 5.4 (accounts and environment): the one profile.d file the role owns. 5.4.3.2 (TMOUT)
# and 5.4.3.4 (umask) each keep a marked block in it. /etc/profile reads /etc/profile.d/*.sh in
# name order, so the name sorts after the usual ones.
cis_shell_dropin: /etc/profile.d/zz-cis-rhel9.sh

# Section 5.4: the Python the account controls run their read-only scanner with
# (files/accounts_scan.py): the interpreter Ansible found on the managed node.
cis_accounts_python: "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"

# Section 1: the benchmark values the checks judge against. They are constants, not variables
# to override: a site that writes a weaker value through a defaults/main.yml variable still
# gets a finding, because the check compares the host with these. Accepted values are strings,
# as the checks read them from the host.

# 1.3.1.1, 1.3.1.7, 1.3.1.8: whether each package should be installed.
cis_expect_libselinux_installed: true
cis_expect_mcstrans_installed: false
cis_expect_setroubleshoot_installed: false

# 1.3.1.2: kernel arguments that must not be on any boot entry.
cis_expect_selinux_forbidden_args:
  - "selinux=0"
  - "enforcing=0"

# 1.3.1.3: the SELinux policy type in /etc/selinux/config.
cis_expect_selinux_policy: targeted

# 1.3.1.5: the SELinux mode, in the configuration and at runtime.
cis_expect_selinux_mode: enforcing

# 1.4.2: the owner and group of the boot loader files, the most permissive mode they may have,
# and the permission bits that mode forbids (the complement of the mode within 0777, as
# find -perm /bits reads it); and the /boot/efi fstab options.
cis_expect_bootloader_file_owner: root
cis_expect_bootloader_file_group: root
cis_expect_bootloader_file_mode: "0600"
cis_expect_bootloader_file_forbidden_bits: "177"
cis_expect_bootloader_efi_uid: "0"
cis_expect_bootloader_efi_gid: "0"
cis_expect_bootloader_efi_umask: "0077"

# 1.5.1 to 1.5.7, 3.3.1.1 to 3.3.2.8: the accepted values of each kernel parameter.
cis_expect_sysctl:
  fs.protected_hardlinks: ["1"]
  fs.protected_symlinks: ["1"]
  fs.suid_dumpable: ["0"]
  kernel.dmesg_restrict: ["1"]
  kernel.kptr_restrict: ["1", "2"]
  kernel.randomize_va_space: ["2"]
  kernel.yama.ptrace_scope: ["1", "2", "3"]

  # 3.3.1.1 to 3.3.1.20 and 3.3.2.1 to 3.3.2.8: network kernel parameters (Section 3).
  net.ipv4.ip_forward: ["0"]
  net.ipv4.conf.all.forwarding: ["0"]
  net.ipv4.conf.default.forwarding: ["0"]
  net.ipv4.conf.all.send_redirects: ["0"]
  net.ipv4.conf.default.send_redirects: ["0"]
  net.ipv4.icmp_ignore_bogus_error_responses: ["1"]
  net.ipv4.icmp_echo_ignore_broadcasts: ["1"]
  net.ipv4.conf.all.accept_redirects: ["0"]
  net.ipv4.conf.default.accept_redirects: ["0"]
  net.ipv4.conf.all.secure_redirects: ["0"]
  net.ipv4.conf.default.secure_redirects: ["0"]
  net.ipv4.conf.all.rp_filter: ["1"]
  net.ipv4.conf.default.rp_filter: ["1"]
  net.ipv4.conf.all.accept_source_route: ["0"]
  net.ipv4.conf.default.accept_source_route: ["0"]
  net.ipv4.conf.all.log_martians: ["1"]
  net.ipv4.conf.default.log_martians: ["1"]
  net.ipv4.tcp_syncookies: ["1"]
  net.ipv4.conf.all.route_localnet: ["0"]
  net.ipv4.conf.default.route_localnet: ["0"]
  net.ipv6.conf.all.forwarding: ["0"]
  net.ipv6.conf.default.forwarding: ["0"]
  net.ipv6.conf.all.accept_redirects: ["0"]
  net.ipv6.conf.default.accept_redirects: ["0"]
  net.ipv6.conf.all.accept_source_route: ["0"]
  net.ipv6.conf.default.accept_source_route: ["0"]
  net.ipv6.conf.all.accept_ra: ["0"]
  net.ipv6.conf.default.accept_ra: ["0"]

# 1.5.8: the core file size hard limit. 1.5.9, 1.5.10: the coredump.conf values (compared
# without regard to case).
cis_expect_core_hard_limit: "0"
cis_expect_coredump_process_size_max: "0"
cis_expect_coredump_storage: none

# 1.6.1: the base crypto policy that is not accepted (compared without regard to case).
cis_expect_crypto_policy_forbidden_base: LEGACY

# 1.7.4 to 1.7.6: the owner and group of the banner files and the most permissive mode they
# may have.
cis_expect_banner_file_owner: root
cis_expect_banner_file_group: root
cis_expect_banner_file_mode: "0644"

# 1.8.1 to 1.8.5: the GDM dconf values as dconf prints them, and the accepted delay ranges in
# seconds. 1.8.6, 1.8.7: the values of the custom.conf options that are not accepted, lowercase
# and separated by "|".
cis_expect_gdm_banner_enable: "true"
cis_expect_gdm_disable_user_list: "true"
cis_expect_gdm_idle_delay_min: 1
cis_expect_gdm_idle_delay_max: 900
cis_expect_gdm_lock_delay_min: 0
cis_expect_gdm_lock_delay_max: 5
cis_expect_gdm_automount: "false"
cis_expect_gdm_automount_open: "false"
cis_expect_gdm_autorun_never: "true"
cis_expect_gdm_xdmcp_bad: "true|1"
cis_expect_gdm_wayland_bad: "false|0"
# Section 2: the benchmark values the checks judge against (constants, as for section 1).
# Whether a service or client package is installed is judged in the checks themselves: they
# always want it absent.

# 2.3.1: chrony is installed. 2.3.3: chronyd does not run as root (compared as yes or no).
cis_expect_chrony_installed: true
cis_expect_chronyd_run_as_root: false

# 2.4.1.1: crond is enabled and active.
cis_expect_crond_enabled: true
cis_expect_crond_active: true

# 2.4.1.2 to 2.4.1.8: the owner and group ids (root), the mode of /etc/crontab and of the
# cron directories, and the permission bits each mode forbids (as find -perm /bits reads them).
cis_expect_cron_uid: "0"
cis_expect_cron_gid: "0"
cis_expect_cron_file_mode: "0600"
cis_expect_cron_file_forbidden_bits: "077"
cis_expect_cron_dir_mode: "0700"
cis_expect_cron_dir_forbidden_bits: "077"

# 2.4.1.9, 2.4.2.1: the owner id (root), the groups an allow or deny file may have (root is
# listed), the most permissive mode and the permission bits it forbids (setuid, setgid, sticky,
# and the bits above 0640).
cis_expect_job_allow_uid: "0"
cis_expect_cron_allow_groups: [root, crontab]
cis_expect_at_allow_groups: [root, daemon]
cis_expect_job_allow_mode: "0640"
cis_expect_job_allow_forbidden_bits: "7137"

# 2.1.19: the mail ports, the inet_interfaces tokens and the listening addresses that count as
# loopback only (a trailing * matches any suffix).
cis_expect_mta_ports: ["25", "465", "587"]
cis_expect_mta_interfaces_ok: ["loopback-only", "localhost", "127.*", "::1", "[::1]"]
cis_expect_mta_addresses_ok: ["127.*", "::1", "::ffff:127.*"]

# 2.1.20: the default target that is not accepted.
cis_expect_gui_bad_target: graphical.target

# 4.1.1: firewalld is installed.
cis_expect_firewalld_installed: true

# 4.1.2: the FirewallBackend value the benchmark forbids (compared without regard to case).
# cis_firewalld_backend_unset is not a benchmark value: it is the backend firewalld uses when
# firewalld.conf has no FirewallBackend line.
cis_expect_firewalld_backend_forbidden: iptables
cis_firewalld_backend_unset: nftables

# 4.1.3: firewalld.service is enabled and active (it must also not be masked).
cis_expect_firewalld_enabled: true
cis_expect_firewalld_active: true

# 4.1.4: the target an active zone may not have (an empty target is forbidden too).
cis_expect_firewalld_zone_target_forbidden: ACCEPT

# 4.1.9: nftables.service is neither enabled nor active; iptables-services and ufw are not
# installed.
cis_expect_nftables_enabled: false
cis_expect_nftables_active: false
cis_expect_iptables_services_installed: false
cis_expect_ufw_installed: false

# 4.1.10: the LogDenied value the benchmark forbids.
cis_expect_firewalld_log_denied_forbidden: "off"

# 4.1.11: the zone target the control applies to, and whether the ICMP types are blocked.
cis_expect_firewalld_icmp_zone_target: default
cis_expect_firewalld_icmp_blocked: true

# Section 5: the benchmark values the checks judge against (constants, as in sections 1 to 4).
# What the role writes comes from the cis_* variables in defaults/main.yml.

# 5.1.1 to 5.1.4: the owner and group the SSH files must have, and the permission bits they must
# not have (octal). A private host key may instead be in cis_expect_sshd_key_alt_group with
# the bits of cis_expect_sshd_private_key_alt_forbidden_bits forbidden.
cis_expect_sshd_file_owner: root
cis_expect_sshd_file_group: root
cis_expect_sshd_key_alt_group: ssh_keys
cis_expect_sshd_config_forbidden_bits: "0177"
cis_expect_sshd_dir_forbidden_bits: "0077"
cis_expect_sshd_private_key_forbidden_bits: "0177"
cis_expect_sshd_private_key_alt_forbidden_bits: "0137"
cis_expect_sshd_public_key_forbidden_bits: "0133"

# 5.1.5 to 5.1.7: the algorithms sshd must not offer (separated by spaces).
cis_expect_sshd_weak_ciphers: >-
  3des-cbc blowfish-cbc cast128-cbc aes128-cbc aes192-cbc aes256-cbc arcfour arcfour128
  arcfour256 rijndael-cbc@lysator.liu.se
cis_expect_sshd_weak_macs: >-
  hmac-md5 hmac-md5-96 hmac-ripemd160 hmac-sha1-96 umac-64@openssh.com
  hmac-md5-etm@openssh.com hmac-md5-96-etm@openssh.com hmac-ripemd160-etm@openssh.com
  hmac-sha1-96-etm@openssh.com umac-64-etm@openssh.com
cis_expect_sshd_weak_kex: >-
  diffie-hellman-group1-sha1 diffie-hellman-group14-sha1 diffie-hellman-group-exchange-sha1

# 5.1.10 to 5.1.23: the effective sshd values the benchmark wants (compared without regard to
# case), and the most a limit may be. ClientAliveInterval and ClientAliveCountMax only have to
# be above zero.
cis_expect_sshd_disable_forwarding: "yes"
cis_expect_sshd_gssapi_authentication: "no"
cis_expect_sshd_hostbased_authentication: "no"
cis_expect_sshd_ignore_rhosts: "yes"
cis_expect_sshd_login_grace_time_max: 60
cis_expect_sshd_log_levels: "verbose,info"
cis_expect_sshd_max_auth_tries_max: 4
cis_expect_sshd_max_startups: "10:30:60"
cis_expect_sshd_max_sessions_max: 10
cis_expect_sshd_permit_empty_passwords: "no"
cis_expect_sshd_permit_root_login: "no"
cis_expect_sshd_permit_user_environment: "no"
cis_expect_sshd_use_pam: "yes"

# 5.2: the sudo settings the benchmark wants (sudo itself must be installed). The Defaults flags and values are judged on the
# effective sudoers configuration; timestamp_timeout may be at most the given minutes (0 and no
# line pass), timestamp_type may be anything but the forbidden one.
cis_expect_sudo_use_pty: true
cis_expect_sudo_pwfeedback: false
cis_expect_sudo_visiblepw: false
cis_expect_sudo_timestamp_timeout_max: 15
cis_expect_sudo_timestamp_type_forbidden: global
cis_expect_sudoers_owner: root
cis_expect_sudoers_group: root
cis_expect_sudoers_forbidden_bits: "0337"
cis_expect_sudoers_dir_forbidden_bits: "0027"

# 5.3.1: the least version-release of each package (each must be installed).
cis_expect_pam_min_version: "1.5.1-14"
cis_expect_authselect_min_version: "1.2.6-1"
cis_expect_libpwquality_min_version: "1.4.4-8"

# 5.3.3: the limits of the PAM settings (the range each value may have), and the hashing
# algorithms pam_unix may name.
cis_expect_faillock_deny_min: 1
cis_expect_faillock_deny_max: 5
cis_expect_faillock_unlock_time_min: 900
cis_expect_faillock_root_unlock_time_min: 60
cis_expect_pwquality_difok_min: 2
cis_expect_pwquality_minlen_min: 14
cis_expect_pwquality_maxrepeat_max: 3
cis_expect_pwquality_maxsequence_max: 3
cis_expect_pwhistory_remember_min: 24
cis_expect_pam_hash_algorithms: [sha512, yescrypt]

# 5.3.3.4.3: the hashing algorithms pam_unix accepts as an argument, so the fix can leave only the
# configured one (cis_password_hash) on the password line. Not benchmark values.
cis_pam_unix_hash_names: [md5, bigcrypt, sha256, sha512, blowfish, yescrypt, gost_yescrypt]

# 5.4: the limits of the account settings. cis_expect_umask is the loosest umask that passes
# (027: no more than it allows); the TMOUT limit is in seconds.
cis_expect_pass_max_days_max: 365
cis_expect_pass_warn_age_min: 7
cis_expect_pass_min_days_min: 1
cis_expect_inactive_days_max: 45
cis_expect_umask: "027"
cis_expect_tmout_max: 900
cis_expect_encrypt_methods: [SHA512, YESCRYPT]
...
