---
# Internal constants for rhel9_cis_benchmarks. Not meant to be overridden.

# The benchmark document this role implements, from its cover page. Preflight and the
# end-of-run summary print the title and version. The version must match the header of
# docs/controls.md and the version prefix of the newest CHANGELOG entry
# (tests/check_benchmark_version.py checks all three).
cis_benchmark:
  title: "CIS Red Hat Enterprise Linux 9 Benchmark"
  version: "3.0.0"
  date: "2026-08-28"

# Preflight: the only platform this role supports.
cis_supported_distribution: RedHat
cis_supported_major_version: "9"

# Selection: the profiles cis_profile accepts. The per-control levels are in
# vars/controls.yml, which preflight loads.
cis_valid_profiles:
  - server
  - workstation

# Section 5.1 (SSH server): the one drop-in the role owns. Its name sorts before
# 50-redhat.conf, because sshd uses the first value it reads for most keywords (MaxStartups
# takes the last value, so a later file can override it).
cis_sshd_dropin: /etc/ssh/sshd_config.d/00-cis-rhel9.conf

# Section 5.2 (sudo): the one sudoers drop-in the role owns. sudo applies the last Defaults
# line it reads and reads /etc/sudoers.d in name order (names with a dot or a trailing ~ are
# skipped), so the name sorts after the usual ones and the role's Defaults win over those of
# the files that sort before it. A Defaults line after the #includedir line in /etc/sudoers
# is read later still and would win; the controls report it.
cis_sudoers_dropin: /etc/sudoers.d/zz-cis-rhel9

# Section 5.2: the Python the sudo controls run their read-only scanner with
# (files/sudoers_scan.py): the interpreter Ansible found on the managed node.
cis_sudo_python: "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"

# Section 5.3 (PAM): the pwquality drop-in the role owns. libpwquality reads pwquality.conf and
# then the files of pwquality.conf.d in name order and the last value of a key wins, so the name
# sorts after the usual ones; a file that sorts after it would win and the controls report it.
cis_pwquality_dropin: /etc/security/pwquality.conf.d/zz-cis-rhel9.conf

# Section 5.3: the Python the PAM controls run their read-only scanner with
# (files/pam_scan.py): the interpreter Ansible found on the managed node.
cis_pam_python: "{{ ansible_facts.python.executable | default('/usr/bin/python3') }}"
...
