---
# Defaults for rhel9_cis_benchmarks. Every variable uses the cis_ prefix and carries a
# comment naming the CIS ID it serves.

# Mode (all CIS IDs): false (remediate) checks and fixes each control; true (audit)
# checks and reports without changing the host. Audit-only and manual controls only
# report, in either mode.
cis_audit_only: false

# Mode (all CIS IDs): true fails each host that ends the run with findings (failing
# checks in audit mode, plus every selected audit-only or manual control), after the
# summary is printed. false only reports them.
cis_fail_on_findings: false

# Selection (all CIS IDs): Level 1 controls always run; set true to add Level 2, which
# includes Level 1.
cis_apply_level_2: false

# Selection (all CIS IDs): which benchmark profile to apply, "server" or "workstation".
# Controls that have no Workstation profile (for example 2.1.20 to 2.1.22, 3.1.2) are
# never selected for "workstation".
cis_profile: server

# Selection (all CIS IDs): your own list of CIS IDs to skip, for example
# ["1.1.1.10", "5.1.21"]. It adds to cis_default_exclusions.
cis_exclusions: []

# Selection (2.1.20, 2.1.21, 2.1.22, 5.2.6): controls skipped by default because they
# can disrupt or lock out a host (they remove the desktop, or require a password for
# sudo, which breaks passwordless become). Override with [] or a shorter list to run
# them; cis_exclusions is unaffected.
cis_default_exclusions:
  - "2.1.20"
  - "2.1.21"
  - "2.1.22"
  - "5.2.6"

# Output (1.1.2.1.1, mount options on /tmp): set to true by any control whose fix only takes
# effect after a reboot. The role never reboots; it sets this flag, the control reports that
# a reboot is pending, and the end-of-run summary prints it. Leave it false: the role sets
# it, and a value you pass in is overwritten when a control needs a reboot.
cis_reboot_required: false

# Section 1 variables. Each one is the value the role enforces exactly (for a package, the state
# it converges to): whenever the host differs from it, the role changes the host to it, also
# when the host is stricter than the benchmark. The default is the benchmark value. The checks
# always judge against the benchmark value (vars/main.yml, cis_expect_*), so a value of yours
# that is weaker than the benchmark's is written and the control reports a finding; exclude the
# control in cis_exclusions to accept that. A value stricter than the benchmark's passes.
# Preflight checks only the type and format of each value, not the benchmark bounds.

# 1.1.1.1 to 1.1.1.10: whether the role blocks (install line to /bin/false plus blacklist) and
# unloads each filesystem or device kernel module. false: the role removes its own modprobe.d
# drop-in for the module (one it did not write is left alone) and the control reports it as not
# blocked.
cis_module_cramfs_blocked: true             # 1.1.1.1
cis_module_freevxfs_blocked: true           # 1.1.1.2
cis_module_hfs_blocked: true                # 1.1.1.3
cis_module_hfsplus_blocked: true            # 1.1.1.4
cis_module_jffs2_blocked: true              # 1.1.1.5
cis_module_overlay_blocked: true            # 1.1.1.6 (Level 2)
cis_module_squashfs_blocked: true           # 1.1.1.7 (Level 2)
cis_module_udf_blocked: true                # 1.1.1.8 (Level 2)
cis_module_firewire_core_blocked: true      # 1.1.1.9
cis_module_usb_storage_blocked: true        # 1.1.1.10

# 1.1.2.1.1: true makes the role enable the tmp.mount unit (for the next boot, not started) when
# /tmp is not a mount point. false: the role does not enable it, and never disables a tmp.mount
# the host already enabled.
cis_tmp_mount_enabled: true

# 1.1.2.1.2 to 1.1.2.7.4: the mount options each mount point holds. Only nodev, nosuid and
# noexec are managed, one per control: a listed option is added (to the fstab entry, the systemd
# unit drop-in for /tmp, or a new /dev/shm fstab entry) and remounted in; an option of the three
# that is not listed is removed from the fstab entry or drop-in and remounted out (nodev to
# dev, nosuid to suid, noexec to exec), and its control reports a finding while the mount
# lacks it. Other options in the fstab entry are never touched.
cis_tmp_mount_options: [nodev, nosuid, noexec]        # 1.1.2.1.2 to 1.1.2.1.4
cis_dev_shm_mount_options: [nodev, nosuid, noexec]    # 1.1.2.2.2 to 1.1.2.2.4
cis_home_mount_options: [nodev, nosuid]               # 1.1.2.3.2, 1.1.2.3.3
cis_var_mount_options: [nodev, nosuid]                # 1.1.2.4.2, 1.1.2.4.3
cis_var_tmp_mount_options: [nodev, nosuid, noexec]    # 1.1.2.5.2 to 1.1.2.5.4
cis_var_log_mount_options: [nodev, nosuid, noexec]    # 1.1.2.6.2 to 1.1.2.6.4
cis_var_log_audit_mount_options: [nodev, nosuid, noexec]  # 1.1.2.7.2 to 1.1.2.7.4

# 1.2.1.2: the gpgcheck value the role holds in dnf.conf and in every repository file (except
# redhat.repo) that sets it. true writes 1, false writes 0.
cis_dnf_gpgcheck: true

# 1.2.1.5 (Level 2): the install_weak_deps value the role holds in dnf.conf. false writes
# False, true writes True.
cis_dnf_install_weak_deps: false

# 1.3.1.1: true installs the libselinux package when missing; false removes it. Removing it
# breaks SELinux tooling; leave it true unless you know the host does not need it.
cis_libselinux_installed: true

# 1.3.1.2: the kernel arguments the role removes from every boot entry that holds one, with
# grubby. An empty list removes nothing.
cis_selinux_remove_boot_args:
  - "selinux=0"
  - "enforcing=0"

# 1.3.1.3: the SELinux policy type the role holds as SELINUXTYPE in /etc/selinux/config (and
# gives ansible.posix.selinux when 1.3.1.4 moves a disabled configuration). It must be
# installed under /etc/selinux/<name>.
cis_selinux_policy: targeted

# 1.3.1.5 (Level 2): the SELinux mode the role sets, in the configuration and at runtime:
# enforcing, permissive or disabled.
cis_selinux_target_mode: enforcing

# 1.3.1.7: true installs the mcstrans package when missing; false removes it when installed.
cis_mcstrans_installed: false

# 1.3.1.8 (Server profile): true installs the setroubleshoot and setroubleshoot-server packages
# when missing; false removes them when installed.
cis_setroubleshoot_installed: false

# 1.4.1: the grub2 password hash, as printed by grub2-mkpasswd-pbkdf2
# ("grub.pbkdf2.sha512.<iterations>.<salt>.<hash>"). Empty (default): 1.4.1 only reports a
# missing password and changes nothing. Set: the role writes it to /boot/grub2/user.cfg.
# The hash is a secret: keep it in an Ansible Vault, not in plain text in an inventory.
cis_grub_password_hash: ""

# 1.4.1, 1.4.2: the owner, group and mode the role sets on /boot/grub2/user.cfg (1.4.1) and on
# grub.cfg, grubenv and user.cfg (1.4.2). The mode is a string in quotes. 1.4.2 sets exactly
# these on each of the files that differs, also when its mode is stricter.
cis_bootloader_file_owner: root
cis_bootloader_file_group: root
cis_bootloader_file_mode: "0600"

# 1.4.2: the options the role holds on the /boot/efi vfat fstab entry (UEFI hosts): uid, gid and
# umask (a string in quotes), in place of any uid, gid, umask, fmask or dmask it finds.
cis_bootloader_efi_uid: 0
cis_bootloader_efi_gid: 0
cis_bootloader_efi_umask: "0077"

# 1.4.3 (Level 2), 1.4.4 (Level 2): the ExecStart line the role writes in its drop-in for
# rescue.service and emergency.service when the effective command is not this one.
cis_rescue_exec_start: "-/usr/lib/systemd/systemd-sulogin-shell rescue"
cis_emergency_exec_start: "-/usr/lib/systemd/systemd-sulogin-shell emergency"

# 1.4.5: the ConfirmSpawn value the role holds in each systemd configuration file that sets it
# (false writes no, true writes yes), and whether it removes the systemd.confirm_spawn
# argument from every boot entry with grubby.
cis_systemd_confirm_spawn: false
cis_remove_confirm_spawn_boot_arg: true

# 1.5.1 to 1.5.7: the value the role holds, in its sysctl file and live, whenever the configured
# or the running value is another one (a stricter value is replaced too). A whole number.
cis_sysctl_fs_protected_hardlinks: 1       # 1.5.1
cis_sysctl_fs_protected_symlinks: 1        # 1.5.2 (Level 2)
cis_sysctl_fs_suid_dumpable: 0             # 1.5.3
cis_sysctl_kernel_dmesg_restrict: 1        # 1.5.4
cis_sysctl_kernel_kptr_restrict: 1         # 1.5.5
cis_sysctl_kernel_randomize_va_space: 2    # 1.5.6
cis_sysctl_kernel_yama_ptrace_scope: 1     # 1.5.7

# 1.5.8: the core file size hard limit the role holds for every user ("* hard core <value>"),
# in its own limits.d file, whenever the effective wildcard limit is another one. A whole number.
cis_core_hard_limit: 0

# 1.5.9: the ProcessSizeMax the role holds, in its coredump.conf.d drop-in, whenever the effective
# value is another one. A whole number or a size such as 2G.
cis_coredump_process_size_max: "0"

# 1.5.10: the Storage the role holds, in its coredump.conf.d drop-in (none, external, journal).
cis_coredump_storage: none

# 1.6.1: the base crypto policy the role holds: a different base (not a FIPS one) is replaced with
# it. Modules already in the policy are kept.
cis_crypto_policy_base: DEFAULT

# 1.6.2: the shipped policy module the role keeps in the policy string (appended when missing).
cis_crypto_policy_module_sha1: NO-SHA1

# 1.6.3: the policy module the role writes and keeps in the policy string, and the MAC patterns
# it removes (each is written with a leading minus into the module's mac line).
cis_crypto_policy_module_mac: CIS-NO-WEAKMAC
cis_crypto_policy_mac_excluded:
  - "*-64"
  - "*-MD5"

# 1.6.4: the policy module the role writes and keeps in the policy string, and the cipher
# patterns it removes (each with a leading minus, in the module's cipher@SSH line).
cis_crypto_policy_module_sshcbc: CIS-NO-SSHCBC
cis_crypto_policy_ssh_ciphers_excluded:
  - "*-CBC"

# 1.6.7 (Level 2): the shipped policy module the role keeps in the policy string, to offer
# post-quantum key exchange groups.
cis_crypto_policy_module_pq: PQ

# 1.7.1, 1.7.2, 1.7.3 and 1.7.4, 1.7.5, 1.7.6: the banner files. 1.7.1 to 1.7.3 check and
# write the text, 1.7.4 to 1.7.6 their owner and mode.
cis_motd_path: /etc/motd
cis_issue_path: /etc/issue
cis_issue_net_path: /etc/issue.net

# 1.7.1, 1.7.2, 1.7.3, 1.8.1: the text the role holds in the three banner files and as the GDM
# login banner. Whenever a file or the banner differs from it, the role replaces it, also when
# the current text is compliant: a site's own banner is overwritten, so set your text here. Keep
# it free of the escapes \m \r \s \v and of the operating system name, or the controls can
# never pass.
cis_banner_text: "This computer is for approved users and purposes only. Use of it may be logged and reviewed."

# 1.7.1 to 1.7.6: the owner, group and mode of the banner files. 1.7.1 to 1.7.3 give a new
# file this owner, group and mode; 1.7.4 to 1.7.6 set exactly these on an existing file that
# differs (a stricter mode is replaced too). The mode is a string in quotes.
cis_banner_file_owner: root
cis_banner_file_group: root
cis_banner_file_mode: "0644"

# 1.8.1: whether the GDM login banner is enabled (banner-message-enable); its text is
# cis_banner_text.
cis_gdm_banner_enable: true

# 1.8.2: the disable-user-list value the role writes.
cis_gdm_disable_user_list: true

# 1.8.3: the idle-delay, in seconds, the role holds whenever the configured one is another one
# (the benchmark accepts 1 to 900; 0 means never and is not accepted).
cis_gdm_idle_delay: 900

# 1.8.3: the lock-delay, in seconds, the role holds whenever the configured one is another one
# (the benchmark accepts 0 to 5).
cis_gdm_lock_delay: 5

# 1.8.4: the automount and automount-open values the role writes.
cis_gdm_automount: false
cis_gdm_automount_open: false

# 1.8.5: the autorun-never value the role writes.
cis_gdm_autorun_never: true

# 1.8.6: the Enable value the role holds in the [xdmcp] section of /etc/gdm/custom.conf (not set
# counts as false).
cis_gdm_xdmcp_enable: false

# 1.8.7: what the role holds for WaylandEnable in the [daemon] section of /etc/gdm/custom.conf:
# "absent" removes the line (GDM then uses its default), "true" sets it to true.
cis_gdm_wayland_enable: absent

# Section 2 variables. As for section 1, each one is the value the role enforces exactly (for a
# package, the state it converges to): whenever the host differs from it, the role changes the
# host to it, also when the host is stricter than the benchmark. The default is the benchmark
# value. The checks judge against the benchmark value (vars/main.yml, cis_expect_*), so a value
# of yours that is weaker than the benchmark's is written and the control reports a finding on
# every run; exclude the control in cis_exclusions to accept that. Preflight checks only the
# type and format of each value.

# Services (2.1.1 to 2.1.22, and 3.1.3 for bluetooth): CIS IDs of the service controls whose
# service the site needs. A listed control is skipped completely: nothing is removed, stopped
# or masked, nothing is installed even when its package variable below is true, and no finding
# is recorded. cis_services_keep wins over the package variables. Example: ["2.1.1", "2.1.10"]
# keeps autofs and the NFS server; "3.1.3" keeps bluetooth.
cis_services_keep: []

# Service packages (2.1.1 to 2.1.18, 2.1.21, 2.1.22) and client packages (2.2.1 to 2.2.4):
# whether each package should be installed. The benchmark wants every one absent. false: the
# role removes the package when no other installed package needs it; one that another package
# needs stays installed and its service units are stopped and masked instead (clients: it stays
# and is reported); dependents are never removed (2.1.21 and 2.1.22 are the exception: they
# remove the package with everything that depends on it, and are skipped by default). true: the
# role installs the package when missing and leaves its service units alone; the control then
# reports a finding on every run. Set the packages that depend on each other together (cockpit
# and cockpit-ws, the X server and Xwayland).
cis_autofs_installed: false                 # 2.1.1
cis_avahi_installed: false                  # 2.1.2
cis_cockpit_installed: false                # 2.1.3 (Level 2)
cis_cockpit_ws_installed: false             # 2.1.3 (Level 2)
cis_dhcp_server_installed: false            # 2.1.4 (package dhcp-server)
cis_bind_installed: false                   # 2.1.5
cis_dnsmasq_installed: false                # 2.1.6
cis_samba_installed: false                  # 2.1.7
cis_vsftpd_installed: false                 # 2.1.8
cis_dovecot_installed: false                # 2.1.9
cis_cyrus_imapd_installed: false            # 2.1.9
cis_nfs_utils_installed: false              # 2.1.10
cis_cups_installed: false                   # 2.1.11
cis_rpcbind_installed: false                # 2.1.12
cis_rsync_daemon_installed: false           # 2.1.13
cis_net_snmp_installed: false               # 2.1.14
cis_telnet_server_installed: false          # 2.1.15
cis_tftp_server_installed: false            # 2.1.16
cis_squid_installed: false                  # 2.1.17
cis_httpd_installed: false                  # 2.1.18
cis_nginx_installed: false                  # 2.1.18
cis_x_server_installed: false               # 2.1.21 (Level 2; package xorg-x11-server-common)
cis_xwayland_installed: false               # 2.1.22 (Level 2; package xorg-x11-server-Xwayland)
cis_ftp_client_installed: false             # 2.2.1 (package ftp)
cis_ldap_client_installed: false            # 2.2.2 (Level 2; package openldap-clients)
cis_telnet_client_installed: false          # 2.2.3 (package telnet)
cis_tftp_client_installed: false            # 2.2.4 (package tftp)

# 2.1.19: the inet_interfaces value the role holds in the postfix configuration (postconf -e)
# whenever the current one differs from it, also when the current one is already loopback only
# in another spelling. A comma separated list of interface names or addresses, or loopback-only.
# postfix is restarted only when it is running. Another MTA is never edited.
cis_postfix_inet_interfaces: loopback-only

# 2.1.20 (Level 2 Server, skipped by default): whether the graphical user interface (the
# "Server with GUI" environment group, with gdm and gnome-shell) should be installed. false
# removes it; true installs the group when it is missing. And the default systemd target the
# role holds (the link systemctl set-default makes): multi-user.target or graphical.target.
cis_gui_installed: false
cis_default_target: multi-user.target

# 2.3.1: whether chrony should be installed. true only installs it; the role never enables or
# starts chronyd and leaves the package's defaults alone. false removes it when no other installed package
# needs it; one that another package needs stays installed and chronyd is stopped and masked
# instead. The benchmark wants it installed, so false is reported as a finding on every run.
cis_chrony_installed: true

# Time synchronization (2.3.2): the time sources chrony should have. Each item is a full directive
# line, for example "server time.example.com iburst" or "pool pool.example.com iburst". Empty
# (default): the host's sources are left alone, and a host with no source at all is only
# reported. Non-empty: the role enforces the list exactly. The server and pool lines in
# /etc/chrony.conf and in the files it includes (include, confdir, and the sourcedir *.sources
# files; never the DHCP directory) become exactly the list: other server and pool lines are
# removed, missing ones are appended to /etc/chrony.conf, and nothing else is touched. chronyd
# is restarted only on a change and when it is running. An item that is not a server or pool
# line stops the fix.
cis_time_sources: []

# 2.3.3: whether chronyd runs as root (a "-u root" option in OPTIONS of /etc/sysconfig/chronyd).
# false removes that option and keeps the other options; true makes "-u root" the only user
# option. The benchmark wants false, so true is reported as a finding on every run. chronyd is
# restarted only when it is running.
cis_chronyd_run_as_root: false

# 2.4.1.1: whether the cronie package should be installed. null (default) leaves it alone: the
# benchmark judges cron only when it is installed, so the cron controls apply only then. true
# installs it when missing (install only: the control's own remediation then enables and starts
# crond); false removes it when no other installed package needs it, otherwise it stays and crond
# is stopped and masked. true, false or null only.
cis_cronie_installed: null

# 2.4.1.1: whether crond is enabled and whether it is active. The role unmasks, enables and
# starts it, or stops and disables it, to match; a value of false is reported as a finding.
cis_crond_enabled: true
cis_crond_active: true

# 2.4.1.2 to 2.4.1.8: the owner and group the role sets on /etc/crontab and the /etc/cron.*
# directories, the mode of /etc/crontab (a file) and the mode of the directories, whenever they
# differ (a stricter mode is replaced). Quote modes. A path that is missing is never created.
cis_cron_owner: root
cis_cron_group: root
cis_cron_file_mode: "0600"
cis_cron_dir_mode: "0700"

# 2.4.1.9, 2.4.2.1: the owner, group and mode the role sets on the allow and deny files of cron
# and of at, whenever they differ (a stricter mode is replaced). A group that does not exist on
# the host is replaced by root. The benchmark accepts root or the named group (crontab, daemon).
cis_cron_allow_owner: root
cis_cron_allow_group: crontab
cis_cron_allow_mode: "0640"
cis_at_allow_owner: root
cis_at_allow_group: daemon
cis_at_allow_mode: "0640"

# Job schedulers (2.4.1.9): users to add to /etc/cron.allow when they are not already in it.
# Users already in the file are never removed. IMPORTANT: with the default empty list, a host
# that had no /etc/cron.allow gets an empty one, and from then on only root can use crontab
# (the deny file is ignored once the allow file exists). List every account that needs cron,
# for example ["backup", "appuser"]. Must be a list of plain login names; preflight stops
# the run on anything else.
cis_cron_allow_users: []

# 2.4.2.1: whether the at package should be installed. null (default) leaves it alone: the control
# applies only when at is installed. true installs it when missing; false removes it when no
# other installed package needs it, otherwise it stays and atd is stopped and masked. true or
# false or null only.
cis_at_installed: null

# Job schedulers (2.4.2.1): users to add to /etc/at.allow, with the same rules as
# cis_cron_allow_users. IMPORTANT: with the default empty list, a host that had no
# /etc/at.allow gets an empty one, and from then on only root can use at. Invalid names stop
# the run at preflight.
cis_at_allow_users: []

# Section 3 variables. As for sections 1 and 2, each one is the value the role enforces exactly
# (for a package or a kernel module, the state it converges to): whenever the host differs from
# it, the role changes the host to it, also when the host is stricter than the benchmark. The
# default is the benchmark value. The checks judge against the benchmark value (vars/main.yml,
# cis_expect_*), so a value of yours that is weaker than the benchmark's is written and the
# control reports a finding on every run; exclude the control in cis_exclusions to accept that.
# Preflight checks only the type and format of each value.

# 3.1.2: whether the role blocks (install line to /bin/false plus blacklist) and unloads the
# driver module of each wireless interface it finds. false: the role removes its own modprobe.d
# drop-ins for those drivers (a file it did not write is left alone), loads and unloads nothing,
# and 3.1.2 reports a finding while a wireless interface exists.
cis_module_wireless_blocked: true

# 3.1.3: whether the bluez package should be installed. false removes it when no other installed
# package needs it, otherwise stops and masks bluetooth.service. true installs it when missing and
# leaves the unit alone; the control then reports a finding on every run. cis_services_keep
# listing 3.1.3 wins: nothing is installed or removed.
cis_bluez_installed: false

# 3.2.1 to 3.2.6: whether the role blocks (install line to /bin/false plus blacklist) and unloads
# each network protocol kernel module. false: the role removes its own modprobe.d drop-in for the
# module (one it did not write is left alone) and the control reports it as not blocked.
cis_module_dccp_blocked: true               # 3.2.1
cis_module_tipc_blocked: true               # 3.2.2
cis_module_rds_blocked: true                # 3.2.3
cis_module_sctp_blocked: true               # 3.2.4
cis_module_atm_blocked: true                # 3.2.5
cis_module_can_blocked: true                # 3.2.6

# 3.3.1.1 to 3.3.1.20 (IPv4) and 3.3.2.1 to 3.3.2.8 (IPv6): the value the role holds for each
# kernel parameter, in its sysctl file (/etc/sysctl.d/99-zz-cis-benchmarks.conf) and live,
# whenever the configured or the running value is another one (a stricter value is replaced too).
# A whole number. The 3.3.2 controls are skipped, with no finding, while IPv6 is disabled on the
# host.
cis_sysctl_net_ipv4_ip_forward: 0                           # 3.3.1.1
# net.ipv4.conf.all.forwarding is the same kernel setting as net.ipv4.ip_forward, so it follows
# cis_sysctl_net_ipv4_ip_forward; preflight refuses the two at different values.
cis_sysctl_net_ipv4_conf_all_forwarding: "{{ cis_sysctl_net_ipv4_ip_forward }}"  # 3.3.1.2
cis_sysctl_net_ipv4_conf_default_forwarding: 0              # 3.3.1.3
cis_sysctl_net_ipv4_conf_all_send_redirects: 0              # 3.3.1.4
cis_sysctl_net_ipv4_conf_default_send_redirects: 0          # 3.3.1.5
cis_sysctl_net_ipv4_icmp_ignore_bogus_error_responses: 1    # 3.3.1.6
cis_sysctl_net_ipv4_icmp_echo_ignore_broadcasts: 1          # 3.3.1.7
cis_sysctl_net_ipv4_conf_all_accept_redirects: 0            # 3.3.1.8
cis_sysctl_net_ipv4_conf_default_accept_redirects: 0        # 3.3.1.9
cis_sysctl_net_ipv4_conf_all_secure_redirects: 0            # 3.3.1.10
cis_sysctl_net_ipv4_conf_default_secure_redirects: 0        # 3.3.1.11
cis_sysctl_net_ipv4_conf_all_rp_filter: 1                   # 3.3.1.12
cis_sysctl_net_ipv4_conf_default_rp_filter: 1               # 3.3.1.13
cis_sysctl_net_ipv4_conf_all_accept_source_route: 0         # 3.3.1.14
cis_sysctl_net_ipv4_conf_default_accept_source_route: 0     # 3.3.1.15
cis_sysctl_net_ipv4_conf_all_log_martians: 1                # 3.3.1.16
cis_sysctl_net_ipv4_conf_default_log_martians: 1            # 3.3.1.17
cis_sysctl_net_ipv4_tcp_syncookies: 1                       # 3.3.1.18
cis_sysctl_net_ipv4_conf_all_route_localnet: 0              # 3.3.1.19
cis_sysctl_net_ipv4_conf_default_route_localnet: 0          # 3.3.1.20
cis_sysctl_net_ipv6_conf_all_forwarding: 0                  # 3.3.2.1
cis_sysctl_net_ipv6_conf_default_forwarding: 0              # 3.3.2.2
cis_sysctl_net_ipv6_conf_all_accept_redirects: 0            # 3.3.2.3
cis_sysctl_net_ipv6_conf_default_accept_redirects: 0        # 3.3.2.4
cis_sysctl_net_ipv6_conf_all_accept_source_route: 0         # 3.3.2.5
cis_sysctl_net_ipv6_conf_default_accept_source_route: 0     # 3.3.2.6
cis_sysctl_net_ipv6_conf_all_accept_ra: 0                   # 3.3.2.7
cis_sysctl_net_ipv6_conf_default_accept_ra: 0               # 3.3.2.8

# Section 4 variables. As for sections 1 to 3, each one is the value the role enforces exactly
# (for a package or a service, the state it converges to): whenever the host differs from it, the
# role changes the host to it, also when the host is stricter than the benchmark. The default is
# the benchmark value. The checks judge against the benchmark value (vars/main.yml,
# cis_expect_*), so a value of yours that is weaker than the benchmark's is written and the
# control reports a finding on every run; exclude the control in cis_exclusions to accept that.
# Preflight checks only the type and format of each value. The SSH guard
# (tasks/lib/firewalld_ssh_guard.yml) is not a variable: starting firewalld or nftables.service
# and replacing an ACCEPT zone target happen only when SSH is already allowed, whatever these say.

# 4.1.1: whether firewalld should be installed. true installs it when missing (install only: 4.1.3
# decides whether it runs). false removes it when no other installed package needs it, otherwise it
# stays installed and firewalld.service is stopped and masked, and 4.1.3 leaves the service alone.
# false is reported as a finding.
cis_firewalld_installed: true

# 4.1.2: the FirewallBackend the role holds in /etc/firewalld/firewalld.conf. One of nftables or
# iptables. A missing line counts as firewalld's own default (nftables); firewalld is restarted
# only when it runs. iptables is reported as a finding.
cis_firewalld_backend: nftables

# 4.1.3: whether firewalld.service is enabled and whether it is running. The role unmasks (when
# either is true), enables or disables, and starts or stops it to match. Starting it needs the SSH
# guard to allow it. false is reported as a finding. Ignored while cis_firewalld_installed is false.
cis_firewalld_enabled: true
cis_firewalld_active: true

# 4.1.4: the permanent target of every active firewalld zone bound to an interface other than lo or
# virbr*. One of default, ACCEPT, REJECT or DROP. The role sets it whenever the zone's target is
# another one, also when that target is stricter (a DROP zone becomes default). Replacing an ACCEPT
# target needs the SSH guard to allow it. ACCEPT is reported as a finding.
cis_firewalld_zone_target: default

# 4.1.9: whether nftables.service is enabled and whether it is running. With both false the role
# stops, disables and masks it when it is enabled or active. Otherwise it unmasks, enables or
# disables, and starts or stops it to match; starting it needs the SSH guard to allow it, because
# the ruleset it loads is the site's own. true is reported as a finding. The nftables package is
# never installed or removed.
cis_nftables_service_enabled: false
cis_nftables_service_active: false

# 4.1.9: whether iptables-services (any package providing it, such as iptables-nft-services) and
# ufw should be installed. false removes the package when no other installed package needs it (one
# that is needed is kept and reported). true installs it when missing (install only) and is
# reported as a finding.
cis_iptables_services_installed: false
cis_ufw_installed: false

# 4.1.10 (Level 2): the LogDenied value the role holds, set with firewall-cmd --set-log-denied
# while firewalld runs, else in firewalld.conf. One of off, all, unicast, broadcast or multicast
# (quote "off": YAML reads a bare off as false).
# The role sets it whenever the value is another one, also when that one logs more (all becomes
# unicast). off is reported as a finding.
cis_firewalld_log_denied: unicast

# 4.1.11 (Level 2): whether the ICMP timestamp-request and timestamp-reply types are blocked in
# each active zone whose target is default. false removes the block (or, with icmp-block-inversion
# on, allows the type) and is reported as a finding.
cis_firewalld_icmp_timestamp_request_blocked: true
cis_firewalld_icmp_timestamp_reply_blocked: true

# SSH server (5.1.10): the ClientAliveInterval in seconds and the ClientAliveCountMax written
# when the effective values are not both above zero. A whole number of 1 or more; preflight
# stops the run on anything else. A value already above zero is never changed.
cis_sshd_client_alive_interval: 15
cis_sshd_client_alive_count_max: 3

# SSH server (5.1.15): the LoginGraceTime in seconds written when the effective value is 0 or
# above 60. A whole number from 1 to 60; preflight stops the run on anything else.
cis_sshd_login_grace_time: 60

# SSH server (5.1.16): the LogLevel written when the effective value is neither INFO nor
# VERBOSE. INFO or VERBOSE; preflight stops the run on anything else.
cis_sshd_log_level: INFO

# SSH server (5.1.17): the MaxAuthTries written when the effective value is above 4. A whole
# number from 1 to 4; preflight stops the run on anything else.
cis_sshd_max_auth_tries: 4

# SSH server (5.1.18): the MaxStartups written when any of its three numbers is above
# 10:30:60. Three whole numbers start:rate:full, at most 10, 30 and 60 and at least 1;
# preflight stops the run on anything else.
cis_sshd_max_startups: "10:30:60"

# SSH server (5.1.19): the MaxSessions written when the effective value is above 10. A whole
# number from 1 to 10; preflight stops the run on anything else.
cis_sshd_max_sessions: 10

# SSH server (5.1.8): who may log in over SSH, written to AllowUsers, AllowGroups, DenyUsers
# and DenyGroups in the role's sshd drop-in. A non-empty list is written; an empty one leaves
# that directive alone. While all four are empty and none is in effect, 5.1.8 is only a
# finding and nothing changes. IMPORTANT: an allow list locks out every account not in it
# (or in no listed group), and a deny list every account in it. The role writes the lists
# only when the account it is connected as (the SSH login) is still allowed by the result;
# otherwise it changes nothing and says why. List every account that needs SSH, including
# the one Ansible uses. Plain user and group names only (letters, digits, underscore, dot
# and hyphen, not starting with a digit or hyphen); preflight stops the run on anything else.
cis_sshd_allow_users: []
cis_sshd_allow_groups: []
cis_sshd_deny_users: []
cis_sshd_deny_groups: []

# sudo (5.2.5): the log file path written as `Defaults logfile=...` when no sudo log file is
# set. An absolute path of letters, digits, underscore, dot, hyphen and slash; preflight
# stops the run on anything else. A log file the site already set is left alone. Rotate it
# (logrotate) to keep it from filling the disk.
cis_sudo_logfile: /var/log/sudo.log

# sudo (5.2.10): the timestamp_timeout in minutes written when the effective value is above
# 15 or disables the timeout (a negative number). A whole number from 1 to 15. A stricter
# value that is already set (0 to 15) is never loosened.
cis_sudo_timestamp_timeout: 15

# su (5.2.12): the group pam_wheel allows to use su. The role creates it empty when missing
# and never adds or removes members; a group that already has members is a finding. A plain
# group name (lowercase letters, digits, underscore and hyphen, starting with a letter or
# underscore); preflight stops the run on anything else.
cis_su_group: sugroup

# PAM (5.3.2.1): the name of the authselect profile the role creates, based on sssd, and
# selects on a host authselect does not manage yet (the profile is /etc/authselect/custom/<name>).
# A host already managed by an authselect profile keeps it. Lowercase letters, digits, underscore
# and hyphen, starting with a letter, at most 32 characters, and not the name of a stock profile
# (minimal, sssd, winbind, nis); preflight stops the run on anything else.
cis_authselect_profile: cis-rhel9

# pam_faillock (5.3.3.1.1 to 5.3.3.1.3), written to /etc/security/faillock.conf when the value
# there is not compliant. cis_faillock_deny: from 1 to 5. cis_faillock_unlock_time: seconds, 0
# (never unlocked automatically) or from 900 to 604800. cis_faillock_root_unlock_time (Level 2):
# seconds, from 60 to 604800, used only to replace a root_unlock_time below 60 that is already
# set; the role adds even_deny_root, which locks root like any account. A stricter value that
# is already set (a lower deny, a longer unlock_time) is never loosened. Preflight stops the run
# on anything else.
cis_faillock_deny: 5
cis_faillock_unlock_time: 900
cis_faillock_root_unlock_time: 60

# pam_pwquality (5.3.3.2.1, 5.3.3.2.2, 5.3.3.2.4, 5.3.3.2.5), written to the role's own file
# in /etc/security/pwquality.conf.d when the value in effect is not compliant. cis_pwquality_difok:
# at least 2. cis_pwquality_minlen: at least 14. cis_pwquality_maxrepeat and
# cis_pwquality_maxsequence: from 1 to 3. A stricter value already set anywhere is never
# loosened. Preflight stops the run on anything else.
cis_pwquality_difok: 2
cis_pwquality_minlen: 14
cis_pwquality_maxrepeat: 3
cis_pwquality_maxsequence: 3

# pam_pwhistory (5.3.3.3.1): the number of passwords remembered, written to
# /etc/security/pwhistory.conf when the value there is below 24. A whole number from 24 to 400.
cis_pwhistory_remember: 24

# Password aging (5.4.1.1, 5.4.1.3, 5.4.1.5). Set in /etc/login.defs (PASS_MAX_DAYS,
# PASS_WARN_AGE), in the useradd defaults (INACTIVE) and, with chage, on every existing account
# that has a password hash, when its value is not compliant. cis_pass_max_days: from 1 to 365.
# cis_pass_warn_age: 7 or more. cis_inactive_days: from 0 to 45. A stricter value already set
# (a lower maximum, a longer warning, a shorter inactive period) is never loosened. An account
# whose password would already be expired or inactive with the new value (a last change of 0, no
# last change date, a password older than the maximum) is skipped and reported, never changed.
# Accounts without a hash (locked, no password) are left alone. Preflight stops the run on
# anything else.
cis_pass_max_days: 365
cis_pass_warn_age: 7
cis_inactive_days: 45

# Default umask (5.4.2.6, 5.4.3.3, 5.4.3.4): the UMASK written to /etc/login.defs, the umask line
# of the role's /etc/profile.d file and of root's .bash_profile and .bashrc. Three or four octal
# digits, 027 or more restrictive, in quotes (an unquoted 027 is the number 23 in YAML).
# Preflight stops the run on anything else.
cis_umask: "027"

# Interactive shell timeout (5.4.3.2): TMOUT in seconds, from 1 to 900, written readonly and
# exported to the role's /etc/profile.d file when no file sets TMOUT. A TMOUT set elsewhere is
# judged, never edited.
cis_tmout: 900

# System accounts 5.4.2.7 and 5.4.2.8 must not touch (login names): the role leaves their shell
# and lock state alone and reports them. Accounts with a running process, root, and the account
# the role is connected as (and the one it becomes) are always left alone, whatever this says.
# Plain login names; preflight stops the run on anything else.
cis_account_exceptions: []
