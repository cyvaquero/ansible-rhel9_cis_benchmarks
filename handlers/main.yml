---
# Handlers are notified by name; keep the names stable.

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Restart chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted

# auditd.service sets RefuseManualStop, so systemd rejects a restart or stop through the
# service module. Its own service wrapper is the supported way to signal the daemon, so
# the command-instead-of-module rule is waived for this one task.
- name: Reload auditd
  ansible.builtin.command: /usr/sbin/service auditd reload  # noqa: command-instead-of-module
  changed_when: true

# Loads the rules assembled in /etc/audit/rules.d into the running kernel.
- name: Load audit rules
  ansible.builtin.command: /usr/sbin/augenrules --load
  changed_when: true

# try-restart restarts a running unit and leaves a stopped one alone, so a firewalld that
# is not running is never started here (that is 4.1.3's decision, behind the SSH guard).
# The systemd module has no try-restart state, so the command-instead-of-module rule is
# waived for this one task.
- name: Restart firewalld when running
  ansible.builtin.command: /usr/bin/systemctl try-restart firewalld.service  # noqa: command-instead-of-module
  changed_when: true

- name: Reload sysctl
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true

# Checks the whole sshd configuration with sshd -t first, so a bad configuration never
# reaches a reload, then reloads sshd only when it is running (try-reload-or-restart leaves a
# stopped unit alone and reloads, never restarts, a unit that has ExecReload, as sshd does).
# A host without sshd has nothing to reload. The systemd module has no such state, so the
# command-instead-of-module rule is waived.
- name: Reload sshd when running
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv:
      - /bin/sh
      - -c
      - '[ ! -x /usr/sbin/sshd ] || { /usr/sbin/sshd -t && /usr/bin/systemctl try-reload-or-restart sshd.service; }'
  changed_when: true
...
